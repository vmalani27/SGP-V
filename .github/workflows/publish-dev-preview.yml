name: publish-dev-preview

on:
  push:
    branches:
      - 'feature/**'
      - 'feature-*'
      - 'fix/**'
      - 'fix-*'
      - 'preview/**'
      - 'preview-*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to publish preview for (defaults to current branch)'
        required: false
        type: string
        default: ''
      force_build_all:
        description: 'Force build and push all images'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: dev-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
  CDN_URL: ${{ vars.CDN_URL }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
  DYNAMODB_REGION: ${{ vars.DYNAMODB_REGION }}
  DYNAMODB_TABLE_BASE_IMAGES: ${{ vars.DYNAMODB_TABLE_BASE_IMAGES }}
  DYNAMODB_TABLE_APPS: ${{ vars.DYNAMODB_TABLE_APPS }}
  DYNAMODB_TABLE_LABS: ${{ vars.DYNAMODB_TABLE_LABS }}

jobs:
  # ── RESOLVE BRANCH SLUG & DETECT CHANGES ───────────────────────
  setup-slug:
    name: Resolve Branch Slug & Detect Changes
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      branch: ${{ steps.slug.outputs.branch }}
      workflow: ${{ steps.filter.outputs.workflow }}
      frontend: ${{ steps.filter.outputs.frontend }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      content_sync: ${{ steps.filter.outputs.content_sync }}
      proxy: ${{ steps.filter.outputs.proxy }}
      lab_ubuntu: ${{ steps.filter.outputs.lab_ubuntu }}
      lab_docker: ${{ steps.filter.outputs.lab_docker }}
      lab_docker_fundamentals: ${{ steps.filter.outputs.lab_docker_fundamentals }}
      lab_docker_build: ${{ steps.filter.outputs.lab_docker_build }}
      lab_git_fundamentals: ${{ steps.filter.outputs.lab_git_fundamentals }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Branch Slug
        id: slug
        run: |
          RAW_BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          SLUG=$(echo "${RAW_BRANCH}" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-40)
          echo "branch=${RAW_BRANCH}" >> $GITHUB_OUTPUT
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          echo "Branch: ${RAW_BRANCH} -> Slug: ${SLUG}"

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref_name }}
          filters: |
            workflow:
              - '.github/workflows/publish-dev-preview.yml'
              - 'scripts/manage_image_registry.py'
            frontend:
              - 'next-app/**'
            orchestrator:
              - 'orchestrator/app/**'
              - 'orchestrator/Dockerfile'
              - 'orchestrator/requirements.txt'
            content_sync:
              - 'sidecars/content-sync/**'
            proxy:
              - 'proxy/**'
            lab_ubuntu:
              - 'orchestrator/lab-images/Dockerfile.ubuntu'
            lab_docker:
              - 'orchestrator/lab-images/Dockerfile.docker'
            lab_docker_fundamentals:
              - 'orchestrator/lab-images/Dockerfile.docker-fundamentals'
            lab_docker_build:
              - 'orchestrator/lab-images/Dockerfile.docker-build'
            lab_git_fundamentals:
              - 'orchestrator/lab-images/Dockerfile.git-fundamentals'

  # ── 1. BUILD & PACK CURRICULUM CONTENT ───────────────────────────
  build-content:
    name: Build Preview Content
    needs: setup-slug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Validate Curriculum Content
        run: python scripts/validate_content.py content-v2/

      - name: Generate Content Manifest & Tarball
        run: python scripts/generate_manifest.py content-v2/ out/

      - name: Upload Content Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-content-out
          path: out/
          retention-days: 1

  # ── 2. BUILD & PUSH OCI IMAGES FOR BRANCH PREVIEW ────────────────
  build-images:
    name: Build & Push OCI Images (Preview)
    needs: setup-slug
    runs-on: ubuntu-latest
    environment: dev
    env:
      ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
      CDN_URL: ${{ vars.CDN_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DynamoDB Client
        run: pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Images
        id: docker-build
        run: |
          REG="${{ env.ECR_PUBLIC_REGISTRY }}"
          SLUG="${{ needs.setup-slug.outputs.slug }}"
          SHA_TAG="${SLUG}-${GITHUB_SHA::7}"
          FORCE="${{ github.event.inputs.force_build_all == 'true' }}"

          echo "Checking DynamoDB state for branch slug: ${SLUG}..."
          python scripts/manage_image_registry.py check-missing --slug "${SLUG}" > missing.json
          cat missing.json

          NEED_FE=$(jq -r '.frontend' missing.json)
          NEED_ORCH=$(jq -r '.orchestrator' missing.json)
          NEED_SYNC=$(jq -r '."content-sync"' missing.json)
          NEED_PROXY=$(jq -r '.proxy' missing.json)
          NEED_UBUNTU=$(jq -r '."labops-ubuntu"' missing.json)
          NEED_DOCKER=$(jq -r '."labops-docker"' missing.json)
          NEED_FUND=$(jq -r '."labops-docker-fundamentals"' missing.json)
          NEED_BUILD=$(jq -r '."labops-docker-build"' missing.json)
          NEED_GIT=$(jq -r '."labops-git-fundamentals"' missing.json)

          # 1. Frontend
          if [ "${FORCE}" = "true" ] || [ "${{ needs.setup-slug.outputs.frontend }}" = "true" ] || [ "${NEED_FE}" = "false" ]; then
            echo "==> Building frontend..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-node:20-alpine" \
              -t "${REG}/labops-frontend:${SLUG}" -t "${REG}/labops-frontend:preview-${SLUG}" -t "${REG}/labops-frontend:${SHA_TAG}" --push ./next-app
            FE_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-frontend:${SLUG}" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category app --name frontend \
              --remote "${REG}/labops-frontend:${SLUG}" --digest "${FE_DIGEST}" --commit "${GITHUB_SHA}" --slug "${SLUG}"
          else
            echo "==> Skipping frontend: unchanged and registered in DynamoDB."
          fi

          # 2. Orchestrator
          if [ "${FORCE}" = "true" ] || [ "${{ needs.setup-slug.outputs.orchestrator }}" = "true" ] || [ "${NEED_ORCH}" = "false" ]; then
            echo "==> Building orchestrator..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-python:3.12-alpine" \
              -t "${REG}/labops-orchestrator:${SLUG}" -t "${REG}/labops-orchestrator:preview-${SLUG}" -t "${REG}/labops-orchestrator:${SHA_TAG}" --push ./orchestrator
            ORCH_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-orchestrator:${SLUG}" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category app --name orchestrator \
              --remote "${REG}/labops-orchestrator:${SLUG}" --digest "${ORCH_DIGEST}" --commit "${GITHUB_SHA}" --slug "${SLUG}"
          else
            echo "==> Skipping orchestrator: unchanged and registered in DynamoDB."
          fi

          # 3. Content-Sync
          if [ "${FORCE}" = "true" ] || [ "${{ needs.setup-slug.outputs.content_sync }}" = "true" ] || [ "${NEED_SYNC}" = "false" ]; then
            echo "==> Building content-sync..."
            CLEAN_CDN=$(echo "${{ env.CDN_URL }}" | sed 's|/*$||')
            PREVIEW_CDN="${CLEAN_CDN}/previews/${SLUG}"
            docker buildx build --platform linux/amd64 \
              --build-arg BUILD_BASE_IMAGE="${REG}/labops-golang:1.23-alpine" \
              --build-arg RUNTIME_BASE_IMAGE="${REG}/labops-alpine:3.20" \
              --build-arg DEFAULT_CDN_URL="${PREVIEW_CDN}" \
              -t "${REG}/labops-content-sync:${SLUG}" -t "${REG}/labops-content-sync:preview-${SLUG}" -t "${REG}/labops-content-sync:${SHA_TAG}" --push ./sidecars/content-sync
            SYNC_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-content-sync:${SLUG}" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category app --name content-sync \
              --remote "${REG}/labops-content-sync:${SLUG}" --digest "${SYNC_DIGEST}" --commit "${GITHUB_SHA}" --slug "${SLUG}"
          else
            echo "==> Skipping content-sync: unchanged and registered in DynamoDB."
          fi

          # 4. Proxy
          if [ "${FORCE}" = "true" ] || [ "${{ needs.setup-slug.outputs.proxy }}" = "true" ] || [ "${NEED_PROXY}" = "false" ]; then
            echo "==> Building proxy..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-nginx:1.27-alpine" \
              -t "${REG}/labops-proxy:${SLUG}" -t "${REG}/labops-proxy:preview-${SLUG}" -t "${REG}/labops-proxy:${SHA_TAG}" --push ./proxy
            PROXY_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-proxy:${SLUG}" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category app --name proxy \
              --remote "${REG}/labops-proxy:${SLUG}" --digest "${PROXY_DIGEST}" --commit "${GITHUB_SHA}" --slug "${SLUG}"
          else
            echo "==> Skipping proxy: unchanged and registered in DynamoDB."
          fi

          # 5. Base Ubuntu Lab
          if [ "${FORCE}" = "true" ] || [ "${{ needs.setup-slug.outputs.lab_ubuntu }}" = "true" ] || [ "${NEED_UBUNTU}" = "false" ]; then
            echo "==> Building labops-ubuntu..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-ubuntu:22.04" \
              -t "${REG}/labops-ubuntu:${SLUG}" -t "${REG}/labops-ubuntu:preview-${SLUG}" -f ./orchestrator/lab-images/Dockerfile.ubuntu --push ./orchestrator/lab-images
            UBUNTU_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-ubuntu:${SLUG}" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-ubuntu \
              --remote "${REG}/labops-ubuntu:${SLUG}" --digest "${UBUNTU_DIGEST}" --commit "${GITHUB_SHA}" --slug "${SLUG}" --alias "labops-ubuntu:latest"
          else
            echo "==> Skipping labops-ubuntu: unchanged and registered in DynamoDB."
          fi

          # 6. Docker (DinD) Lab
          if [ "${FORCE}" = "true" ] || [ "${{ needs.setup-slug.outputs.lab_docker }}" = "true" ] || [ "${{ needs.setup-slug.outputs.lab_ubuntu }}" = "true" ] || [ "${NEED_DOCKER}" = "false" ]; then
            echo "==> Building labops-docker..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-ubuntu:${SLUG}" \
              -t "${REG}/labops-docker:${SLUG}" -t "${REG}/labops-docker:preview-${SLUG}" -f ./orchestrator/lab-images/Dockerfile.docker --push ./orchestrator/lab-images
            DOCKER_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-docker:${SLUG}" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-docker \
              --remote "${REG}/labops-docker:${SLUG}" --digest "${DOCKER_DIGEST}" --commit "${GITHUB_SHA}" --slug "${SLUG}" --alias "labops-docker:latest"
          else
            echo "==> Skipping labops-docker: unchanged and registered in DynamoDB."
          fi

          # 7. Docker Fundamentals Lab
          if [ "${FORCE}" = "true" ] || [ "${{ needs.setup-slug.outputs.lab_docker_fundamentals }}" = "true" ] || [ "${{ needs.setup-slug.outputs.lab_ubuntu }}" = "true" ] || [ "${NEED_FUND}" = "false" ]; then
            echo "==> Building labops-docker-fundamentals..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-ubuntu:${SLUG}" \
              -t "${REG}/labops-docker-fundamentals:${SLUG}" -t "${REG}/labops-docker-fundamentals:preview-${SLUG}" -f ./orchestrator/lab-images/Dockerfile.docker-fundamentals --push ./orchestrator/lab-images
            FUND_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-docker-fundamentals:${SLUG}" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-docker-fundamentals \
              --remote "${REG}/labops-docker-fundamentals:${SLUG}" --digest "${FUND_DIGEST}" --commit "${GITHUB_SHA}" --slug "${SLUG}" --alias "labops-docker-fundamentals:latest"
          else
            echo "==> Skipping labops-docker-fundamentals: unchanged and registered in DynamoDB."
          fi

          # 8. Docker Build Lab
          if [ "${FORCE}" = "true" ] || [ "${{ needs.setup-slug.outputs.lab_docker_build }}" = "true" ] || [ "${{ needs.setup-slug.outputs.lab_docker }}" = "true" ] || [ "${NEED_BUILD}" = "false" ]; then
            echo "==> Building labops-docker-build..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-docker:${SLUG}" \
              -t "${REG}/labops-docker-build:${SLUG}" -t "${REG}/labops-docker-build:preview-${SLUG}" -f ./orchestrator/lab-images/Dockerfile.docker-build --push ./orchestrator/lab-images
            BUILD_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-docker-build:${SLUG}" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-docker-build \
              --remote "${REG}/labops-docker-build:${SLUG}" --digest "${BUILD_DIGEST}" --commit "${GITHUB_SHA}" --slug "${SLUG}" --alias "labops-docker-build:latest"
          else
            echo "==> Skipping labops-docker-build: unchanged and registered in DynamoDB."
          fi

          # 9. Git Fundamentals Lab
          if [ "${FORCE}" = "true" ] || [ "${{ needs.setup-slug.outputs.lab_git_fundamentals }}" = "true" ] || [ "${{ needs.setup-slug.outputs.lab_ubuntu }}" = "true" ] || [ "${NEED_GIT}" = "false" ]; then
            echo "==> Building labops-git-fundamentals..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-ubuntu:${SLUG}" \
              -t "${REG}/labops-git-fundamentals:${SLUG}" -t "${REG}/labops-git-fundamentals:preview-${SLUG}" -f ./orchestrator/lab-images/Dockerfile.git-fundamentals --push ./orchestrator/lab-images
            GIT_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-git-fundamentals:${SLUG}" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-git-fundamentals \
              --remote "${REG}/labops-git-fundamentals:${SLUG}" --digest "${GIT_DIGEST}" --commit "${GITHUB_SHA}" --slug "${SLUG}" --alias "labops-git-fundamentals:latest"
          else
            echo "==> Skipping labops-git-fundamentals: unchanged and registered in DynamoDB."
          fi

          echo "Exporting images.json from DynamoDB..."
          python scripts/manage_image_registry.py export-manifest --slug "${SLUG}" --output images.json
          cat images.json

      - name: Upload Images Metadata
        uses: actions/upload-artifact@v4
        with:
          name: preview-images-meta
          path: images.json
          retention-days: 1

  # ── 3. PUBLISH PREVIEW MANIFEST & S3 CONTENT ─────────────────────
  publish-preview:
    name: Publish Preview Content to S3 Prefix
    runs-on: ubuntu-latest
    needs: [setup-slug, build-content, build-images]
    environment: dev
    env:
      ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
      CDN_URL: ${{ vars.CDN_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Content Output
        uses: actions/download-artifact@v4
        with:
          name: preview-content-out
          path: out/

      - name: Download Images Metadata
        uses: actions/download-artifact@v4
        with:
          name: preview-images-meta
          path: ./

      - name: Generate Preview Release Manifest
        run: |
          SLUG="${{ needs.setup-slug.outputs.slug }}"
          SHA_TAG="${SLUG}-${GITHUB_SHA::7}"
          CLEAN_CDN=$(echo "${{ env.CDN_URL }}" | sed 's|/*$||')
          PREVIEW_CDN="${CLEAN_CDN}/previews/${SLUG}"
          python scripts/generate_release_manifest.py \
            "${SHA_TAG}" \
            "preview-${SLUG}" \
            out/ \
            images.json \
            --cdn-url "${PREVIEW_CDN}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_AUTH_REGION }}

      - name: Upload Preview Assets to S3
        run: |
          SLUG="${{ needs.setup-slug.outputs.slug }}"
          DEST="s3://${S3_BUCKET}/previews/${SLUG}"

          echo "Uploading isolated preview bundle to ${DEST}..."

          # Immutable content and release version manifest
          aws s3 cp out/published/ "${DEST}/published/" --recursive --cache-control "public, max-age=31536000, immutable"
          aws s3 cp out/releases/ "${DEST}/releases/" --recursive --cache-control "public, max-age=60"

          # Preview root pointers
          aws s3 cp out/catalog.json "${DEST}/catalog.json" --cache-control "public, max-age=60"
          aws s3 cp out/latest.json "${DEST}/latest.json" --cache-control "public, max-age=60"

          # Landing page & assets
          aws s3 cp landing/index.html "${DEST}/index.html" --content-type "text/html" --cache-control "public, max-age=300"
          aws s3 cp landing/assets/ "${DEST}/assets/" --recursive --cache-control "public, max-age=86400"
          if [ -f landing/install.sh ]; then
            SLUG="${{ needs.setup-slug.outputs.slug }}"
            CLEAN_CDN=$(echo "${{ env.CDN_URL }}" | sed 's|/*$||')
            [ -z "$CLEAN_CDN" ] && CLEAN_CDN="https://d3rqfqpemi0u1s.cloudfront.net"
            PREVIEW_BASE="${CLEAN_CDN}/previews/${SLUG}"
            sed "s|__LABOPS_TARGET_BASE_URL__|${PREVIEW_BASE}|g" landing/install.sh > /tmp/install.sh
            aws s3 cp /tmp/install.sh "${DEST}/install.sh" --content-type "text/x-shellscript" --cache-control "public, max-age=60"
          fi

      - name: Invalidate CloudFront Preview Cache
        run: |
          SLUG="${{ needs.setup-slug.outputs.slug }}"
          if [ -n "$CLOUDFRONT_DIST_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CLOUDFRONT_DIST_ID" \
              --paths "/previews/${SLUG}/*"
          fi

  # ── 4. CROSS-COMPILE PREVIEW CLI BINARIES ─────────────────────────
  build-preview-cli:
    name: Build Preview CLI Binaries
    runs-on: ubuntu-latest
    needs: [setup-slug, publish-preview]
    environment: dev
    env:
      ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
      ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
      CDN_URL: ${{ vars.CDN_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            binary: labops-linux-amd64
          - os: windows
            arch: amd64
            binary: labops-windows-amd64.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Compile Binary
        working-directory: ./cli
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CHANNEL: preview-${{ needs.setup-slug.outputs.slug }}
          REGISTRY: ${{ env.ECR_PUBLIC_REGISTRY }}
          CDN: ${{ env.CDN_URL }}/previews/${{ needs.setup-slug.outputs.slug }}
        run: |
          go build \
            -ldflags="-s -w -X main.defaultChannel=${CHANNEL} -X main.defaultRegistry=${REGISTRY} -X main.defaultCDNURL=${CDN}" \
            -trimpath \
            -o "${{ matrix.binary }}" .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: ./cli/${{ matrix.binary }}

  # ── 5. BUNDLE & PUBLISH CLI PREVIEW ──────────────────────────────
  package-preview-bundle:
    name: Publish Preview Downloads & Summary
    runs-on: ubuntu-latest
    needs: [setup-slug, build-preview-cli]
    environment: dev
    env:
      ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
      CDN_URL: ${{ vars.CDN_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
    steps:
      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: preview-cli-*
          path: ./binaries
          merge-multiple: true

      - name: Generate Checksums & Archives
        working-directory: ./binaries
        run: |
          chmod +x labops-linux-* 2>/dev/null || true
          tar -czf labops-linux-amd64.tar.gz labops-linux-amd64
          sha256sum labops-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_AUTH_REGION }}

      - name: Upload Preview Binaries to S3
        run: |
          SLUG="${{ needs.setup-slug.outputs.slug }}"
          DEST="s3://${S3_BUCKET}/previews/${SLUG}/downloads/"
          aws s3 cp ./binaries/ "${DEST}" --recursive --cache-control "public, max-age=300"

      - name: Publish Step Summary
        run: |
          SLUG="${{ needs.setup-slug.outputs.slug }}"
          BRANCH="${{ needs.setup-slug.outputs.branch }}"
          CLEAN_CDN=$(echo "${{ env.CDN_URL }}" | sed 's|/*$||')
          PREVIEW_BASE="${CLEAN_CDN}/previews/${SLUG}"

          echo "## 🚀 Dev Preview Deployed for \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "* **Branch Slug:** \`${SLUG}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Preview Landing Page:** ${PREVIEW_BASE}/index.html" >> $GITHUB_STEP_SUMMARY
          echo "* **Preview Catalog:** ${PREVIEW_BASE}/catalog.json" >> $GITHUB_STEP_SUMMARY
          echo "* **Release Manifest:** ${PREVIEW_BASE}/releases/preview-${SLUG}.json" >> $GITHUB_STEP_SUMMARY
          echo "* **Downloads:** ${PREVIEW_BASE}/downloads/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💻 Test Locally with Docker Compose:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "CONTENT_PUBLIC_BASE_URL=${PREVIEW_BASE} \\" >> $GITHUB_STEP_SUMMARY
          echo "IMAGE_TAG=${SLUG} \\" >> $GITHUB_STEP_SUMMARY
          echo "docker compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
