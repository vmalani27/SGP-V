name: publish-content-beta

on:
  push:
    tags:
      - 'v*-beta*'
      - 'v*-beta'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-content-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── STAGE 1 · LINT ────────────────────────────────────────────────
  validate:
    name: lint / validate content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate content
        run: python scripts/validate_content.py content-v2/


  # ── STAGE 2 · BUILD ───────────────────────────────────────────────
  generate-manifest:
    name: build / generate manifest + tarball
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate manifest + tarball
        run: python scripts/generate_manifest.py content-v2/ out/

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-artifact
          path: out/
          if-no-files-found: error
          retention-days: 1


  # ── STAGE 3 · PUBLISH ─────────────────────────────────────────────
  publish:
    name: publish / authenticate + upload to S3
    runs-on: ubuntu-latest
    needs: generate-manifest

    environment: beta

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-artifact
          path: out/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::586177432842:role/labops-role-beta
          aws-region: ap-south-1

      - name: Publish to S3
        run: |
          aws s3 cp out/published/ \
            "s3://${S3_BUCKET}/published/" \
            --recursive

          aws s3 cp out/latest.json \
            "s3://${S3_BUCKET}/latest.json"
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}