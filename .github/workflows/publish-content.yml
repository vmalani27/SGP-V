name: publish-content

on:
  push:
    branches: [dev]
    paths:
      - 'content-v2/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml awscli

      # CI gate
      - name: Validate content
        run: python scripts/validate_content.py content-v2/

      # Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::586177432842:role/labops-role-dev
          aws-region: ap-south-1

      # Generate artifact
      - name: Generate manifest + tarball
        if: env.S3_BUCKET != ''
        run: python scripts/generate_manifest.py content-v2/ out/
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

      # Publish
      - name: Publish to S3
        if: env.S3_BUCKET != ''
        run: |
          aws s3 cp out/published/ "s3://${S3_BUCKET}/published/" --recursive
          aws s3 cp out/latest.json "s3://${S3_BUCKET}/latest.json"
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}