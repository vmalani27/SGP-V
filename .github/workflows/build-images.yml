name: build-and-publish-images

on:
  push:
    branches:
      - main
      - dev
      - beta
    paths:
      - 'orchestrator/**'
      - 'next-app/**'
      - 'sidecars/content-sync/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all images regardless of path changes'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::586177432842:role/labops-role-dev' }}
  ECR_PUBLIC_REGISTRY: public.ecr.aws/i9t1l0m7
  DYNAMODB_REGION: ap-south-1
  DYNAMODB_TABLE: labops-image-audit
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  # ── DETECT CHANGES ──────────────────────────────────────────────
  changes:
    name: Detect Changed Components
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator == 'true' || github.event.inputs.force_build_all == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event.inputs.force_build_all == 'true' }}
      content_sync: ${{ steps.filter.outputs.content_sync == 'true' || github.event.inputs.force_build_all == 'true' }}
      lab_images: ${{ steps.filter.outputs.lab_images == 'true' || github.event.inputs.force_build_all == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            orchestrator:
              - 'orchestrator/app/**'
              - 'orchestrator/Dockerfile'
              - 'orchestrator/requirements.txt'
            frontend:
              - 'next-app/**'
            content_sync:
              - 'sidecars/content-sync/**'
            lab_images:
              - 'orchestrator/lab-images/**'

  # ── ORCHESTRATOR SERVICE ────────────────────────────────────────
  build-orchestrator:
    name: Build & Push Orchestrator (Kaniko)
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push Orchestrator Image with Kaniko
        run: |
          sudo /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/Dockerfile" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-orchestrator:${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-orchestrator:latest"

  # ── FRONTEND SERVICE ────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend (Kaniko)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Materialize .env.production
        run: |
          cat << 'EOF' > next-app/.env.production
          NEXT_PUBLIC_ORCHESTRATOR_URL=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_URL || secrets.NEXT_PUBLIC_ORCHESTRATOR_URL || '' }}
          NEXT_PUBLIC_ORCHESTRATOR_SECRET=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_SECRET || secrets.NEXT_PUBLIC_ORCHESTRATOR_SECRET || 'local-dev-super-secret' }}
          CONTENT_LOCAL_DIR=/app/.content
          USER_DATA_DIR=/app/.user_data
          CONTENT_PUBLIC_BASE_URL=${{ vars.CONTENT_PUBLIC_BASE_URL || secrets.CONTENT_PUBLIC_BASE_URL || '' }}
          EOF

      - name: Build & Push Frontend Image with Kaniko
        run: |
          sudo /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/next-app" \
            --dockerfile "${GITHUB_WORKSPACE}/next-app/Dockerfile" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-frontend:${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-frontend:latest"

  # ── CONTENT-SYNC SIDECAR SERVICE ────────────────────────────────
  build-content-sync:
    name: Build & Push Content-Sync Sidecar (Kaniko)
    needs: changes
    if: needs.changes.outputs.content_sync == 'true'
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push Content-Sync Image with Kaniko
        run: |
          sudo /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/sidecars/content-sync" \
            --dockerfile "${GITHUB_WORKSPACE}/sidecars/content-sync/Dockerfile" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-content-sync:${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-content-sync:latest"

  # ── LAB RUNTIME IMAGES ──────────────────────────────────────────
  build-lab-images:
    name: Build & Push Lab Runtime Images (Kaniko)
    needs: changes
    if: needs.changes.outputs.lab_images == 'true'
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      # 1. Base Image: labops-base
      - name: Build & Push Lab Base Image (lab-ubuntu) with Kaniko
        run: |
          sudo /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator/lab-images" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/lab-images/Dockerfile.ubuntu" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.branch }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:latest"

      # 2. DinD Image: labops-labs:docker
      - name: Build & Push Lab Image (lab-docker) with Kaniko
        run: |
          sudo /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator/lab-images" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/lab-images/Dockerfile.docker" \
            --build-arg BASE_IMAGE="${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-${{ steps.tags.outputs.branch }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-latest"

      # 3. Preloaded Fundamentals Image: labops-labs:docker-fundamentals
      - name: Build & Push Lab Image (lab-docker-fundamentals) with Kaniko
        run: |
          sudo /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator/lab-images" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/lab-images/Dockerfile.docker-fundamentals" \
            --build-arg BASE_IMAGE="${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-fundamentals-${{ steps.tags.outputs.branch }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-fundamentals-${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-fundamentals-latest"

      # 4. Building Images Course Image: labops-labs:docker-build
      - name: Build & Push Lab Image (lab-docker-build) with Kaniko
        run: |
          sudo /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator/lab-images" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/lab-images/Dockerfile.docker-build" \
            --build-arg BASE_IMAGE="${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-build-${{ steps.tags.outputs.branch }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-build-${{ steps.tags.outputs.sha }}" \
            --destination "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-build-latest"

  # ── AUDIT & NOTIFY ──────────────────────────────────────────────
  audit-and-notify:
    name: Audit Images (Trivy, DynamoDB & Telegram)
    needs: [changes, build-orchestrator, build-frontend, build-content-sync, build-lab-images]
    if: always() && !cancelled() && (needs.build-orchestrator.result == 'success' || needs.build-frontend.result == 'success' || needs.build-content-sync.result == 'success' || needs.build-lab-images.result == 'success')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Images, Record to DynamoDB & Send Telegram Alerts
        run: |
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          IMAGES=()
          [ "${{ needs.changes.outputs.orchestrator }}" == "true" ] && [ "${{ needs.build-orchestrator.result }}" == "success" ] && IMAGES+=("vmalani27/labops-orchestrator:${SHA}")
          [ "${{ needs.changes.outputs.frontend }}" == "true" ] && [ "${{ needs.build-frontend.result }}" == "success" ] && IMAGES+=("vmalani27/labops-frontend:${SHA}")
          [ "${{ needs.changes.outputs.content_sync }}" == "true" ] && [ "${{ needs.build-content-sync.result }}" == "success" ] && IMAGES+=("vmalani27/labops-content-sync:${SHA}")
          [ "${{ needs.changes.outputs.lab_images }}" == "true" ] && [ "${{ needs.build-lab-images.result }}" == "success" ] && IMAGES+=("vmalani27/labops-base:${SHA}" "vmalani27/labops-labs:docker-${SHA}")

          echo "==> Built images to audit: ${IMAGES[@]}"

          for IMAGE in "${IMAGES[@]}"; do
            FULL_REF="${{ env.ECR_PUBLIC_REGISTRY }}/${IMAGE}"
            echo ""
            echo "=========================================================="
            echo "==> Scanning with Trivy: ${FULL_REF}"
            echo "=========================================================="

            trivy image --severity CRITICAL,HIGH --format json -o trivy-results.json "${FULL_REF}" || true

            CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
            HIGH_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
            CRIT_VAL="${CRITICAL_COUNT:-0}"
            HIGH_VAL="${HIGH_COUNT:-0}"
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${FULL_REF}" 2>/dev/null || echo "unknown")

            echo "  - Critical Vulnerabilities : ${CRIT_VAL}"
            echo "  - High Vulnerabilities     : ${HIGH_VAL}"
            echo "  - Image Digest             : ${DIGEST}"

            # Log to DynamoDB
            aws dynamodb put-item \
              --table-name ${{ env.DYNAMODB_TABLE }} \
              --item '{
                "image_tag": {"S": "'"${IMAGE}"'"},
                "timestamp": {"S": "'"${TIMESTAMP}"'"},
                "digest": {"S": "'"${DIGEST}"'"},
                "critical_vulnerabilities": {"N": "'"${CRIT_VAL}"'"},
                "high_vulnerabilities": {"N": "'"${HIGH_VAL}"'"}
              }' \
              --region ${{ env.DYNAMODB_REGION }}

            echo "  [✔] Audit recorded in DynamoDB table: ${{ env.DYNAMODB_TABLE }}"

            # Send Telegram Alert if configured
            if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
              MESSAGE="🚨 *LabOps Service Built & Audited*%0A%0A📦 *Image:* \`${IMAGE}\`%0A🔴 *Critical:* ${CRIT_VAL}%0A🟠 *High:* ${HIGH_VAL}%0A🕒 *Time:* ${TIMESTAMP}"
              RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=${MESSAGE}" \
                -d "parse_mode=Markdown")
              echo "  [✔] Telegram API Response: ${RESP}"
            else
              echo "  [-] Skipping Telegram notification: TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID secrets not configured in repository."
            fi
          done
