name: build-and-publish-images

on:
  push:
    branches:
      - main
      - dev
      - beta
    paths:
      - 'orchestrator/**'
      - 'next-app/**'
      - 'sidecars/content-sync/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all images regardless of path changes'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION || 'us-east-1' }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::586177432842:role/labops-role-dev' }}
  ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY || 'public.ecr.aws/i9t1l0m7' }}
  DYNAMODB_REGION: ${{ vars.DYNAMODB_REGION || 'ap-south-1' }}
  DYNAMODB_TABLE: ${{ vars.DYNAMODB_TABLE || 'labops-image-audit' }}

jobs:
  # ── DETECT CHANGES ──────────────────────────────────────────────
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator == 'true' || steps.filter.outputs.workflow == 'true' || github.event.inputs.force_build_all == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.workflow == 'true' || github.event.inputs.force_build_all == 'true' }}
      content_sync: ${{ steps.filter.outputs.content_sync == 'true' || steps.filter.outputs.workflow == 'true' || github.event.inputs.force_build_all == 'true' }}
      lab_images: ${{ steps.filter.outputs.lab_images == 'true' || steps.filter.outputs.workflow == 'true' || github.event.inputs.force_build_all == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflow:
              - '.github/workflows/build-images.yml'
            orchestrator:
              - 'orchestrator/app/**'
              - 'orchestrator/Dockerfile'
              - 'orchestrator/requirements.txt'
            frontend:
              - 'next-app/**'
            content_sync:
              - 'sidecars/content-sync/**'
            lab_images:
              - 'orchestrator/lab-images/**'

  # ── ORCHESTRATOR SERVICE ────────────────────────────────────────
  build-orchestrator:
    name: Build & Push Orchestrator
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push Orchestrator Image
        run: |
          docker build \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-orchestrator:${{ steps.tags.outputs.branch }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-orchestrator:${{ steps.tags.outputs.sha }}" \
            -f ./orchestrator/Dockerfile ./orchestrator
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-orchestrator:${{ steps.tags.outputs.branch }}"
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-orchestrator:${{ steps.tags.outputs.sha }}"

  # ── FRONTEND SERVICE ────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Materialize .env.production
        run: |
          cat << 'EOF' > next-app/.env.production
          NEXT_PUBLIC_ORCHESTRATOR_URL=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_URL || secrets.NEXT_PUBLIC_ORCHESTRATOR_URL || '' }}
          NEXT_PUBLIC_ORCHESTRATOR_SECRET=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_SECRET || secrets.NEXT_PUBLIC_ORCHESTRATOR_SECRET || 'local-dev-super-secret' }}
          CONTENT_LOCAL_DIR=/app/.content
          USER_DATA_DIR=/app/.user_data
          CONTENT_PUBLIC_BASE_URL=${{ vars.CONTENT_PUBLIC_BASE_URL || secrets.CONTENT_PUBLIC_BASE_URL || '' }}
          EOF

      - name: Build & Push Frontend Image
        run: |
          docker build \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-frontend:${{ steps.tags.outputs.branch }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-frontend:${{ steps.tags.outputs.sha }}" \
            -f ./next-app/Dockerfile ./next-app
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-frontend:${{ steps.tags.outputs.branch }}"
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-frontend:${{ steps.tags.outputs.sha }}"

  # ── CONTENT-SYNC SIDECAR SERVICE ────────────────────────────────
  build-content-sync:
    name: Build & Push Content-Sync Sidecar
    needs: changes
    if: needs.changes.outputs.content_sync == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push Content-Sync Image
        run: |
          docker build \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-content-sync:${{ steps.tags.outputs.branch }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-content-sync:${{ steps.tags.outputs.sha }}" \
            -f ./sidecars/content-sync/Dockerfile ./sidecars/content-sync
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-content-sync:${{ steps.tags.outputs.branch }}"
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-content-sync:${{ steps.tags.outputs.sha }}"

  # ── LAB RUNTIME IMAGES ──────────────────────────────────────────
  build-lab-images:
    name: Build & Push Lab Runtime Images
    needs: changes
    if: needs.changes.outputs.lab_images == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      # 1. Base Image: labops-base
      - name: Build & Push Lab Base Image (lab-ubuntu)
        run: |
          docker build \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.branch }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.sha }}" \
            -f ./orchestrator/lab-images/Dockerfile.ubuntu ./orchestrator/lab-images
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.branch }}"
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.sha }}"

      # 2. DinD Image: labops-labs:docker
      - name: Build & Push Lab Image (lab-docker)
        run: |
          docker build \
            --build-arg BASE_IMAGE="${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.sha }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-${{ steps.tags.outputs.branch }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-${{ steps.tags.outputs.sha }}" \
            -f ./orchestrator/lab-images/Dockerfile.docker ./orchestrator/lab-images
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-${{ steps.tags.outputs.branch }}"
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-${{ steps.tags.outputs.sha }}"

      # 3. Preloaded Fundamentals Image: labops-labs:docker-fundamentals
      - name: Build & Push Lab Image (lab-docker-fundamentals)
        run: |
          docker build \
            --build-arg BASE_IMAGE="${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-base:${{ steps.tags.outputs.sha }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-fundamentals-${{ steps.tags.outputs.branch }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-fundamentals-${{ steps.tags.outputs.sha }}" \
            -f ./orchestrator/lab-images/Dockerfile.docker-fundamentals ./orchestrator/lab-images
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-fundamentals-${{ steps.tags.outputs.branch }}"
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-fundamentals-${{ steps.tags.outputs.sha }}"

      # 4. Building Images Course Image: labops-labs:docker-build
      - name: Build & Push Lab Image (lab-docker-build)
        run: |
          docker build \
            --build-arg BASE_IMAGE="${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-${{ steps.tags.outputs.sha }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-build-${{ steps.tags.outputs.branch }}" \
            -t "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-build-${{ steps.tags.outputs.sha }}" \
            -f ./orchestrator/lab-images/Dockerfile.docker-build ./orchestrator/lab-images
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-build-${{ steps.tags.outputs.branch }}"
          docker push "${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/labops-labs:docker-build-${{ steps.tags.outputs.sha }}"

  # ── AUDIT & NOTIFY ──────────────────────────────────────────────
  audit-and-notify:
    name: Audit Images (Trivy, DynamoDB & Security Tab)
    needs: [changes, build-orchestrator, build-frontend, build-content-sync, build-lab-images]
    if: always() && !cancelled() && (needs.build-orchestrator.result == 'success' || needs.build-frontend.result == 'success' || needs.build-content-sync.result == 'success' || needs.build-lab-images.result == 'success')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Images & Record to DynamoDB
        run: |
          mkdir -p sarif-results
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          IMAGES=()
          [ "${{ needs.changes.outputs.orchestrator }}" == "true" ] && [ "${{ needs.build-orchestrator.result }}" == "success" ] && IMAGES+=("vmalani27/labops-orchestrator:${SHA}")
          [ "${{ needs.changes.outputs.frontend }}" == "true" ] && [ "${{ needs.build-frontend.result }}" == "success" ] && IMAGES+=("vmalani27/labops-frontend:${SHA}")
          [ "${{ needs.changes.outputs.content_sync }}" == "true" ] && [ "${{ needs.build-content-sync.result }}" == "success" ] && IMAGES+=("vmalani27/labops-content-sync:${SHA}")
          [ "${{ needs.changes.outputs.lab_images }}" == "true" ] && [ "${{ needs.build-lab-images.result }}" == "success" ] && IMAGES+=("vmalani27/labops-base:${SHA}" "vmalani27/labops-labs:docker-${SHA}" "vmalani27/labops-labs:docker-fundamentals-${SHA}" "vmalani27/labops-labs:docker-build-${SHA}")

          echo "==> Built images to audit: ${IMAGES[@]}"

          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "[-] No images marked for audit. Exiting cleanly."
            exit 0
          fi

          for IMAGE in "${IMAGES[@]}"; do
            FULL_REF="${{ env.ECR_PUBLIC_REGISTRY }}/${IMAGE}"
            SAFE_NAME=$(echo "${IMAGE}" | tr '/:' '--')
            echo ""
            echo "=========================================================="
            echo "==> Scanning with Trivy: ${FULL_REF}"
            echo "=========================================================="

            trivy image --severity CRITICAL,HIGH --format json -o trivy-results.json "${FULL_REF}" || true
            trivy image --severity CRITICAL,HIGH --format sarif -o "sarif-results/${SAFE_NAME}.sarif" "${FULL_REF}" || true

            # Inject unique analysis category into SARIF automationDetails so GitHub Code Scanning distinguishes runs
            if [ -f "sarif-results/${SAFE_NAME}.sarif" ] && [ -s "sarif-results/${SAFE_NAME}.sarif" ]; then
              jq --arg cat "${IMAGE}" '
                if (.runs | length) > 1 then
                  .runs = [ range(0; .runs | length) as $i | .runs[$i] | .automationDetails = {"id": "\($cat)/\($i)"} ]
                else
                  .runs = [ .runs[]? | .automationDetails = {"id": $cat} ]
                end
              ' "sarif-results/${SAFE_NAME}.sarif" > "sarif-results/${SAFE_NAME}.sarif.tmp" && mv "sarif-results/${SAFE_NAME}.sarif.tmp" "sarif-results/${SAFE_NAME}.sarif"
            fi

            CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
            HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
            CRIT_VAL=$(echo "${CRITICAL_COUNT:-0}" | tr -dc '0-9')
            [ -z "$CRIT_VAL" ] && CRIT_VAL="0"
            HIGH_VAL=$(echo "${HIGH_COUNT:-0}" | tr -dc '0-9')
            [ -z "$HIGH_VAL" ] && HIGH_VAL="0"

            DIGEST=$(jq -r '.Metadata.RepoDigests[0] // empty' trivy-results.json 2>/dev/null || true)
            if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
              DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{end}}' "${FULL_REF}" 2>/dev/null || true)
            fi
            if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
              DIGEST=$(docker manifest inspect "${FULL_REF}" 2>/dev/null | jq -r '.manifests[0].digest // .config.digest // empty' 2>/dev/null || true)
            fi
            DIGEST=$(echo "$DIGEST" | tr -d '\r\n"' | xargs)
            [ -z "$DIGEST" ] && DIGEST="unknown"

            echo "  - Critical Vulnerabilities : ${CRIT_VAL}"
            echo "  - High Vulnerabilities     : ${HIGH_VAL}"
            echo "  - Image Digest             : ${DIGEST}"

            # Log to DynamoDB using a clean jq-generated JSON payload
            jq -n \
              --arg tag "${IMAGE}" \
              --arg ts "${TIMESTAMP}" \
              --arg dig "${DIGEST}" \
              --arg crit "${CRIT_VAL}" \
              --arg high "${HIGH_VAL}" \
              '{
                image_tag: {S: $tag},
                timestamp: {S: $ts},
                digest: {S: $dig},
                critical_vulnerabilities: {N: $crit},
                high_vulnerabilities: {N: $high}
              }' > item.json

            aws dynamodb put-item \
              --table-name ${{ env.DYNAMODB_TABLE }} \
              --item file://item.json \
              --region ${{ env.DYNAMODB_REGION }}

            echo "  [OK] Audit recorded in DynamoDB table: ${{ env.DYNAMODB_TABLE }}"
          done

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('sarif-results/*.sarif') != ''
        with:
          sarif_file: 'sarif-results'
