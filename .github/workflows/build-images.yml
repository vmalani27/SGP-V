name: build-and-publish-images

on:
  push:
    branches:
      - main
      - dev
      - beta
    paths:
      - 'orchestrator/**'
      - 'next-app/**'
      - 'sidecars/content-sync/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all images regardless of path changes'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::586177432842:role/labops-role-dev' }}

jobs:
  # ── DETECT CHANGES ──────────────────────────────────────────────
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator == 'true' || github.event.inputs.force_build_all == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event.inputs.force_build_all == 'true' }}
      content_sync: ${{ steps.filter.outputs.content_sync == 'true' || github.event.inputs.force_build_all == 'true' }}
      lab_images: ${{ steps.filter.outputs.lab_images == 'true' || github.event.inputs.force_build_all == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            orchestrator:
              - 'orchestrator/app/**'
              - 'orchestrator/Dockerfile'
              - 'orchestrator/requirements.txt'
            frontend:
              - 'next-app/**'
            content_sync:
              - 'sidecars/content-sync/**'
            lab_images:
              - 'orchestrator/lab-images/**'

  # ── ORCHESTRATOR SERVICE ────────────────────────────────────────
  build-orchestrator:
    name: Build & Push Orchestrator
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/labops-orchestrator
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Orchestrator Image
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator
          file: ./orchestrator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator

  # ── FRONTEND SERVICE ────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/labops-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Materialize .env.production
        run: |
          cat << 'EOF' > next-app/.env.production
          NEXT_PUBLIC_ORCHESTRATOR_URL=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_URL || secrets.NEXT_PUBLIC_ORCHESTRATOR_URL || '' }}
          NEXT_PUBLIC_ORCHESTRATOR_SECRET=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_SECRET || secrets.NEXT_PUBLIC_ORCHESTRATOR_SECRET || 'local-dev-super-secret' }}
          CONTENT_LOCAL_DIR=/app/.content
          USER_DATA_DIR=/app/.user_data
          CONTENT_PUBLIC_BASE_URL=${{ vars.CONTENT_PUBLIC_BASE_URL || secrets.CONTENT_PUBLIC_BASE_URL || '' }}
          EOF

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./next-app
          file: ./next-app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── CONTENT-SYNC SIDECAR SERVICE ────────────────────────────────
  build-content-sync:
    name: Build & Push Content-Sync Sidecar
    needs: changes
    if: needs.changes.outputs.content_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/labops-content-sync
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Content-Sync Image
        uses: docker/build-push-action@v6
        with:
          context: ./sidecars/content-sync
          file: ./sidecars/content-sync/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=content-sync
          cache-to: type=gha,mode=max,scope=content-sync

  # ── LAB RUNTIME IMAGES ──────────────────────────────────────────
  build-lab-images:
    name: Build & Push Lab Runtime Images
    needs: changes
    if: needs.changes.outputs.lab_images == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      # 1. Base Image: labops-lab-ubuntu (built and pushed directly to Amazon ECR)
      - name: Build & Push Lab Image (lab-ubuntu)
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator/lab-images
          file: ./orchestrator/lab-images/Dockerfile.ubuntu
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-ubuntu:${{ steps.tags.outputs.branch }}
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-ubuntu:${{ steps.tags.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-ubuntu:latest
          cache-from: type=gha,scope=lab-ubuntu
          cache-to: type=gha,mode=max,scope=lab-ubuntu

      # 2. DinD Image: labops-lab-docker (inherits from the pushed lab-ubuntu base image in ECR)
      - name: Build & Push Lab Image (lab-docker)
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator/lab-images
          file: ./orchestrator/lab-images/Dockerfile.docker
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.login-ecr.outputs.registry }}/labops-lab-ubuntu:${{ steps.tags.outputs.sha }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-docker:${{ steps.tags.outputs.branch }}
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-docker:${{ steps.tags.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-docker:latest
          cache-from: type=gha,scope=lab-docker
          cache-to: type=gha,mode=max,scope=lab-docker

      # 3. Preloaded Fundamentals Image: labops-lab-docker-fundamentals (inherits from lab-ubuntu)
      - name: Build & Push Lab Image (lab-docker-fundamentals)
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator/lab-images
          file: ./orchestrator/lab-images/Dockerfile.docker-fundamentals
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.login-ecr.outputs.registry }}/labops-lab-ubuntu:${{ steps.tags.outputs.sha }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-docker-fundamentals:${{ steps.tags.outputs.branch }}
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-docker-fundamentals:${{ steps.tags.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-docker-fundamentals:latest
          cache-from: type=gha,scope=lab-docker-fundamentals
          cache-to: type=gha,mode=max,scope=lab-docker-fundamentals

      # 4. Building Images Course Image: labops-lab-docker-build (inherits from lab-docker in ECR)
      - name: Build & Push Lab Image (lab-docker-build)
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator/lab-images
          file: ./orchestrator/lab-images/Dockerfile.docker-build
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.login-ecr.outputs.registry }}/labops-lab-docker:${{ steps.tags.outputs.sha }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-docker-build:${{ steps.tags.outputs.branch }}
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-docker-build:${{ steps.tags.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/labops-lab-docker-build:latest
          cache-from: type=gha,scope=lab-docker-build
          cache-to: type=gha,mode=max,scope=lab-docker-build
