name: build-and-publish-images

on:
  push:
    branches:
      - main
      - dev
      - beta
    paths:
      - 'orchestrator/**'
      - 'next-app/**'
      - 'sidecars/content-sync/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all images regardless of path changes'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::586177432842:role/labops-role-dev' }}
  ECR_PUBLIC_REGISTRY: public.ecr.aws/i9t1l0m7

jobs:
  # ── DETECT CHANGES ──────────────────────────────────────────────
  changes:
    name: Detect Changed Components
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator == 'true' || github.event.inputs.force_build_all == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event.inputs.force_build_all == 'true' }}
      content_sync: ${{ steps.filter.outputs.content_sync == 'true' || github.event.inputs.force_build_all == 'true' }}
      lab_images: ${{ steps.filter.outputs.lab_images == 'true' || github.event.inputs.force_build_all == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            orchestrator:
              - 'orchestrator/app/**'
              - 'orchestrator/Dockerfile'
              - 'orchestrator/requirements.txt'
            frontend:
              - 'next-app/**'
            content_sync:
              - 'sidecars/content-sync/**'
            lab_images:
              - 'orchestrator/lab-images/**'

  # ── ORCHESTRATOR SERVICE ────────────────────────────────────────
  build-orchestrator:
    name: Build & Push Orchestrator (Kaniko Native)
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push Orchestrator with Kaniko
        run: |
          REGISTRY="${{ env.ECR_PUBLIC_REGISTRY }}"
          SHA="${{ steps.tags.outputs.sha }}"
          /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/Dockerfile" \
            --destination "${REGISTRY}/vmalani27/labops-orchestrator:${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-orchestrator:latest"

  # ── FRONTEND SERVICE ────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend (Kaniko Native)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Materialize .env.production
        run: |
          cat << 'EOF' > next-app/.env.production
          NEXT_PUBLIC_ORCHESTRATOR_URL=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_URL || secrets.NEXT_PUBLIC_ORCHESTRATOR_URL || '' }}
          NEXT_PUBLIC_ORCHESTRATOR_SECRET=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_SECRET || secrets.NEXT_PUBLIC_ORCHESTRATOR_SECRET || 'local-dev-super-secret' }}
          CONTENT_LOCAL_DIR=/app/.content
          USER_DATA_DIR=/app/.user_data
          CONTENT_PUBLIC_BASE_URL=${{ vars.CONTENT_PUBLIC_BASE_URL || secrets.CONTENT_PUBLIC_BASE_URL || '' }}
          EOF

      - name: Build & Push Frontend with Kaniko
        run: |
          REGISTRY="${{ env.ECR_PUBLIC_REGISTRY }}"
          SHA="${{ steps.tags.outputs.sha }}"
          /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/next-app" \
            --dockerfile "${GITHUB_WORKSPACE}/next-app/Dockerfile" \
            --destination "${REGISTRY}/vmalani27/labops-frontend:${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-frontend:latest"

  # ── CONTENT-SYNC SIDECAR SERVICE ────────────────────────────────
  build-content-sync:
    name: Build & Push Content-Sync Sidecar (Kaniko Native)
    needs: changes
    if: needs.changes.outputs.content_sync == 'true'
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push Content-Sync with Kaniko
        run: |
          REGISTRY="${{ env.ECR_PUBLIC_REGISTRY }}"
          SHA="${{ steps.tags.outputs.sha }}"
          /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/sidecars/content-sync" \
            --dockerfile "${GITHUB_WORKSPACE}/sidecars/content-sync/Dockerfile" \
            --destination "${REGISTRY}/vmalani27/labops-content-sync:${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-content-sync:latest"

  # ── LAB RUNTIME IMAGES ──────────────────────────────────────────
  build-lab-images:
    name: Build & Push Lab Runtime Images (Kaniko Native)
    needs: changes
    if: needs.changes.outputs.lab_images == 'true'
    runs-on: [self-hosted, aws, fargate, ap-south-1]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Determine Tags
        id: tags
        run: |
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      # 1. Base Image: labops-base
      - name: Build & Push Lab Base Image with Kaniko
        run: |
          REGISTRY="${{ env.ECR_PUBLIC_REGISTRY }}"
          SHA="${{ steps.tags.outputs.sha }}"
          /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator/lab-images" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/lab-images/Dockerfile.ubuntu" \
            --destination "${REGISTRY}/vmalani27/labops-base:${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-base:latest"

      # 2. DinD Image: labops-labs:docker
      - name: Build & Push Lab Image (lab-docker) with Kaniko
        run: |
          REGISTRY="${{ env.ECR_PUBLIC_REGISTRY }}"
          SHA="${{ steps.tags.outputs.sha }}"
          /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator/lab-images" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/lab-images/Dockerfile.docker" \
            --build-arg BASE_IMAGE="${REGISTRY}/vmalani27/labops-base:${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-labs:docker-${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-labs:docker-latest"

      # 3. Preloaded Fundamentals Image: labops-labs:docker-fundamentals
      - name: Build & Push Lab Image (lab-docker-fundamentals) with Kaniko
        run: |
          REGISTRY="${{ env.ECR_PUBLIC_REGISTRY }}"
          SHA="${{ steps.tags.outputs.sha }}"
          /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator/lab-images" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/lab-images/Dockerfile.docker-fundamentals" \
            --build-arg BASE_IMAGE="${REGISTRY}/vmalani27/labops-base:${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-labs:docker-fundamentals-${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-labs:docker-fundamentals-latest"

      # 4. Building Images Course Image: labops-labs:docker-build
      - name: Build & Push Lab Image (lab-docker-build) with Kaniko
        run: |
          REGISTRY="${{ env.ECR_PUBLIC_REGISTRY }}"
          SHA="${{ steps.tags.outputs.sha }}"
          /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/orchestrator/lab-images" \
            --dockerfile "${GITHUB_WORKSPACE}/orchestrator/lab-images/Dockerfile.docker-build" \
            --build-arg BASE_IMAGE="${REGISTRY}/vmalani27/labops-labs:docker-${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-labs:docker-build-${SHA}" \
            --destination "${REGISTRY}/vmalani27/labops-labs:docker-build-latest"
