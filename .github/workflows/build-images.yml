name: build-and-publish-images

on:
  push:
    branches:
      - main
      - dev
      - beta
    paths:
      - 'backend/**'
      - 'orchestrator/**'
      - 'next-app/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all images regardless of path changes'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── DETECT CHANGES ──────────────────────────────────────────────
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event.inputs.force_build_all == 'true' }}
      orchestrator: ${{ steps.filter.outputs.orchestrator == 'true' || github.event.inputs.force_build_all == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event.inputs.force_build_all == 'true' }}
      lab_images: ${{ steps.filter.outputs.lab_images == 'true' || github.event.inputs.force_build_all == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            orchestrator:
              - 'orchestrator/app/**'
              - 'orchestrator/Dockerfile'
              - 'orchestrator/requirements.txt'
            frontend:
              - 'next-app/**'
            lab_images:
              - 'orchestrator/lab-images/**'

  # ── BACKEND SERVICE ─────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── ORCHESTRATOR SERVICE ────────────────────────────────────────
  build-orchestrator:
    name: Build & Push Orchestrator
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/orchestrator
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Orchestrator Image
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator
          file: ./orchestrator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator

  # ── FRONTEND SERVICE ────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Materialize .env.production
        run: |
          cat << 'EOF' > next-app/.env.production
          NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000' }}
          NEXT_PUBLIC_ORCHESTRATOR_URL=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_URL || secrets.NEXT_PUBLIC_ORCHESTRATOR_URL || 'http://localhost:8001' }}
          NEXT_PUBLIC_ORCHESTRATOR_SECRET=${{ vars.NEXT_PUBLIC_ORCHESTRATOR_SECRET || secrets.NEXT_PUBLIC_ORCHESTRATOR_SECRET || 'local-dev-super-secret' }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || secrets.FIREBASE_API_KEY || vars.NEXT_PUBLIC_FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || vars.FIREBASE_AUTH_DOMAIN || secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || vars.FIREBASE_STORAGE_BUCKET || secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID || secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || vars.FIREBASE_APP_ID || secrets.NEXT_PUBLIC_FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
          EOF

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./next-app
          file: ./next-app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── LAB RUNTIME IMAGES ──────────────────────────────────────────
  build-lab-images:
    name: Build & Push Lab Runtime Images
    needs: changes
    if: needs.changes.outputs.lab_images == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      # 1. Base Image: labops-ubuntu (built and pushed directly to GHCR)
      - name: Build & Push Lab Image (lab-ubuntu)
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator/lab-images
          file: ./orchestrator/lab-images/Dockerfile.ubuntu
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/lab-ubuntu:${{ steps.tags.outputs.branch }}
            ghcr.io/${{ env.REPO_LOWER }}/lab-ubuntu:${{ steps.tags.outputs.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/lab-ubuntu:latest
          cache-from: type=gha,scope=lab-ubuntu
          cache-to: type=gha,mode=max,scope=lab-ubuntu

      # 2. DinD Image: labops-docker (inherits from the pushed lab-ubuntu base image)
      - name: Build & Push Lab Image (lab-docker)
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator/lab-images
          file: ./orchestrator/lab-images/Dockerfile.docker
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ env.REPO_LOWER }}/lab-ubuntu:${{ steps.tags.outputs.sha }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/lab-docker:${{ steps.tags.outputs.branch }}
            ghcr.io/${{ env.REPO_LOWER }}/lab-docker:${{ steps.tags.outputs.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/lab-docker:latest
          cache-from: type=gha,scope=lab-docker
          cache-to: type=gha,mode=max,scope=lab-docker

      # 3. Preloaded Fundamentals Image: labops-docker-fundamentals
      - name: Build & Push Lab Image (lab-docker-fundamentals)
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator/lab-images
          file: ./orchestrator/lab-images/Dockerfile.docker-fundamentals
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ env.REPO_LOWER }}/lab-ubuntu:${{ steps.tags.outputs.sha }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/lab-docker-fundamentals:${{ steps.tags.outputs.branch }}
            ghcr.io/${{ env.REPO_LOWER }}/lab-docker-fundamentals:${{ steps.tags.outputs.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/lab-docker-fundamentals:latest
          cache-from: type=gha,scope=lab-docker-fundamentals
          cache-to: type=gha,mode=max,scope=lab-docker-fundamentals
