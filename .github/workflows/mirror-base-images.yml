name: mirror-base-images

on:
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/mirror-base-images.yml'
  schedule:
    # Run automatically every Monday at 02:00 UTC to catch upstream security patches/updates
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      specific_image:
        description: 'Optional single source image to mirror (e.g., python:3.11-slim). Leave blank to mirror matrix.'
        required: false
        type: string
      target_repo:
        description: 'Target ECR repo (e.g., labops-ubuntu, labops-python, labops-git-server)'
        required: false
        type: string
      target_tag:
        description: 'Tag name under target repo (e.g., latest, 22.04)'
        required: false
        type: string
      force_push:
        description: 'Force push to ECR even if digest matches DynamoDB'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
  DYNAMODB_REGION: ${{ vars.DYNAMODB_REGION }}
  DYNAMODB_TABLE_BASE_IMAGES: ${{ vars.DYNAMODB_TABLE_BASE_IMAGES }}

jobs:
  # ── 1. MATRIX MIRROR JOB ───────────────────────────────────────────
  mirror-matrix:
    name: Mirror ${{ matrix.image.repo }}:${{ matrix.image.tag }}
    if: "${{ github.event.inputs.specific_image == '' }}"
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        image:
          - { source: "ubuntu:22.04", repo: "labops-ubuntu", tag: "22.04" }
          - { source: "gitea/gitea:latest", repo: "labops-git-server", tag: "latest" }
          - { source: "python:3.12-alpine", repo: "labops-python", tag: "3.12-alpine" }
          - { source: "node:20-alpine", repo: "labops-node", tag: "20-alpine" }
          - { source: "golang:1.23-alpine", repo: "labops-golang", tag: "1.23-alpine" }
          - { source: "alpine:3.20", repo: "labops-alpine", tag: "3.20" }
          - { source: "nginx:1.27-alpine", repo: "labops-nginx", tag: "1.27-alpine" }
          - { source: "redis:alpine", repo: "labops-redis", tag: "alpine" }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DynamoDB Client
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Inspect Upstream and Check DynamoDB
        id: check
        run: |
          SOURCE="${{ matrix.image.source }}"
          REPO="${{ matrix.image.repo }}"
          DEST="${{ env.ECR_PUBLIC_REGISTRY }}/${{ matrix.image.repo }}:${{ matrix.image.tag }}"
          FORCE="${{ github.event.inputs.force_push == 'true' }}"

          echo "==> Pulling from Docker Hub: ${SOURCE}"
          docker pull "${SOURCE}"

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${SOURCE}" | cut -d'@' -f2)
          echo "Upstream Digest: ${DIGEST}"

          CHANGED=$(python scripts/manage_image_registry.py check-base-changed --name "${REPO}" --digest "${DIGEST}")
          echo "Changed: ${CHANGED}"

          if [ "${FORCE}" = "true" ] || [ "${CHANGED}" = "true" ]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
          else
            echo "should_push=false" >> $GITHUB_OUTPUT
            echo "==> Upstream digest matches DynamoDB (${DIGEST}). Unchanged, skipping push and scan."
          fi
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "dest=${DEST}" >> $GITHUB_OUTPUT

      - name: Retag and Push Image to ECR Public
        if: steps.check.outputs.should_push == 'true'
        run: |
          SOURCE="${{ matrix.image.source }}"
          DEST="${{ steps.check.outputs.dest }}"
          echo "==> Retagging as ECR destination: ${DEST}"
          docker tag "${SOURCE}" "${DEST}"
          echo "==> Pushing to ECR Public: ${DEST}"
          docker push "${DEST}"

      - name: Run Trivy Vulnerability Scanner (SARIF)
        if: steps.check.outputs.should_push == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.check.outputs.dest }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (JSON for DynamoDB)
        if: steps.check.outputs.should_push == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.check.outputs.dest }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.check.outputs.should_push == 'true'
        with:
          sarif_file: 'trivy-results.sarif'
          category: '${{ matrix.image.repo }}-${{ matrix.image.tag }}'

      - name: Record Base Image in DynamoDB
        if: steps.check.outputs.should_push == 'true'
        run: |
          python scripts/manage_image_registry.py record \
            --category base \
            --name "${{ matrix.image.repo }}" \
            --remote "${{ steps.check.outputs.dest }}" \
            --digest "${{ steps.check.outputs.digest }}" \
            --commit "${GITHUB_SHA}"

  # ── 2. SINGLE ON-DEMAND MIRROR JOB ─────────────────────────────────
  mirror-single:
    name: Mirror Single Image (${{ github.event.inputs.specific_image }})
    if: "${{ github.event.inputs.specific_image != '' }}"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate Inputs
        run: |
          if [ -z "${{ github.event.inputs.target_repo }}" ] || [ -z "${{ github.event.inputs.target_tag }}" ]; then
            echo "[-] ERROR: When providing a specific_image, target_repo and target_tag are required (e.g., target_repo=labops-ubuntu, target_tag=latest)."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DynamoDB Client
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Inspect Upstream and Check DynamoDB
        id: check
        run: |
          SOURCE="${{ github.event.inputs.specific_image }}"
          REPO="${{ github.event.inputs.target_repo }}"
          DEST="${{ env.ECR_PUBLIC_REGISTRY }}/${{ github.event.inputs.target_repo }}:${{ github.event.inputs.target_tag }}"
          FORCE="${{ github.event.inputs.force_push == 'true' }}"

          echo "==> Pulling from Docker Hub: ${SOURCE}"
          docker pull "${SOURCE}"

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${SOURCE}" | cut -d'@' -f2)
          echo "Upstream Digest: ${DIGEST}"

          CHANGED=$(python scripts/manage_image_registry.py check-base-changed --name "${REPO}" --digest "${DIGEST}")
          echo "Changed: ${CHANGED}"

          if [ "${FORCE}" = "true" ] || [ "${CHANGED}" = "true" ]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
          else
            echo "should_push=false" >> $GITHUB_OUTPUT
            echo "==> Upstream digest matches DynamoDB (${DIGEST}). Unchanged, skipping push and scan."
          fi
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "dest=${DEST}" >> $GITHUB_OUTPUT

      - name: Retag and Push Single Image to Dedicated Repo
        if: steps.check.outputs.should_push == 'true'
        run: |
          SOURCE="${{ github.event.inputs.specific_image }}"
          DEST="${{ steps.check.outputs.dest }}"
          echo "==> Retagging as ECR destination: ${DEST}"
          docker tag "${SOURCE}" "${DEST}"
          echo "==> Pushing to ECR Public: ${DEST}"
          docker push "${DEST}"

      - name: Run Trivy Vulnerability Scanner (SARIF)
        if: steps.check.outputs.should_push == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.check.outputs.dest }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (JSON for DynamoDB)
        if: steps.check.outputs.should_push == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.check.outputs.dest }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.check.outputs.should_push == 'true'
        with:
          sarif_file: 'trivy-results.sarif'
          category: '${{ github.event.inputs.target_repo }}-${{ github.event.inputs.target_tag }}'

      - name: Record Base Image in DynamoDB
        if: steps.check.outputs.should_push == 'true'
        run: |
          python scripts/manage_image_registry.py record \
            --category base \
            --name "${{ github.event.inputs.target_repo }}" \
            --remote "${{ steps.check.outputs.dest }}" \
            --digest "${{ steps.check.outputs.digest }}" \
            --commit "${GITHUB_SHA}"
