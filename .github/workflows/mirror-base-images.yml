name: mirror-base-images

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/mirror-base-images.yml'
  schedule:
    # Run automatically every Monday at 02:00 UTC to catch upstream security patches/updates
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      specific_image:
        description: 'Optional single source image to mirror (e.g., python:3.11-slim). Leave blank to mirror matrix.'
        required: false
        type: string
      target_repo:
        description: 'Target ECR repo (e.g., labops-ubuntu, labops-python, labops-git-server)'
        required: false
        type: string
      target_tag:
        description: 'Tag name under target repo (e.g., latest, 22.04)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
  DYNAMODB_REGION: ${{ vars.DYNAMODB_REGION }}
  DYNAMODB_TABLE: ${{ vars.DYNAMODB_TABLE }}

jobs:
  # ── 1. MATRIX MIRROR JOB ───────────────────────────────────────────
  mirror-matrix:
    name: Mirror ${{ matrix.image.repo }}:${{ matrix.image.tag }}
    if: "${{ github.event.inputs.specific_image == '' }}"
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        image:
          - { source: "ubuntu:22.04",       repo: "labops-ubuntu",     tag: "latest"       }
          - { source: "ubuntu:22.04",       repo: "labops-ubuntu",     tag: "22.04"        }
          - { source: "gitea/gitea:latest",  repo: "labops-git-server", tag: "latest"       }
          - { source: "python:3.12-alpine",  repo: "labops-python",     tag: "3.12-alpine" }
          - { source: "python:3.12-alpine",  repo: "labops-python",     tag: "latest"       }
          - { source: "node:20-alpine",      repo: "labops-node",       tag: "20-alpine"   }
          - { source: "node:20-alpine",      repo: "labops-node",       tag: "latest"       }
          - { source: "golang:1.23-alpine",  repo: "labops-golang",     tag: "1.23-alpine" }
          - { source: "golang:1.23-alpine",  repo: "labops-golang",     tag: "latest"       }
          - { source: "alpine:3.20",         repo: "labops-alpine",     tag: "3.20"        }
          - { source: "alpine:3.20",         repo: "labops-alpine",     tag: "latest"       }
          - { source: "nginx:1.27-alpine",   repo: "labops-nginx",      tag: "1.27-alpine" }
          - { source: "nginx:1.27-alpine",   repo: "labops-nginx",      tag: "latest"       }
          - { source: "redis:alpine",        repo: "labops-redis",      tag: "alpine"      }
          - { source: "redis:alpine",        repo: "labops-redis",      tag: "latest"       }

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Pull, Retag, and Push Image to Dedicated Repo
        run: |
          SOURCE="${{ matrix.image.source }}"
          DEST="${{ env.ECR_PUBLIC_REGISTRY }}/${{ matrix.image.repo }}:${{ matrix.image.tag }}"

          echo "==> [1/3] Pulling from Docker Hub: ${SOURCE}"
          docker pull "${SOURCE}"

          echo "==> [2/3] Retagging as ECR destination: ${DEST}"
          docker tag "${SOURCE}" "${DEST}"

          echo "==> [3/3] Pushing to ECR Public: ${DEST}"
          docker push "${DEST}"

          echo "==> Mirror Complete! Verification Digest:"
          docker inspect --format='{{index .RepoDigests 0}}' "${DEST}" || true

      - name: Run Trivy Vulnerability Scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_PUBLIC_REGISTRY }}/${{ matrix.image.repo }}:${{ matrix.image.tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (JSON for DynamoDB)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_PUBLIC_REGISTRY }}/${{ matrix.image.repo }}:${{ matrix.image.tag }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: '${{ matrix.image.repo }}-${{ matrix.image.tag }}'

      - name: Log to DynamoDB
        run: |
          TAG="${{ matrix.image.repo }}:${{ matrix.image.tag }}"
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
          CRIT_VAL=$(echo "${CRITICAL_COUNT:-0}" | tr -dc '0-9')
          [ -z "$CRIT_VAL" ] && CRIT_VAL="0"
          HIGH_VAL=$(echo "${HIGH_COUNT:-0}" | tr -dc '0-9')
          [ -z "$HIGH_VAL" ] && HIGH_VAL="0"

          DIGEST=$(jq -r '.Metadata.RepoDigests[0] // empty' trivy-results.json 2>/dev/null || true)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{end}}' "${{ env.ECR_PUBLIC_REGISTRY }}/${{ matrix.image.repo }}:${{ matrix.image.tag }}" 2>/dev/null || true)
          fi
          DIGEST=$(echo "$DIGEST" | tr -d '\r\n"' | xargs)
          [ -z "$DIGEST" ] && DIGEST="unknown"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg tag "$TAG" \
            --arg ts "$TIMESTAMP" \
            --arg dig "$DIGEST" \
            --arg crit "$CRIT_VAL" \
            --arg high "$HIGH_VAL" \
            '{
              image_tag: {S: $tag},
              timestamp: {S: $ts},
              digest: {S: $dig},
              critical_vulnerabilities: {N: $crit},
              high_vulnerabilities: {N: $high}
            }' > item.json

          # Push audit record to DynamoDB (composite key: image_tag + timestamp)
          aws dynamodb put-item \
            --table-name ${{ env.DYNAMODB_TABLE }} \
            --item file://item.json \
            --region ${{ env.DYNAMODB_REGION }}
          echo "  [OK] Audit recorded in DynamoDB table: ${{ env.DYNAMODB_TABLE }}"

  # ── 2. SINGLE ON-DEMAND MIRROR JOB ─────────────────────────────────
  mirror-single:
    name: Mirror Single Image (${{ github.event.inputs.specific_image }})
    if: "${{ github.event.inputs.specific_image != '' }}"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate Inputs
        run: |
          if [ -z "${{ github.event.inputs.target_repo }}" ] || [ -z "${{ github.event.inputs.target_tag }}" ]; then
            echo "[-] ERROR: When providing a specific_image, target_repo and target_tag are required (e.g., target_repo=labops-ubuntu, target_tag=latest)."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Pull, Retag, and Push Single Image to Dedicated Repo
        run: |
          SOURCE="${{ github.event.inputs.specific_image }}"
          DEST="${{ env.ECR_PUBLIC_REGISTRY }}/${{ github.event.inputs.target_repo }}:${{ github.event.inputs.target_tag }}"

          echo "==> [1/3] Pulling from Docker Hub: ${SOURCE}"
          docker pull "${SOURCE}"

          echo "==> [2/3] Retagging as ECR destination: ${DEST}"
          docker tag "${SOURCE}" "${DEST}"

          echo "==> [3/3] Pushing to ECR Public: ${DEST}"
          docker push "${DEST}"

          echo "==> Mirror Complete! Verification Digest:"
          docker inspect --format='{{index .RepoDigests 0}}' "${DEST}" || true

      - name: Run Trivy Vulnerability Scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_PUBLIC_REGISTRY }}/${{ github.event.inputs.target_repo }}:${{ github.event.inputs.target_tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (JSON for DynamoDB)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_PUBLIC_REGISTRY }}/${{ github.event.inputs.target_repo }}:${{ github.event.inputs.target_tag }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: '${{ github.event.inputs.target_repo }}-${{ github.event.inputs.target_tag }}'

      - name: Log to DynamoDB
        run: |
          TAG="${{ github.event.inputs.target_repo }}:${{ github.event.inputs.target_tag }}"
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
          CRIT_VAL=$(echo "${CRITICAL_COUNT:-0}" | tr -dc '0-9')
          [ -z "$CRIT_VAL" ] && CRIT_VAL="0"
          HIGH_VAL=$(echo "${HIGH_COUNT:-0}" | tr -dc '0-9')
          [ -z "$HIGH_VAL" ] && HIGH_VAL="0"

          DIGEST=$(jq -r '.Metadata.RepoDigests[0] // empty' trivy-results.json 2>/dev/null || true)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{end}}' "${{ env.ECR_PUBLIC_REGISTRY }}/${{ github.event.inputs.target_repo }}:${{ github.event.inputs.target_tag }}" 2>/dev/null || true)
          fi
          DIGEST=$(echo "$DIGEST" | tr -d '\r\n"' | xargs)
          [ -z "$DIGEST" ] && DIGEST="unknown"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg tag "$TAG" \
            --arg ts "$TIMESTAMP" \
            --arg dig "$DIGEST" \
            --arg crit "$CRIT_VAL" \
            --arg high "$HIGH_VAL" \
            '{
              image_tag: {S: $tag},
              timestamp: {S: $ts},
              digest: {S: $dig},
              critical_vulnerabilities: {N: $crit},
              high_vulnerabilities: {N: $high}
            }' > item.json

          aws dynamodb put-item \
            --table-name ${{ env.DYNAMODB_TABLE }} \
            --item file://item.json \
            --region ${{ env.DYNAMODB_REGION }}
          echo "  [OK] Audit recorded in DynamoDB table: ${{ env.DYNAMODB_TABLE }}"