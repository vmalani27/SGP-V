name: mirror-base-images

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/mirror-base-images.yml'
  schedule:
    # Run automatically every Monday at 02:00 UTC to catch upstream security patches/updates
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      specific_image:
        description: 'Optional single image to mirror (e.g., python:3.11-slim). Leave blank to mirror the standard matrix.'
        required: false
        type: string
      target_name:
        description: 'Target repository name under vmalani27/ if specific_image is given (e.g., python)'
        required: false
        type: string
      target_tag:
        description: 'Target tag if specific_image is given (e.g., 3.11-slim)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::586177432842:role/labops-role-dev' }}
  ECR_PUBLIC_REGISTRY: public.ecr.aws/i9t1l0m7

jobs:
  # ── 1. MATRIX MIRROR JOB ───────────────────────────────────────────
  mirror-matrix:
    name: Mirror ${{ matrix.image.name }}:${{ matrix.image.tag }}
    if: "${{ github.event.inputs.specific_image == '' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { source: "ubuntu:22.04",      name: "ubuntu", tag: "22.04"       }
          - { source: "python:3.12-alpine", name: "python", tag: "3.12-alpine" }
          - { source: "node:20-alpine",     name: "node",   tag: "20-alpine"   }
          - { source: "golang:1.23-alpine", name: "golang", tag: "1.23-alpine" }
          - { source: "alpine:3.20",        name: "alpine", tag: "3.20"        }

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Ensure ECR Public repository exists
        run: |
          REPO="vmalani27/${{ matrix.image.name }}"
          echo "==> Checking if ECR Public repository '${REPO}' exists..."
          aws ecr-public describe-repositories --repository-names "${REPO}" --region us-east-1 >/dev/null 2>&1 || \
          aws ecr-public create-repository --repository-name "${REPO}" --region us-east-1 || true

      - name: Pull, Retag, and Push Image
        run: |
          SOURCE="${{ matrix.image.source }}"
          DEST="${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/${{ matrix.image.name }}:${{ matrix.image.tag }}"

          echo "==> [1/3] Pulling from Docker Hub: ${SOURCE}"
          docker pull "${SOURCE}"

          echo "==> [2/3] Retagging as ECR destination: ${DEST}"
          docker tag "${SOURCE}" "${DEST}"

          echo "==> [3/3] Pushing to ECR Public: ${DEST}"
          docker push "${DEST}"

          echo "==> Mirror Complete! Verification Digest:"
          docker inspect --format='{{index .RepoDigests 0}}' "${DEST}" || true

  # ── 2. SINGLE ON-DEMAND MIRROR JOB ─────────────────────────────────
  mirror-single:
    name: Mirror Single Image (${{ github.event.inputs.specific_image }})
    if: "${{ github.event.inputs.specific_image != '' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Validate Inputs
        run: |
          if [ -z "${{ github.event.inputs.target_name }}" ] || [ -z "${{ github.event.inputs.target_tag }}" ]; then
            echo "[-] ERROR: When providing a specific_image, target_name and target_tag are required."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Ensure ECR Public repository exists
        run: |
          REPO="vmalani27/${{ github.event.inputs.target_name }}"
          echo "==> Checking if ECR Public repository '${REPO}' exists..."
          aws ecr-public describe-repositories --repository-names "${REPO}" --region us-east-1 >/dev/null 2>&1 || \
          aws ecr-public create-repository --repository-name "${REPO}" --region us-east-1 || true

      - name: Pull, Retag, and Push Single Image
        run: |
          SOURCE="${{ github.event.inputs.specific_image }}"
          DEST="${{ env.ECR_PUBLIC_REGISTRY }}/vmalani27/${{ github.event.inputs.target_name }}:${{ github.event.inputs.target_tag }}"

          echo "==> [1/3] Pulling from Docker Hub: ${SOURCE}"
          docker pull "${SOURCE}"

          echo "==> [2/3] Retagging as ECR destination: ${DEST}"
          docker tag "${SOURCE}" "${DEST}"

          echo "==> [3/3] Pushing to ECR Public: ${DEST}"
          docker push "${DEST}"

          echo "==> Mirror Complete! Verification Digest:"
          docker inspect --format='{{index .RepoDigests 0}}' "${DEST}" || true
