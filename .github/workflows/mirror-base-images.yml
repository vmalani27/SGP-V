name: mirror-base-images

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/mirror-base-images.yml'
  schedule:
    # Run automatically every Monday at 02:00 UTC to catch upstream security patches/updates
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      specific_image:
        description: 'Optional single image to mirror (e.g., python:3.11-slim). Leave blank to mirror the standard matrix.'
        required: false
        type: string
      target_tag:
        description: 'Tag name under vmalani27/labops-base (e.g., python-3.11-slim)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::586177432842:role/labops-role-dev' }}
  ECR_PUBLIC_REGISTRY: public.ecr.aws/i9t1l0m7
  TARGET_REPO: vmalani27/labops-base
  DYNAMODB_REGION: ap-south-1
  DYNAMODB_TABLE: labops-image-audit
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  # ── 1. MATRIX MIRROR JOB ───────────────────────────────────────────
  mirror-matrix:
    name: Mirror ${{ matrix.image.tag }}
    if: "${{ github.event.inputs.specific_image == '' }}"
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        image:
          - { source: "ubuntu:22.04",       tag: "ubuntu-22.04"         }
          - { source: "python:3.12-alpine",  tag: "python-3.12-alpine"   }
          - { source: "node:20-alpine",      tag: "node-20-alpine"       }
          - { source: "golang:1.23-alpine",  tag: "golang-1.23-alpine"   }
          - { source: "alpine:3.20",         tag: "alpine-3.20"          }

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Pull, Retag, and Push Image to labops-base
        run: |
          SOURCE="${{ matrix.image.source }}"
          DEST="${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.TARGET_REPO }}:${{ matrix.image.tag }}"

          echo "==> [1/3] Pulling from Docker Hub: ${SOURCE}"
          docker pull "${SOURCE}"

          echo "==> [2/3] Retagging as ECR destination: ${DEST}"
          docker tag "${SOURCE}" "${DEST}"

          echo "==> [3/3] Pushing to ECR Public: ${DEST}"
          docker push "${DEST}"

          echo "==> Mirror Complete! Verification Digest:"
          docker inspect --format='{{index .RepoDigests 0}}' "${DEST}" || true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.TARGET_REPO }}:${{ matrix.image.tag }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Log to DynamoDB and Send Telegram Alert
        run: |
          TAG="${{ matrix.image.tag }}"
          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
          HIGH_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.TARGET_REPO }}:$TAG" 2>/dev/null || echo "unknown")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CRIT_VAL="${CRITICAL_COUNT:-0}"
          HIGH_VAL="${HIGH_COUNT:-0}"

          # Push audit record to DynamoDB (composite key: image_tag + timestamp)
          aws dynamodb put-item \
            --table-name ${{ env.DYNAMODB_TABLE }} \
            --item '{
              "image_tag": {"S": "'"$TAG"'"},
              "timestamp": {"S": "'"$TIMESTAMP"'"},
              "digest": {"S": "'"$DIGEST"'"},
              "critical_vulnerabilities": {"N": "'"$CRIT_VAL"'"},
              "high_vulnerabilities": {"N": "'"$HIGH_VAL"'"}
            }' \
            --region ${{ env.DYNAMODB_REGION }}

          # Send Telegram Notification if configured
          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            MESSAGE="*LabOps Mirror Synced*%0A%0A*Tag:* \`$TAG\`%0A*Critical Vulns:* $CRIT_VAL%0A*High Vulns:* $HIGH_VAL%0A*Timestamp:* $TIMESTAMP"
            RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown")
            echo "  [✔] Telegram API Response: ${RESP}"
          else
            echo "  [-] Skipping Telegram alert: TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID secrets not configured in repository."
          fi

  # ── 2. SINGLE ON-DEMAND MIRROR JOB ─────────────────────────────────
  mirror-single:
    name: Mirror Single Image (${{ github.event.inputs.specific_image }})
    if: "${{ github.event.inputs.specific_image != '' }}"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate Inputs
        run: |
          if [ -z "${{ github.event.inputs.target_tag }}" ]; then
            echo "[-] ERROR: When providing a specific_image, target_tag is required (e.g., python-3.11-slim)."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Pull, Retag, and Push Single Image to labops-base
        run: |
          SOURCE="${{ github.event.inputs.specific_image }}"
          DEST="${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.TARGET_REPO }}:${{ github.event.inputs.target_tag }}"

          echo "==> [1/3] Pulling from Docker Hub: ${SOURCE}"
          docker pull "${SOURCE}"

          echo "==> [2/3] Retagging as ECR destination: ${DEST}"
          docker tag "${SOURCE}" "${DEST}"

          echo "==> [3/3] Pushing to ECR Public: ${DEST}"
          docker push "${DEST}"

          echo "==> Mirror Complete! Verification Digest:"
          docker inspect --format='{{index .RepoDigests 0}}' "${DEST}" || true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.TARGET_REPO }}:${{ github.event.inputs.target_tag }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Log to DynamoDB and Send Telegram Alert
        run: |
          TAG="${{ github.event.inputs.target_tag }}"
          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
          HIGH_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.TARGET_REPO }}:$TAG" 2>/dev/null || echo "unknown")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CRIT_VAL="${CRITICAL_COUNT:-0}"
          HIGH_VAL="${HIGH_COUNT:-0}"

          aws dynamodb put-item \
            --table-name ${{ env.DYNAMODB_TABLE }} \
            --item '{
              "image_tag": {"S": "'"$TAG"'"},
              "timestamp": {"S": "'"$TIMESTAMP"'"},
              "digest": {"S": "'"$DIGEST"'"},
              "critical_vulnerabilities": {"N": "'"$CRIT_VAL"'"},
              "high_vulnerabilities": {"N": "'"$HIGH_VAL"'"}
            }' \
            --region ${{ env.DYNAMODB_REGION }}

          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            MESSAGE="*LabOps Single Mirror Synced*%0A%0A*Tag:* \`$TAG\`%0A*Critical Vulns:* $CRIT_VAL%0A*High Vulns:* $HIGH_VAL%0A*Timestamp:* $TIMESTAMP"
            RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown")
            echo "  [✔] Telegram API Response: ${RESP}"
          else
            echo "  [-] Skipping Telegram alert: TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID secrets not configured in repository."
          fi