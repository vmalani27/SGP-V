name: build-and-release-cli

on:
  push:
    branches:
      - main
      - beta
      - dev
    paths:
      - 'cli/**'
      - '.github/workflows/build-cli.yml'
  pull_request:
    branches:
      - main
      - beta
      - dev
    paths:
      - 'cli/**'
      - '.github/workflows/build-cli.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel / environment'
        required: true
        type: choice
        options:
          - dev
          - beta
          - stable
        default: dev

permissions:
  contents: write

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
  CDN_URL: ${{ vars.CDN_URL }}

jobs:
  # ── 1. CROSS-COMPILE BINARIES ───────────────────────────────────
  compile:
    name: Compile (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            binary: labops-linux-amd64
          - os: windows
            arch: amd64
            binary: labops-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Compile Binary
        working-directory: ./cli
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            CHANNEL="stable"
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            CHANNEL="beta"
          else
            CHANNEL="dev"
          fi

          echo "Building ${{ matrix.binary }} for ${{ matrix.os }}/${{ matrix.arch }} (channel: ${CHANNEL}, registry: ${{ env.ECR_PUBLIC_REGISTRY }}, cdn: ${{ env.CDN_URL }})..."

          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -ldflags="-s -w -X main.defaultChannel=${CHANNEL} -X main.defaultRegistry=${{ env.ECR_PUBLIC_REGISTRY }} -X main.defaultCDNURL=${{ env.CDN_URL }}" \
            -trimpath \
            -o "${{ matrix.binary }}" .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ./cli/${{ matrix.binary }}
          retention-days: 14

  # ── 2. BUNDLE & CHECKSUM ────────────────────────────────────────
  package-bundle:
    name: Package Release Bundle & Checksums
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Download All Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          path: ./binaries
          pattern: "labops-*"
          merge-multiple: true

      - name: Generate Checksums
        working-directory: ./binaries
        run: |
          chmod +x labops-linux-* 2>/dev/null || true
          sha256sum labops-* > SHA256SUMS.txt
          echo "=== Generated Checksums ==="
          cat SHA256SUMS.txt

      - name: Upload Unified Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labops-cli-binaries
          path: ./binaries/
          retention-days: 30
