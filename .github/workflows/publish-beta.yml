name: publish-beta-release

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build and push all images'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-beta-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
  CDN_URL: ${{ vars.CDN_URL }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
  DYNAMODB_REGION: ${{ vars.DYNAMODB_REGION }}
  DYNAMODB_TABLE_BASE_IMAGES: ${{ vars.DYNAMODB_TABLE_BASE_IMAGES }}
  DYNAMODB_TABLE_APPS: ${{ vars.DYNAMODB_TABLE_APPS }}
  DYNAMODB_TABLE_LABS: ${{ vars.DYNAMODB_TABLE_LABS }}

jobs:
  # ── DETECT CHANGES ──────────────────────────────────────────────
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      frontend: ${{ steps.filter.outputs.frontend }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      content_sync: ${{ steps.filter.outputs.content_sync }}
      proxy: ${{ steps.filter.outputs.proxy }}
      lab_ubuntu: ${{ steps.filter.outputs.lab_ubuntu }}
      lab_docker: ${{ steps.filter.outputs.lab_docker }}
      lab_docker_fundamentals: ${{ steps.filter.outputs.lab_docker_fundamentals }}
      lab_docker_build: ${{ steps.filter.outputs.lab_docker_build }}
      lab_git_fundamentals: ${{ steps.filter.outputs.lab_git_fundamentals }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflow:
              - '.github/workflows/publish-beta.yml'
              - 'scripts/manage_image_registry.py'
            frontend:
              - 'next-app/**'
            orchestrator:
              - 'orchestrator/app/**'
              - 'orchestrator/Dockerfile'
              - 'orchestrator/requirements.txt'
            content_sync:
              - 'sidecars/content-sync/**'
            proxy:
              - 'proxy/**'
            lab_ubuntu:
              - 'orchestrator/lab-images/Dockerfile.ubuntu'
            lab_docker:
              - 'orchestrator/lab-images/Dockerfile.docker'
            lab_docker_fundamentals:
              - 'orchestrator/lab-images/Dockerfile.docker-fundamentals'
            lab_docker_build:
              - 'orchestrator/lab-images/Dockerfile.docker-build'
            lab_git_fundamentals:
              - 'orchestrator/lab-images/Dockerfile.git-fundamentals'

  # ── 1. BUILD & PACK CURRICULUM CONTENT ───────────────────────────
  build-content:
    name: Build Curriculum Content & Catalog (Beta)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Validate Curriculum Content
        run: python scripts/validate_content.py content-v2/

      - name: Generate Content Manifest & Tarball
        run: python scripts/generate_manifest.py content-v2/ out/

      - name: Upload Content Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-content-out
          path: out/
          retention-days: 1

  # ── 2. BUILD & PUSH OCI IMAGES FOR BETA ──────────────────────────
  build-images:
    name: Build & Push OCI Images to ECR (Beta)
    needs: changes
    runs-on: ubuntu-latest
    environment: beta
    env:
      ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
      CDN_URL: ${{ vars.CDN_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
      DYNAMODB_REGION: ${{ vars.DYNAMODB_REGION }}
      DYNAMODB_TABLE_BASE_IMAGES: ${{ vars.DYNAMODB_TABLE_BASE_IMAGES }}
      DYNAMODB_TABLE_APPS: ${{ vars.DYNAMODB_TABLE_APPS }}
      DYNAMODB_TABLE_LABS: ${{ vars.DYNAMODB_TABLE_LABS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DynamoDB Client
        run: pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_AUTH_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push All Services & Lab Images (Beta)
        id: docker-build
        run: |
          REG="${{ env.ECR_PUBLIC_REGISTRY }}"
          BETA_TAG="beta-${GITHUB_SHA::7}"
          FORCE="${{ github.event.inputs.force_build_all == 'true' || needs.changes.outputs.workflow == 'true' }}"

          echo "Checking DynamoDB state for Beta environment..."
          python scripts/manage_image_registry.py check-missing > missing.json
          cat missing.json

          NEED_FE=$(jq -r '.frontend' missing.json)
          NEED_ORCH=$(jq -r '.orchestrator' missing.json)
          NEED_SYNC=$(jq -r '."content-sync"' missing.json)
          NEED_PROXY=$(jq -r '.proxy' missing.json)
          NEED_UBUNTU=$(jq -r '."labops-ubuntu"' missing.json)
          NEED_DOCKER=$(jq -r '."labops-docker"' missing.json)
          NEED_FUND=$(jq -r '."labops-docker-fundamentals"' missing.json)
          NEED_BUILD=$(jq -r '."labops-docker-build"' missing.json)
          NEED_GIT=$(jq -r '."labops-git-fundamentals"' missing.json)

          # 1. Frontend
          if [ "${FORCE}" = "true" ] || [ "${{ needs.changes.outputs.frontend }}" = "true" ] || [ "${NEED_FE}" = "false" ]; then
            echo "==> Building frontend..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-node:20-alpine" \
              -t "${REG}/labops-frontend:beta" -t "${REG}/labops-frontend:${BETA_TAG}" --push ./next-app
            FE_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-frontend:beta" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category app --name frontend \
              --remote "${REG}/labops-frontend:${BETA_TAG}" --digest "${FE_DIGEST}" --commit "${GITHUB_SHA}"
          else
            echo "==> Skipping frontend: unchanged and registered in DynamoDB."
          fi

          # 2. Orchestrator
          if [ "${FORCE}" = "true" ] || [ "${{ needs.changes.outputs.orchestrator }}" = "true" ] || [ "${NEED_ORCH}" = "false" ]; then
            echo "==> Building orchestrator..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-python:3.12-alpine" \
              -t "${REG}/labops-orchestrator:beta" -t "${REG}/labops-orchestrator:${BETA_TAG}" --push ./orchestrator
            ORCH_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-orchestrator:beta" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category app --name orchestrator \
              --remote "${REG}/labops-orchestrator:${BETA_TAG}" --digest "${ORCH_DIGEST}" --commit "${GITHUB_SHA}"
          else
            echo "==> Skipping orchestrator: unchanged and registered in DynamoDB."
          fi

          # 3. Content-Sync
          if [ "${FORCE}" = "true" ] || [ "${{ needs.changes.outputs.content_sync }}" = "true" ] || [ "${NEED_SYNC}" = "false" ]; then
            echo "==> Building content-sync..."
            docker buildx build --platform linux/amd64 \
              --build-arg BUILD_BASE_IMAGE="${REG}/labops-golang:1.23-alpine" \
              --build-arg RUNTIME_BASE_IMAGE="${REG}/labops-alpine:3.20" \
              --build-arg DEFAULT_CDN_URL="${{ env.CDN_URL }}" \
              -t "${REG}/labops-content-sync:beta" -t "${REG}/labops-content-sync:${BETA_TAG}" --push ./sidecars/content-sync
            SYNC_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-content-sync:beta" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category app --name content-sync \
              --remote "${REG}/labops-content-sync:${BETA_TAG}" --digest "${SYNC_DIGEST}" --commit "${GITHUB_SHA}"
          else
            echo "==> Skipping content-sync: unchanged and registered in DynamoDB."
          fi

          # 4. Proxy
          if [ "${FORCE}" = "true" ] || [ "${{ needs.changes.outputs.proxy }}" = "true" ] || [ "${NEED_PROXY}" = "false" ]; then
            echo "==> Building proxy..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-nginx:1.27-alpine" \
              -t "${REG}/labops-proxy:beta" -t "${REG}/labops-proxy:${BETA_TAG}" --push ./proxy
            PROXY_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-proxy:beta" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category app --name proxy \
              --remote "${REG}/labops-proxy:${BETA_TAG}" --digest "${PROXY_DIGEST}" --commit "${GITHUB_SHA}"
          else
            echo "==> Skipping proxy: unchanged and registered in DynamoDB."
          fi

          # 5. Base Labs & Preloaded Labs
          if [ "${FORCE}" = "true" ] || [ "${{ needs.changes.outputs.lab_ubuntu }}" = "true" ] || [ "${NEED_UBUNTU}" = "false" ]; then
            echo "==> Building labops-ubuntu..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-ubuntu:22.04" \
              -t "${REG}/labops-ubuntu:beta" -t "${REG}/labops-ubuntu:${BETA_TAG}" \
              -f ./orchestrator/lab-images/Dockerfile.ubuntu --push ./orchestrator/lab-images
            UBUNTU_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-ubuntu:beta" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-ubuntu \
              --remote "${REG}/labops-ubuntu:${BETA_TAG}" --digest "${UBUNTU_DIGEST}" --commit "${GITHUB_SHA}" --alias "labops-ubuntu:latest"
          else
            echo "==> Skipping labops-ubuntu: unchanged and registered in DynamoDB."
          fi

          if [ "${FORCE}" = "true" ] || [ "${{ needs.changes.outputs.lab_docker }}" = "true" ] || [ "${{ needs.changes.outputs.lab_ubuntu }}" = "true" ] || [ "${NEED_DOCKER}" = "false" ]; then
            echo "==> Building labops-docker..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-ubuntu:beta" \
              -t "${REG}/labops-docker:beta" -t "${REG}/labops-docker:${BETA_TAG}" \
              -f ./orchestrator/lab-images/Dockerfile.docker --push ./orchestrator/lab-images
            DOCKER_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-docker:beta" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-docker \
              --remote "${REG}/labops-docker:${BETA_TAG}" --digest "${DOCKER_DIGEST}" --commit "${GITHUB_SHA}" --alias "labops-docker:latest"
          else
            echo "==> Skipping labops-docker: unchanged and registered in DynamoDB."
          fi

          if [ "${FORCE}" = "true" ] || [ "${{ needs.changes.outputs.lab_docker_fundamentals }}" = "true" ] || [ "${{ needs.changes.outputs.lab_ubuntu }}" = "true" ] || [ "${NEED_FUND}" = "false" ]; then
            echo "==> Building labops-docker-fundamentals..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-ubuntu:beta" \
              -t "${REG}/labops-docker-fundamentals:beta" -t "${REG}/labops-docker-fundamentals:${BETA_TAG}" \
              -f ./orchestrator/lab-images/Dockerfile.docker-fundamentals --push ./orchestrator/lab-images
            FUND_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-docker-fundamentals:beta" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-docker-fundamentals \
              --remote "${REG}/labops-docker-fundamentals:${BETA_TAG}" --digest "${FUND_DIGEST}" --commit "${GITHUB_SHA}" --alias "labops-docker-fundamentals:latest"
          else
            echo "==> Skipping labops-docker-fundamentals: unchanged and registered in DynamoDB."
          fi

          if [ "${FORCE}" = "true" ] || [ "${{ needs.changes.outputs.lab_docker_build }}" = "true" ] || [ "${{ needs.changes.outputs.lab_docker }}" = "true" ] || [ "${NEED_BUILD}" = "false" ]; then
            echo "==> Building labops-docker-build..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-docker:beta" \
              -t "${REG}/labops-docker-build:beta" -t "${REG}/labops-docker-build:${BETA_TAG}" \
              -f ./orchestrator/lab-images/Dockerfile.docker-build --push ./orchestrator/lab-images
            BUILD_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-docker-build:beta" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-docker-build \
              --remote "${REG}/labops-docker-build:${BETA_TAG}" --digest "${BUILD_DIGEST}" --commit "${GITHUB_SHA}" --alias "labops-docker-build:latest"
          else
            echo "==> Skipping labops-docker-build: unchanged and registered in DynamoDB."
          fi

          if [ "${FORCE}" = "true" ] || [ "${{ needs.changes.outputs.lab_git_fundamentals }}" = "true" ] || [ "${{ needs.changes.outputs.lab_ubuntu }}" = "true" ] || [ "${NEED_GIT}" = "false" ]; then
            echo "==> Building labops-git-fundamentals..."
            docker buildx build --platform linux/amd64 --build-arg BASE_IMAGE="${REG}/labops-ubuntu:beta" \
              -t "${REG}/labops-git-fundamentals:beta" -t "${REG}/labops-git-fundamentals:${BETA_TAG}" \
              -f ./orchestrator/lab-images/Dockerfile.git-fundamentals --push ./orchestrator/lab-images
            GIT_DIGEST=$(docker buildx imagetools inspect "${REG}/labops-git-fundamentals:beta" --raw | sha256sum | cut -d' ' -f1)
            python scripts/manage_image_registry.py record --category lab --name labops-git-fundamentals \
              --remote "${REG}/labops-git-fundamentals:${BETA_TAG}" --digest "${GIT_DIGEST}" --commit "${GITHUB_SHA}" --alias "labops-git-fundamentals:latest"
          else
            echo "==> Skipping labops-git-fundamentals: unchanged and registered in DynamoDB."
          fi

          echo "Exporting images.json from DynamoDB..."
          python scripts/manage_image_registry.py export-manifest --output images.json
          cat images.json

      - name: Upload Images Metadata Map
        uses: actions/upload-artifact@v4
        with:
          name: beta-images-meta
          path: images.json
          retention-days: 1

  # ── 3. PUBLISH BETA RELEASE MANIFEST & CDN ────────────────────────
  publish-release:
    name: Publish Unified Beta Release Manifest & Content
    runs-on: ubuntu-latest
    needs: [build-content, build-images]
    environment: beta
    env:
      ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
      CDN_URL: ${{ vars.CDN_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Content Output
        uses: actions/download-artifact@v4
        with:
          name: beta-content-out
          path: out/

      - name: Download Images Metadata
        uses: actions/download-artifact@v4
        with:
          name: beta-images-meta
          path: ./

      - name: Generate Unified Beta Release Manifest
        run: |
          BETA_TAG="beta-${GITHUB_SHA::7}"
          python scripts/generate_release_manifest.py \
            "${BETA_TAG}" \
            "beta" \
            out/ \
            images.json \
            --cdn-url "${{ env.CDN_URL }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_AUTH_REGION }}

      - name: Upload Content & Manifests to S3 (Beta)
        run: |
          # 1. Immutable content & release version manifest
          aws s3 cp out/published/ "s3://${S3_BUCKET}/published/" --recursive --cache-control "public, max-age=31536000, immutable"
          aws s3 cp out/releases/ "s3://${S3_BUCKET}/releases/" --recursive --cache-control "public, max-age=60, s-maxage=60"

          # 2. Root pointers
          aws s3 cp out/catalog.json "s3://${S3_BUCKET}/catalog.json" --cache-control "public, max-age=60, s-maxage=60"
          aws s3 cp out/latest.json "s3://${S3_BUCKET}/latest.json" --cache-control "public, max-age=60, s-maxage=60"

          # 3. Landing page & assets (Root for Beta CDN)
          aws s3 cp landing/index.html "s3://${S3_BUCKET}/index.html" --content-type "text/html" --cache-control "public, max-age=300"
          aws s3 cp landing/assets/ "s3://${S3_BUCKET}/assets/" --recursive --cache-control "public, max-age=86400"

          # 4. Also publish under /beta/ prefix for multi-channel Prod CDN routing
          aws s3 cp landing/index.html "s3://${S3_BUCKET}/beta/index.html" --content-type "text/html" --cache-control "public, max-age=300"
          aws s3 cp landing/assets/ "s3://${S3_BUCKET}/beta/assets/" --recursive --cache-control "public, max-age=86400"

      - name: Invalidate CloudFront Beta CDN Cache
        run: |
          if [ -n "$CLOUDFRONT_DIST_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CLOUDFRONT_DIST_ID" \
              --paths "/releases/*" "/latest.json" "/catalog.json" "/" "/index.html" "/assets/*" "/beta/*"
          fi

  # ── 4. CROSS-COMPILE LABOPS CLI (BETA) ────────────────────────────
  build-beta-cli:
    name: Build LabOps CLI (Beta)
    runs-on: ubuntu-latest
    needs: publish-release
    environment: beta
    env:
      ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
      ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
      CDN_URL: ${{ vars.CDN_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            binary: labops-linux-amd64
          - os: windows
            arch: amd64
            binary: labops-windows-amd64.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Compile Binary
        working-directory: ./cli
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CHANNEL: beta
          REGISTRY: ${{ env.ECR_PUBLIC_REGISTRY }}
          CDN: ${{ env.CDN_URL }}
        run: |
          go build \
            -ldflags="-s -w -X main.defaultChannel=${CHANNEL} -X main.defaultRegistry=${REGISTRY} -X main.defaultCDNURL=${CDN}" \
            -trimpath \
            -o "${{ matrix.binary }}" .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-beta-binary-${{ matrix.os }}-${{ matrix.arch }}
          path: ./cli/${{ matrix.binary }}

  # ── 5. BUNDLE & PUBLISH CLI DOWNLOADS ────────────────────────────
  package-bundle:
    name: Package Beta Release Bundle & Checksums
    runs-on: ubuntu-latest
    needs: build-beta-cli
    environment: beta
    env:
      ECR_AUTH_REGION: ${{ vars.ECR_AUTH_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
      CDN_URL: ${{ vars.CDN_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
    steps:
      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-beta-binary-*
          path: ./binaries
          merge-multiple: true

      - name: Generate Checksums & Archives
        working-directory: ./binaries
        run: |
          chmod +x labops-linux-* 2>/dev/null || true
          tar -czf labops-linux-amd64.tar.gz labops-linux-amd64
          sha256sum labops-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_AUTH_REGION }}

      - name: Upload Binaries to S3 (Beta)
        run: |
          BETA_TAG="beta-${GITHUB_SHA::7}"
          # 1. Active channel downloads (Root for Beta CDN)
          aws s3 cp ./binaries/ "s3://${S3_BUCKET}/downloads/" --recursive --cache-control "public, max-age=300"
          # 2. Multi-channel downloads for Prod CDN routing (/downloads/beta/*)
          aws s3 cp ./binaries/ "s3://${S3_BUCKET}/downloads/beta/" --recursive --cache-control "public, max-age=300"
          # 3. Immutable archived release downloads
          aws s3 cp ./binaries/ "s3://${S3_BUCKET}/releases/${BETA_TAG}/downloads/" --recursive --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront CDN Cache for Downloads
        run: |
          if [ -n "$CLOUDFRONT_DIST_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CLOUDFRONT_DIST_ID" \
              --paths "/downloads/*" "/downloads/beta/*"
          fi

      - name: Summary
        run: |
          BETA_TAG="beta-${GITHUB_SHA::7}"
          echo "## 🚀 Beta Release Published" >> $GITHUB_STEP_SUMMARY
          echo "* **Immutable Release Tag:** \`${BETA_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Beta CDN:** ${{ env.CDN_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "* **Manifest:** ${{ env.CDN_URL }}/releases/beta.json" >> $GITHUB_STEP_SUMMARY
          echo "* **Downloads:** ${{ env.CDN_URL }}/downloads/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Promote this release to production by merging into \`master\` or triggering \`promote-prod.yml\` with release tag \`${BETA_TAG}\`." >> $GITHUB_STEP_SUMMARY
