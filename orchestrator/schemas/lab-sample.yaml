# ──────────────────────────────────────────────────────────────
# lab.yaml — Lab Definition Reference
# ──────────────────────────────────────────────────────────────
#
# This file shows the canonical (flat) format — the ONLY format the
# pipeline reads. One lab per directory:
#
#   courses/{course}/modules/{module}/labs/{lab-id}/lab.yaml
#   courses/{course}/modules/{module}/labs/{lab-id}/instructions.md
#
# Environment config is shared and referenced by string from
# content-v2/environments/{name}.yaml.
#
# The orchestrator never reads lab.yaml — it only runs commands
# the frontend sends via exec. The backend reads it for the
# environment config. The frontend reads it for task prompts.
# ──────────────────────────────────────────────────────────────

id: hello-world
title: Hello World Container
difficulty: beginner
estimated_time: 10
xp: 50
tags:
  - docker
  - containers
  - fundamentals

objectives:
  - Inspect the local image cache
  - Run a detached nginx container
  - Verify a running container

# Environment is a string reference to environments/docker-basic.yaml
environment: docker-basic

# Optional commands to reset state before this lab
setup:
  - command: docker rm -f web || true

tasks:

  - id: count-images
    title: Check available images
    prompt: How many images are currently available locally?
    type: multiple_choice
    options_source: dynamic
    validation:
      command: docker images -q | wc -l | tr -d ' '
      match_type: exact
    error_message: "Not quite. Run docker images to see everything."
    hint: "What command lists local images?"

  - id: run-nginx
    title: Launch nginx
    description: Start an nginx container named web in the background.
    prompt: Run an nginx container named **web** in detached mode.
    type: terminal_action
    validation:
      command: docker ps --format '{{.Names}}'
      match_type: contains
      expected_output: web
    error_message: "Could not find a running container named web."
    hint: "How do you name a container and run it in the background?"

  - id: verify-running
    prompt: How many containers are now running?
    type: multiple_choice
    options_source: dynamic
    validation:
      command: docker ps -q | wc -l | tr -d ' '
      match_type: exact
    error_message: "Check docker ps — one of those numbers matches."
    hint: "What command lists running containers?"

  - id: check-port
    title: Port is published
    prompt: Is host port 8080 published by the web container?
    type: port_check
    validation:
      command: docker port web 80 2>/dev/null | grep -q 8080 && echo MAPPED
      match_type: exact
      expected_output: MAPPED
    error_message: "Port 8080 is not mapped to web."
    hint: "What command shows port mappings for a container?"

  - id: write-file
    title: Create a config file
    prompt: Create a file /tmp/app.conf containing the string DEBUG=false.
    type: file_check
    validation:
      path: /tmp/app.conf
      contains: DEBUG=false
    error_message: "The file is missing or does not contain DEBUG=false."
    hint: "What command writes text to a file?"

completion:
  required_tasks: all
