<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; }
    .code-bg { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 6; }
    .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: bold; font-size: 14px; fill: #c9d1d9; }
    .code-text { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; font-size: 13px; fill: #c9d1d9; }
    .marker { font-weight: bold; fill: #f85149; }
    .marker-base { font-weight: bold; fill: #d29922; }
    .marker-sep { font-weight: bold; fill: #58a6ff; }
    .annotation { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; font-style: italic; }
    .brace { stroke: #8b949e; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Background -->
  <rect width="800" height="520" class="bg" rx="8" />

  <!-- Title -->
  <text x="30" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18px" font-weight="bold" fill="#ffffff">Git Conflict Markers: diff3 Style Layout</text>
  <text x="30" y="55" class="annotation">Enabled via: git config --global merge.conflictstyle diff3</text>

  <!-- Code Block Container -->
  <rect x="30" y="80" width="500" height="400" class="code-bg" />

  <!-- Code Content -->
  <text x="50" y="115" class="code-text"><tspan class="marker">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</tspan></text>
  <text x="50" y="145" class="code-text" fill="#ff7b72">// Changes on your current branch</text>
  <text x="50" y="165" class="code-text">let timeout = 5000;</text>
  
  <text x="50" y="210" class="code-text"><tspan class="marker-base">||||||| base (Common Ancestor)</tspan></text>
  <text x="50" y="240" class="code-text" fill="#8b949e">// Original code before divergence</text>
  <text x="50" y="260" class="code-text">let timeout = 1000;</text>

  <text x="50" y="305" class="code-text"><tspan class="marker-sep">=======</tspan></text>
  
  <text x="50" y="350" class="code-text" fill="#3fb950">// Changes from incoming branch (MERGE_HEAD)</text>
  <text x="50" y="370" class="code-text">let timeout = 3000;</text>
  <text x="50" y="405" class="code-text"><tspan class="marker">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-branch</tspan></text>

  <!-- Annotations / Braces pointing to sections -->
  <!-- HEAD Section -->
  <path d="M 545,105 Q 565,105 565,130 L 565,140 Q 565,155 580,155 Q 565,155 565,170 L 565,180 Q 565,205 545,205" class="brace" />
  <text x="595" y="150" class="header-text" fill="#ff7b72">1. Local Changes (HEAD)</text>
  <text x="595" y="168" class="annotation">What your current branch looks like</text>

  <!-- Base Section -->
  <path d="M 545,200 Q 565,200 565,225 L 565,235 Q 565,250 580,250 Q 565,250 565,265 L 565,275 Q 565,300 545,300" class="brace" />
  <text x="595" y="245" class="header-text" fill="#d29922">2. Common Ancestor (Base)</text>
  <text x="595" y="263" class="annotation">What the code looked like before</text>
  <text x="595" y="279" class="annotation">either branch made modifications</text>

  <!-- Incoming Section -->
  <path d="M 545,305 Q 565,305 565,335 L 565,355 Q 565,375 580,375 Q 565,375 565,395 L 565,410 Q 565,435 545,435" class="brace" />
  <text x="595" y="365" class="header-text" fill="#3fb950">3. Incoming Changes (MERGE_HEAD)</text>
  <text x="595" y="383" class="annotation">What the incoming branch introduced</text>
</svg>
