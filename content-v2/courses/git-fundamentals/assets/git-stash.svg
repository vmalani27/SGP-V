<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-stash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" rx="12"/>

  <!-- Title & Subtitle -->
  <text x="400" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">How "git stash" Works Internally</text>
  <text x="400" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Creates temporary commits to capture Working Directory and Index states</text>

  <!-- STATE BEFORE STASH -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="220" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="40" fill="#e2e8f0" rx="8"/>
    <path d="M 0 30 L 220 30" stroke="#cbd5e1" stroke-width="2"/>
    <text x="110" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Before: Dirty Working State</text>

    <!-- HEAD Commit Node -->
    <g transform="translate(20, 60)">
      <circle cx="20" cy="20" r="16" fill="#3b82f6"/>
      <text x="20" y="25" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">H</text>
      <text x="50" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">HEAD / main</text>
      <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Last committed state</text>
    </g>

    <line x1="40" y1="100" x2="40" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Index / Staged Area -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="180" height="70" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="6"/>
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Staged Changes (Index)</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#3b82f6">Changes ready to commit</text>
      <circle cx="160" cy="35" r="8" fill="#2563eb"/>
      <text x="160" y="39" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">S</text>
    </g>

    <line x1="40" y1="215" x2="40" y2="235" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Working Directory Area -->
    <g transform="translate(20, 245)">
      <rect x="0" y="0" width="180" height="70" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" rx="6"/>
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Working Directory</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#dc2626">Modified / untracked files</text>
      <circle cx="160" cy="35" r="8" fill="#dc2626"/>
      <text x="160" y="39" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">W</text>
    </g>
  </g>

  <!-- ACTION ARROW -->
  <g transform="translate(280, 250)">
    <path d="M 0 0 L 80 0" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-stash)"/>
    <rect x="15" y="-22" width="50" height="20" fill="#fef3c7" rx="4" stroke="#f59e0b" stroke-width="1"/>
    <text x="40" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">git stash</text>
  </g>

  <!-- STATE AFTER STASH -->
  <g transform="translate(390, 100)">
    <rect x="0" y="0" width="370" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="370" height="40" fill="#f1f5f9" rx="8"/>
    <path d="M 0 30 L 370 30" stroke="#cbd5e1" stroke-width="2"/>
    <text x="185" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">After: Clean Working Directory &amp; Stash Stack</text>

    <!-- HEAD Restored Clean -->
    <g transform="translate(20, 60)">
      <circle cx="20" cy="20" r="16" fill="#3b82f6"/>
      <text x="20" y="25" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">H</text>
      <text x="50" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">HEAD / main (Clean)</text>
      <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Working tree matches HEAD</text>
    </g>

    <path d="M 20 110 L 350 110" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Stash Commits Hierarchy Section -->
    <text x="20" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#b45309">Stash Reference (refs/stash / stash@{0})</text>

    <!-- Working Tree Stash Commit (Top) -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="330" height="75" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" rx="6"/>
      <circle cx="25" cy="37" r="14" fill="#d97706"/>
      <text x="25" y="41" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">W*</text>
      
      <text x="55" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Stash Working Tree Commit</text>
      <text x="55" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#78350f">Captures uncommitted changes from Working Dir</text>
      <text x="55" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a16207">Parent 1: HEAD  |  Parent 2: Index Commit (I*)</text>
    </g>

    <path d="M 185 235 L 185 255" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-stash)"/>

    <!-- Index Stash Commit (Bottom) -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="330" height="60" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5" rx="6"/>
      <circle cx="25" cy="30" r="14" fill="#f59e0b"/>
      <text x="25" y="34" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">I*</text>
      
      <text x="55" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Stash Index Commit</text>
      <text x="55" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#78350f">Captures staged changes (Index state)</text>
    </g>
  </g>
</svg>
