id: lab-8
title: "Merging and Resolving Conflicts"
difficulty: intermediate
estimated_time: 25
tags:
  - git
  - branches
  - merge
environment: git-fundamentals
summary: >-
  Integrate feature branches into main by performing a fast-forward merge,
  handling a divergent merge conflict, and manually resolving conflicting lines.

objectives:
  - Perform a fast-forward merge and verify linear history
  - Trigger and diagnose a merge conflict using git status and conflict markers
  - Manually resolve conflict markers and finalize the merge commit
  - Delete merged feature branches

setup:
  - command: >
      mkdir -p /home/student/service-repo && cd /home/student/service-repo &&
      git init &&
      git config user.email "student@lab.local" &&
      git config user.name "Student" &&
      printf 'def init_service():\n    print("Starting service v1.0")\n    timeout = 10\n    workers = 2\n    return True\n' > app.py &&
      git add app.py &&
      git commit -m "Initial service setup" &&
      git branch feature/logging &&
      git checkout feature/logging &&
      printf '# Standard logging module\nimport logging\nlogging.basicConfig(level=logging.INFO)\n\ndef init_service():\n    logging.info("Starting service v1.0")\n    timeout = 10\n    workers = 2\n    return True\n' > app.py &&
      git commit -am "Add structured logging to init_service" &&
      git checkout main &&
      git checkout -b feature/timeout &&
      printf '# Standard logging module\nimport logging\nlogging.basicConfig(level=logging.INFO)\n\ndef init_service():\n    logging.info("Starting service v1.0")\n    timeout = 30\n    workers = 2\n    return True\n' > app.py &&
      git commit -am "Increase default request timeout to 30s" &&
      git checkout main &&
      printf 'def init_service():\n    print("Starting service v1.0")\n    timeout = 10\n    workers = 4\n    return True\n' > app.py &&
      git commit -am "Scale worker count to 4"

completion:
  required_tasks: all

tasks:
  - id: fast-forward-merge
    summary: Fast-forward merge feature/logging into main
    prompt: >-
      In `/home/student/service-repo`, integrate `feature/logging` into `main` using
      a fast-forward merge, then delete the obsolete feature branch.
    type: terminal_action
    hints:
      - "Ensure your active branch is main before initiating the merge."
      - "Clean up the merged branch reference once main has advanced."
    solution:
      command: "cd /home/student/service-repo && git checkout main && git merge feature/logging && git branch -d feature/logging"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/service-repo')

        # Confirm on main
        branch = subprocess.run(['git', 'branch', '--show-current'], capture_output=True, text=True).stdout.strip()
        if branch != 'main':
            print('RESULT_FAIL: not on main branch')
            sys.exit(1)

        # Check that the logging commit is in main's history
        log = subprocess.run(['git', 'log', '--oneline'], capture_output=True, text=True).stdout
        if 'Add structured logging' not in log:
            print('RESULT_FAIL: feature/logging was not merged into main')
            sys.exit(1)

        # Check feature/logging was deleted
        branches = subprocess.run(['git', 'branch'], capture_output=True, text=True).stdout
        if 'feature/logging' in branches:
            print('RESULT_FAIL: feature/logging branch was not deleted')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      The logging changes are not merged into `main`, or the feature branch has not been deleted.

  - id: trigger-merge-conflict
    summary: Initiate a merge with conflicting changes
    prompt: >-
      From the `main` branch, begin merging `feature/timeout`. Leave the repository
      in the conflicted state so you can inspect the conflicting changes.
    type: terminal_action
    hints:
      - "Merge the timeout branch into main and let Git flag the collision."
    solution:
      command: "cd /home/student/service-repo && git merge feature/timeout"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/service-repo')

        # Check for MERGE_HEAD
        if not os.path.exists('.git/MERGE_HEAD'):
            print('RESULT_FAIL: repo is not currently in a merge state — run git merge feature/timeout')
            sys.exit(1)

        status = subprocess.run(['git', 'status'], capture_output=True, text=True).stdout
        if 'both modified' not in status or 'app.py' not in status:
            print('RESULT_FAIL: app.py is not marked as conflicted in git status')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      The repository is not in an active merge conflict state for `app.py`.

  - id: identify-conflict-marker
    summary: Identify the current branch conflict marker
    prompt: >-
      When a conflict occurs in Git, conflict markers are written directly into
      the file around the conflicting lines.

      Which marker indicates the beginning of the lines coming from your currently
      active branch (`HEAD`)?
    type: multiple_choice
    options:
      - "<<<<<<< HEAD"
      - ">>>>>>> HEAD"
      - "======= HEAD"
      - "||||||| HEAD"
    validation:
      expected_answer: "<<<<<<< HEAD"
    hints:
      - "Review the marker syntax that opens the conflict section for the active branch."

  - id: resolve-and-commit
    summary: Resolve the merge conflict and commit
    prompt: >-
      Resolve the conflict in `app.py` by combining both changes: keep `timeout = 30`
      from `feature/timeout` and `workers = 4` from `main`. Remove all conflict
      markers and complete the merge commit.
    type: terminal_action
    hints:
      - "Ensure all conflict markers are removed and both configuration values are present."
      - "Stage the resolved file and finalize the merge commit."
    solution:
      command: "cd /home/student/service-repo && printf 'def init_service():\\n    print(\"Starting service v1.0\")\\n    timeout = 30\\n    workers = 4\\n    return True\\n' > app.py && git add app.py && git commit -m \"Merge branch 'feature/timeout'\""
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/service-repo')

        # Check MERGE_HEAD is gone
        if os.path.exists('.git/MERGE_HEAD'):
            print('RESULT_FAIL: merge is still in progress — did you run git commit?')
            sys.exit(1)

        # Check file content
        content = open('app.py').read()
        for marker in ['<<<<<<<', '=======', '>>>>>>>']:
            if marker in content:
                print(f'RESULT_FAIL: conflict marker {marker} still present in app.py')
                sys.exit(1)

        if 'timeout = 30' not in content:
            print('RESULT_FAIL: expected timeout = 30 in app.py')
            sys.exit(1)

        if 'workers = 4' not in content:
            print('RESULT_FAIL: expected workers = 4 in app.py')
            sys.exit(1)

        # Check that latest commit is a merge commit (has 2 parents)
        parents = subprocess.run(['git', 'rev-parse', 'HEAD^@'], capture_output=True, text=True).stdout.strip().split()
        if len(parents) < 2:
            print('RESULT_FAIL: latest commit is not a merge commit (has fewer than 2 parents)')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      The conflict in `app.py` is unresolved, markers remain, or the merge commit was not finalized.

  - id: cleanup-branch
    summary: Delete the merged feature branch
    prompt: >-
      Now that `feature/timeout` is merged into `main`, delete the completed
      feature branch to keep the repository clean.
    type: terminal_action
    hints:
      - "Remove the local branch reference for feature/timeout."
    solution:
      command: "cd /home/student/service-repo && git branch -d feature/timeout"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/service-repo')

        branches = subprocess.run(['git', 'branch'], capture_output=True, text=True).stdout
        if 'feature/timeout' in branches:
            print('RESULT_FAIL: feature/timeout branch is still present')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      Branch `feature/timeout` still exists. Ensure it is deleted from local references.
