id: lab-7
title: Branches
difficulty: intermediate
estimated_time: 15
tags:
  - git
  - branches
environment: git-fundamentals

setup:
  - command: >-
      mkdir -p /home/student/workspace/team-project &&
      cd /home/student/workspace/team-project &&
      git init &&
      git config user.name "Student" &&
      git config user.email "student@labops.local" &&
      echo "# Team Project" > README.md &&
      git add README.md &&
      git commit -m "Initial commit" &&
      chown -R student:student /home/student/workspace/team-project

objectives:
  - Create and switch between branches
  - Make commits on a branch without affecting main
  - Observe that main is untouched while a feature branch advances
  - Delete a branch after merging

tasks:
  - id: create-feature-branch
    summary: Create and checkout a feature branch
    prompt: >-
      In `~/workspace/team-project`, create a new branch named `feature/add-docs`
      and make it your active branch.
    type: terminal_action
    hints:
      - "Create the branch and check it out as your working branch."
    solution:
      command: "cd ~/workspace/team-project && git switch -c feature/add-docs"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        result = subprocess.run(
            ['git', 'branch', '--show-current'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/team-project')
        )
        current = result.stdout.decode().strip()
        if current != 'feature/add-docs':
            print(f'Expected feature/add-docs, currently on: {current}')
            sys.exit(0)

        print('BRANCH_CREATED')
        "
      match_type: exact
      expected_output: BRANCH_CREATED
    error_message: >-
      Active branch is not `feature/add-docs`. Ensure the branch is created and checked out.

  - id: commit-on-branch
    summary: Commit changes on the feature branch
    prompt: >-
      On `feature/add-docs`, add documentation by creating `docs/setup.md` and
      `docs/usage.md`. Commit each file in a separate, focused commit.
    type: terminal_action
    hints:
      - "Stage and commit each documentation file individually."
    solution:
      command: "cd ~/workspace/team-project && mkdir -p docs && echo '# Setup' > docs/setup.md && git add docs/setup.md && git commit -m 'Add setup guide' && echo '# Usage' > docs/usage.md && git add docs/usage.md && git commit -m 'Add usage guide'"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        cwd = os.path.expanduser('~/workspace/team-project')

        # Must still be on feature branch
        branch = subprocess.run(['git', 'branch', '--show-current'], capture_output=True, cwd=cwd)
        if branch.stdout.decode().strip() != 'feature/add-docs':
            print('Not on feature/add-docs.')
            sys.exit(0)

        # Count commits ahead of main
        ahead = subprocess.run(
            ['git', 'log', '--oneline', 'main..feature/add-docs'],
            capture_output=True, cwd=cwd
        )
        commits = ahead.stdout.decode().strip().splitlines()
        if len(commits) < 2:
            print(f'Expected at least 2 commits ahead of main, found {len(commits)}.')
            sys.exit(0)

        # Both files must exist in HEAD
        for f in ['docs/setup.md', 'docs/usage.md']:
            check = subprocess.run(['git', 'show', f'HEAD:{f}'], capture_output=True, cwd=cwd)
            if check.returncode != 0:
                print(f'{f} not found in HEAD commit.')
                sys.exit(0)

        print('BRANCH_COMMITS_OK')
        "
      match_type: exact
      expected_output: BRANCH_COMMITS_OK
    error_message: >-
      Expected two commits on `feature/add-docs` containing `docs/setup.md` and `docs/usage.md` respectively.

  - id: verify-main-untouched
    summary: Verify branch isolation on main
    prompt: >-
      Switch your active branch back to `main`. Verify that `main` remains clean
      and that the new documentation commits exist only on `feature/add-docs`.
    type: terminal_action
    hints:
      - "Switch your working branch to main to inspect its state."
    solution:
      command: "cd ~/workspace/team-project && git switch main"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        cwd = os.path.expanduser('~/workspace/team-project')

        # Must be on main
        branch = subprocess.run(['git', 'branch', '--show-current'], capture_output=True, cwd=cwd)
        if branch.stdout.decode().strip() != 'main':
            print('Not on main branch.')
            sys.exit(0)

        # docs/setup.md must NOT exist in main
        check = subprocess.run(['git', 'show', 'HEAD:docs/setup.md'], capture_output=True, cwd=cwd)
        if check.returncode == 0:
            print('docs/setup.md exists on main — branch was merged too early or committed to wrong branch.')
            sys.exit(0)

        print('MAIN_CLEAN')
        "
      match_type: exact
      expected_output: MAIN_CLEAN
    error_message: >-
      Active branch is not `main`, or feature commits are present in `main`'s history.

  - id: merge-and-cleanup
    summary: Merge and delete the feature branch
    prompt: >-
      Integrate `feature/add-docs` into `main`, then delete the completed
      feature branch.
    type: terminal_action
    hints:
      - "From main, merge the feature branch before deleting it."
    solution:
      command: "cd ~/workspace/team-project && git merge feature/add-docs && git branch -d feature/add-docs"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        cwd = os.path.expanduser('~/workspace/team-project')

        # Must be on main
        branch = subprocess.run(['git', 'branch', '--show-current'], capture_output=True, cwd=cwd)
        if branch.stdout.decode().strip() != 'main':
            print('Not on main.')
            sys.exit(0)

        # docs/setup.md must now exist on main
        check = subprocess.run(['git', 'show', 'HEAD:docs/setup.md'], capture_output=True, cwd=cwd)
        if check.returncode != 0:
            print('Merge not complete — docs/setup.md not on main yet.')
            sys.exit(0)

        # feature branch must be gone
        branches = subprocess.run(['git', 'branch'], capture_output=True, cwd=cwd)
        if 'feature/add-docs' in branches.stdout.decode():
            print('feature/add-docs still exists.')
            sys.exit(0)

        print('MERGE_CLEANUP_OK')
        "
      match_type: exact
      expected_output: MERGE_CLEANUP_OK
    error_message: >-
      The feature branch has not been merged into `main` or the obsolete branch still exists.

completion:
  required_tasks: all
