id: lab-6
title: "Undoing Mistakes"
difficulty: intermediate
estimated_time: 20
xp: 75
tags:
  - git
  - reset
  - security
  - fundamentals
environment: git-fundamentals
summary: >-
  Recover from an accidental secret commit, protect sensitive files, and
  synchronize the cleaned history with the remote repository.

objectives:
  - Explain why deleting a secret does not remove it from Git history
  - Rewind local history and prevent `.env` from being tracked
  - Update the remote branch after rewriting history

setup:
  - command: >
      curl -s -X DELETE -u student:password123 http://git-server:3000/api/v1/repos/student/api-service || true &&
      rm -rf /home/student/api-service &&
      mkdir -p /home/student/api-service && cd /home/student/api-service &&
      git init -b main &&
      git config user.email "student@labops.local" &&
      git config user.name "Student" &&
      printf 'PORT=8080\nLOG_LEVEL=info\n' > config.env &&
      printf 'import os\n\ndef start():\n    port = os.getenv("PORT", 8080)\n    print(f"API running on port {port}")\n' > server.py &&
      git add config.env server.py &&
      git commit -m "Initial API service setup" &&
      git remote add origin http://git-server:3000/student/api-service.git &&
      git push -u --force origin main &&
      printf 'DB_HOST=prod-db.internal\nDB_USER=admin\nDB_PASS=SuperSecretPassword123!\n' > .env &&
      git add .env &&
      git commit -m "Add production database credentials" &&
      git push origin main

completion:
  required_tasks: all

tasks:
  - id: examine-pushed-secret
    summary: Examine the pushed secret
    prompt: >-
      Inspect the repository history in /home/student/api-service. Why doesn't deleting `.env` in a new commit
      remove the credentials from earlier commits?
    type: multiple_choice
    options:
      - "The secret remains permanently accessible in the previous commit's history and remote logs."
      - "Git automatically prevents commits that delete files without administrative repository permissions."
      - "The remote server will reject the commit because deleted files must be archived before pushing."
      - "Deleting the file triggers a detached HEAD state that prevents any new commits from being pushed."
    validation:
      expected_answer: "The secret remains permanently accessible in the previous commit's history and remote logs."

  - id: rewind-local-commit
    summary: Rewind local history
    prompt: >-
      Remove the latest commit from the local branch history, leaving only the
      initial setup commit.
    type: terminal_action
    hints:
      - "Consider how moving the current branch pointer affects commit history."
    solution:
      command: "cd /home/student/api-service && git reset HEAD~1"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        cwd = '/home/student/api-service'
        if not os.path.exists(cwd):
            print('RESULT_FAIL: Directory does not exist.')
            sys.exit(0)

        # Check git log length is 1 and points to initial setup
        log = subprocess.run(['git', 'log', '--oneline'], capture_output=True, text=True, cwd=cwd).stdout.strip().splitlines()
        if len(log) != 1 or 'Initial API service setup' not in log[0]:
            print('RESULT_FAIL: The local branch history does not match the required state.')
            sys.exit(0)

        print('REWIND_OK')
        "
      match_type: exact
      expected_output: REWIND_OK
    error_message: >-
      The local branch history does not match the required state.

  - id: configure-gitignore
    summary: Configure .gitignore
    prompt: >-
      Add `.env` to `.gitignore` and commit the change.
    type: terminal_action
    solution:
      command: "cd /home/student/api-service && echo '.env' > .gitignore && git add .gitignore && git commit -m 'Add .gitignore to exclude secrets'"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        cwd = '/home/student/api-service'

        gi_path = os.path.join(cwd, '.gitignore')
        if not os.path.exists(gi_path):
            print('RESULT_FAIL: .gitignore file not found.')
            sys.exit(0)

        with open(gi_path) as f:
            content = f.read()
        if '.env' not in content:
            print('RESULT_FAIL: .gitignore does not ignore .env.')
            sys.exit(0)

        # Check .env is not tracked
        tracked = subprocess.run(['git', 'ls-files', '.env'], capture_output=True, text=True, cwd=cwd).stdout.strip()
        if tracked:
            print('RESULT_FAIL: .env is still tracked by Git.')
            sys.exit(0)

        # Check git status clean (ignored .env won't show in porcelain status)
        status = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True, cwd=cwd).stdout.strip()
        if status:
            print('RESULT_FAIL: Working tree has uncommitted changes.')
            sys.exit(0)

        # Check git log length is 2
        log = subprocess.run(['git', 'log', '--oneline'], capture_output=True, text=True, cwd=cwd).stdout.strip().splitlines()
        if len(log) != 2:
            print(f'RESULT_FAIL: Expected 2 commits total, found {len(log)}.')
            sys.exit(0)

        # Check HEAD committed .gitignore
        head_show = subprocess.run(['git', 'show', '--name-only', 'HEAD'], capture_output=True, text=True, cwd=cwd).stdout
        if '.gitignore' not in head_show:
            print('RESULT_FAIL: Latest commit does not include .gitignore.')
            sys.exit(0)

        print('GITIGNORE_OK')
        "
      match_type: exact
      expected_output: GITIGNORE_OK
    error_message: >-
      The ignore rule or commit state is incorrect. Check your repository status.

  - id: force-push-remote
    summary: Update the remote
    prompt: >-
      Update `origin/main` to match your cleaned local history.
    type: terminal_action
    solution:
      command: "cd /home/student/api-service && git push --force origin main"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        cwd = '/home/student/api-service'

        # Check local HEAD
        head = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True, cwd=cwd).stdout.strip()
        remote_out = subprocess.run(['git', 'ls-remote', 'origin', 'refs/heads/main'], capture_output=True, text=True, cwd=cwd).stdout.split()
        remote_sha = remote_out[0] if remote_out else ''

        if not head or remote_sha != head:
            print('RESULT_FAIL: Remote main does not match local HEAD. The remote branch must be updated to match local history.')
            sys.exit(0)

        # Verify remote tracking branch or log does not have the secret commit message
        log = subprocess.run(['git', 'log', '--oneline'], capture_output=True, text=True, cwd=cwd).stdout
        if 'Add production database credentials' in log:
            print('RESULT_FAIL: Bad commit still present in local history.')
            sys.exit(0)

        print('FORCE_PUSH_OK')
        "
      match_type: exact
      expected_output: FORCE_PUSH_OK
    error_message: >-
      The remote branch does not match your local history.
