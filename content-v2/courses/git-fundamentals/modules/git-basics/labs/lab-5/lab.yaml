id: lab-5
title: "Keeping Unwanted Files Out with .gitignore"
difficulty: beginner
estimated_time: 20
tags:
  - git
  - gitignore
  - fundamentals
environment: git-fundamentals
summary: >
  Practice the introductory .gitignore workflow: observe untracked files,
  create ignore rules, verify ignored status, and commit the rules.

objectives:
  - Create a .gitignore that prevents secrets and build artifacts from being staged
  - Understand the difference between untracked and ignored files
  - Commit .gitignore and push the clean repository to the remote server

setup:
  - command: >
      mkdir -p /home/student/webapp && cd /home/student/webapp &&
      git init -b main &&
      git config user.email "student@labops.local" &&
      git config user.name "Student" &&
      echo "def main(): pass" > app.py &&
      git add app.py &&
      git commit -m "Initial app" &&
      git remote add origin http://git-server:3000/student/webapp-secrets.git &&
      git push -u --force origin main &&
      echo "DB_PASSWORD=supersecret123" > .env &&
      echo "token=ghp_realtoken" > .env.local &&
      mkdir -p __pycache__ &&
      echo "bytecode" > __pycache__/app.cpython-311.pyc &&
      echo "bytecode" > app.pyc

completion:
  required_tasks: all

tasks:
  - id: observe-untracked
    summary: Explore the project directory
    prompt: >-
      You just set up a web service in `/home/student/webapp`. Before staging your next commit, explore the current state of the workspace.

      What is the primary risk of running a blanket `git add .` command in this repository right now?
    type: multiple_choice
    options:
      - "Git will reject the operation because binary bytecode cannot be staged alongside Python source files."
      - "Secret credentials and compiled runtime artifacts will be permanently committed into repository history."
      - "The configuration files will be staged, but `__pycache__` will be excluded automatically by Git's default filters."
      - "Git will prompt for an interactive confirmation before staging any file beginning with a dot."
    validation:
      expected_answer: "Secret credentials and compiled runtime artifacts will be permanently committed into repository history."
    hints:
      - "Inspect the workspace files and repository status to see what is currently uncommitted."
      - "Consider how Git handles newly created files when no ignore rules are defined."
    error_message: >-
      Inspect the files in the workspace. Git treats untracked secrets and generated bytecode just like regular source code until a .gitignore rule is added.

  - id: create-gitignore
    summary: Create a .gitignore that covers secrets and Python build artifacts
    prompt: >-
      Based on what you found in the previous task, create a `.gitignore` in the project that keeps those files out of normal Git staging.
      Just create the file, dont stage it.
    type: terminal_action
    hints:
      - "Create or open `.gitignore` in the repository root and add one ignore pattern per line."
      - "After creating it, git status should show .gitignore as the only new file"
    solution:
      command: |-
        cd /home/student/webapp && cat > .gitignore <<'EOF'
        .env
        .env.*
        *.pyc
        __pycache__/
        EOF
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/webapp')

        if not os.path.exists('.gitignore'):
            print('RESULT_FAIL: .gitignore not found')
            sys.exit(1)

        content = open('.gitignore').read()
        for pattern in ['.env', '*.pyc', '__pycache__']:
            if pattern not in content:
                print(f'RESULT_FAIL: .gitignore missing pattern: {pattern}')
                sys.exit(1)

        # .env should no longer appear as untracked
        status = subprocess.run(['git', 'status'], capture_output=True, text=True).stdout
        if '.env' in status and 'Untracked' in status:
            # check if .env appears in untracked section
            lines = status.split('\n')
            in_untracked = False
            for line in lines:
                if 'Untracked files' in line:
                    in_untracked = True
                if in_untracked and '.env' in line and '.gitignore' not in line:
                    print('RESULT_FAIL: .env still appearing as untracked — check .gitignore patterns')
                    sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      Create .gitignore with patterns for .env, .env.*, *.pyc, and `__pycache__/`.
      After creating it, git status should show only .gitignore as a new file.

  - id: publish-gitignore
    summary: Commit and synchronize the ignore rules
    prompt: >-
      Your `.gitignore` is now configured and the unwanted files are being ignored.
      Commit the file to the repository and push your changes. When finished, the working tree should be clean and the remote
      `main` branch should contain your latest commit.
    type: terminal_action
    hints:
      - "Check `git status` to see what still needs to be committed."
      - "You need to stage and commit `.gitignore` before synchronizing with the remote."
      - "Check `git status` again after pushing to verify that the working tree is clean."
    solution:
      command: "cd /home/student/webapp && git add .gitignore && git commit -m 'Add .gitignore to ignore secrets and build artifacts' && git push origin main"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/webapp')

        # Check that .gitignore is included in the latest commit
        committed_files = subprocess.run(
          ['git', 'show', '--name-only', '--format=', 'HEAD'],
          capture_output=True, text=True
        ).stdout.splitlines()
        if '.gitignore' not in committed_files:
          print('RESULT_FAIL: .gitignore is not included in the latest commit')
          sys.exit(1)

        # Check if working tree is clean
        status = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True).stdout
        if status.strip():
            print('RESULT_FAIL: working tree not clean after commit and push')
            sys.exit(1)

        # Check if remote has the latest commit
        remote_log = subprocess.run(['git', 'ls-remote', 'origin', 'main'], capture_output=True, text=True).stdout
        local_commit = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True).stdout.strip()
        remote_commit = remote_log.split()[0] if remote_log else ''
        if local_commit != remote_commit:
            print('RESULT_FAIL: remote main branch does not have the latest commit')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      Commit .gitignore and push to the remote. After pushing, the working tree should be clean and the remote main branch should contain your latest commit.