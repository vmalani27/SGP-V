id: lab-4
title: "Building Clean Commits with git add -p"
difficulty: beginner
estimated_time: 20
xp: 70
tags:
  - git
  - staging
  - fundamentals
environment: git-fundamentals
summary: >
  Practice selectively staging modifications within a single file to build
  clean, atomic commits using interactive staging.

objectives:
  - Use git add -p to stage individual hunks within a file
  - Verify staged content with git diff --staged before committing
  - Produce separate atomic commits from distinct changes in a single file
  - Push atomic commits to the remote tracking branch

setup:
  - command: >
      curl -s -X DELETE -u student:password123 http://git-server:3000/api/v1/repos/student/order-service || true &&
      rm -rf /home/student/order-service &&
      mkdir -p /home/student/order-service && cd /home/student/order-service &&
      git init -b main &&
      git config user.email "student@labops.local" &&
      git config user.name "Student" &&
      printf 'def validate_order(item_id, quantity):\n    # Ensure item quantity is valid before processing inventory check\n    if quantity == 0:\n        return False\n    if not item_id or len(item_id) < 3:\n        return False\n    return check_inventory(item_id, quantity)\n\n\ndef calculate_discount(customer, subtotal):\n    # Apply promotional VIP discount rate to qualified accounts\n    disc = 0.0\n    if customer.get("is_vip"):\n        disc = subtotal * 0.10\n    if subtotal > 100.0:\n        disc += 5.0\n    return disc\n\n\ndef log_audit_trail(order_id, status):\n    # Internal audit logging for order state tracking\n    timestamp = get_current_timestamp()\n    record_audit_event(order_id, status, timestamp)\n    return True\n\n\ndef format_receipt(customer_id, total):\n    # Generate customer-facing summary receipt string\n    header = "=== ORDER RECEIPT ==="\n    summary = f"Customer #{customer_id}: Total ${total:.2f}"\n    footer = "Thank you for your purchase!"\n    return f"{header}\\n{summary}\\n{footer}"\n' > orders.py &&
      git add orders.py &&
      git commit -m "Initial order service module" &&
      git remote add origin http://git-server:3000/student/order-service.git &&
      git push -u --force origin main &&
      printf 'def validate_order(item_id, quantity):\n    # Ensure item quantity is valid before processing inventory check\n    if quantity <= 0:\n        return False\n    if not item_id or len(item_id) < 3:\n        return False\n    return check_inventory(item_id, quantity)\n\n\ndef calculate_discount(customer, subtotal):\n    # Apply promotional VIP discount rate to qualified accounts\n    discount_amount = 0.0\n    if customer.get("is_vip"):\n        discount_amount = subtotal * 0.10\n    if subtotal > 100.0:\n        discount_amount += 5.0\n    return discount_amount\n\n\ndef log_audit_trail(order_id, status):\n    # Internal audit logging for order state tracking\n    timestamp = get_current_timestamp()\n    record_audit_event(order_id, status, timestamp)\n    return True\n\n\ndef format_receipt(customer_id, total):\n    # Generate customer-facing summary receipt string\n    header = "=== ORDER RECEIPT ==="\n    summary = f"Customer #{customer_id}: Total ${total:.2f} USD"\n    footer = "Thank you for your purchase!"\n    return f"{header}\\n{summary}\\n{footer}"\n' > orders.py

completion:
  required_tasks: all

tasks:
  - id: inspect-changes
    summary: Explore the changes in orders.py
    prompt: >-
      You are reviewing the active work in `/home/student/order-service`. Look around the repository and examine the modifications made to `orders.py`.

      Which of the following accurately describes the uncommitted modifications in `orders.py`?
    type: multiple_choice
    options:
      - "Changes touch three separate functions (`validate_order`, `calculate_discount`, and `format_receipt`) with independent purposes."
      - "Changes only modify `validate_order` and its call sites in `calculate_discount` to pass updated arguments."
      - "Changes introduce new debug logging to `log_audit_trail` while refactoring exception handling in `validate_order`."
      - "Changes update string formatting and type annotations across all four functions without modifying runtime logic."
    validation:
      expected_answer: "Changes touch three separate functions (`validate_order`, `calculate_discount`, and `format_receipt`) with independent purposes."
    hints:
      - "Inspect the unstaged diff in orders.py to see which functions were edited and what changed."
      - "Review which functions contain added or removed lines versus those that remain untouched."
    error_message: >-
      Inspect the diff in orders.py. Notice that the modifications touch validate_order, calculate_discount, and format_receipt, while log_audit_trail is unchanged.

  - id: stage-first-hunk
    summary: Stage only the quantity validation fix hunk
    prompt: >-
      Use interactive patch staging to stage ONLY the bug fix in `validate_order`
      (the change from quantity == 0 to quantity <= 0).

      Skip the other two hunks so that they remain unstaged in your working directory.

      Verify that only the validation fix is staged before moving forward.
    type: terminal_action
    hints:
      - "Invoke interactive patch staging on orders.py to review individual hunks."
      - "Accept the hunk corresponding to the quantity validation fix, and skip the remaining hunks."
      - "Check your staged differences to confirm only the first change is staged."
    solution:
      command: "cd /home/student/order-service && git add -p orders.py"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/order-service')

        staged = subprocess.run(['git', 'diff', '--staged', 'orders.py'], capture_output=True, text=True).stdout

        # The validation fix should be staged
        if 'quantity <= 0' not in staged:
            print('RESULT_FAIL: validation fix hunk not found in staged changes')
            sys.exit(1)

        # The other two hunks should NOT be staged
        if 'discount_amount' in staged or 'USD' in staged:
            print('RESULT_FAIL: other hunks should not be staged yet')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      Only the quantity validation fix hunk should be staged. The other modifications must remain unstaged in your working directory. Inspect your staged changes and adjust.

  - id: commit-first-hunk
    summary: Commit the staged validation fix
    prompt: >-
      Record the staged change with a commit message that clearly describes what
      the validation fix does.

    type: terminal_action
    hints:
      - "Record a new commit with a message explaining the validation bug fix."
    solution:
      command: "cd /home/student/order-service && git commit -m 'Reject non-positive quantities in validate_order'"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/order-service')

        log = subprocess.run(['git', 'log', '--oneline'], capture_output=True, text=True).stdout
        lines = [l for l in log.strip().splitlines() if l.strip()]
        if len(lines) < 2:
            print('RESULT_FAIL: expected 2 commits after committing the first hunk')
            sys.exit(1)

        # The other two hunks should still be unstaged
        unstaged = subprocess.run(['git', 'diff', 'orders.py'], capture_output=True, text=True).stdout
        if 'discount_amount' not in unstaged or 'USD' not in unstaged:
            print('RESULT_FAIL: remaining hunks should still be unstaged')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      The staged hunk has not been committed, or other changes were prematurely recorded. Check your commit log and working tree status.

  - id: stage-and-commit-second-hunk
    summary: Stage and commit the discount variable rename
    prompt: >-
      1. Stage the discount variable rename refactor in
      `calculate_discount` discount function

      2. Commit the refactor with its own descriptive message.
    type: terminal_action
    hints:
      - "Use interactive patch staging again to select the discount refactor hunk."
      - "Skip the receipt formatting modification so it remains unstaged."
      - "Commit the staged refactor with a message describing the variable rename."
    solution:
      command: "cd /home/student/order-service && git add -p orders.py && git commit -m 'Rename disc to discount_amount for clarity'"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/order-service')

        log = subprocess.run(['git', 'log', '--oneline'], capture_output=True, text=True).stdout
        lines = [l for l in log.strip().splitlines() if l.strip()]
        if len(lines) < 3:
            print('RESULT_FAIL: expected 3 commits after committing the second hunk')
            sys.exit(1)

        # discount_amount should be committed in HEAD
        head_commit = subprocess.run(['git', 'show', 'HEAD:orders.py'], capture_output=True, text=True).stdout
        if 'discount_amount' not in head_commit:
            print('RESULT_FAIL: discount refactor was not committed in HEAD')
            sys.exit(1)

        # The receipt formatting should still be unstaged
        unstaged = subprocess.run(['git', 'diff', 'orders.py'], capture_output=True, text=True).stdout
        if 'USD' not in unstaged:
            print('RESULT_FAIL: receipt formatting change should still be unstaged')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      The discount refactor has not been committed as its own snapshot, or the receipt formatting change was prematurely staged. Check your commit history and working tree status.

  - id: commit-third-hunk
    summary: Stage and commit the receipt formatting change
    prompt: >-
      Stage the final remaining change in `orders.py` (the receipt formatting update) and
      commit it with a clear, descriptive message.

      After this commit, your repository should show 4 total commits and a completely clean working directory.
    type: terminal_action
    hints:
      - "Stage the remaining modification in orders.py."
      - "Commit it with a message describing the currency formatting update."
      - "Confirm your working tree has no remaining uncommitted changes."
    solution:
      command: "cd /home/student/order-service && git add orders.py && git commit -m 'Include currency unit USD in receipt summary'"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/order-service')

        log = subprocess.run(['git', 'log', '--oneline'], capture_output=True, text=True).stdout
        lines = [l for l in log.strip().splitlines() if l.strip()]
        if len(lines) < 4:
            print('RESULT_FAIL: expected 4 commits total')
            sys.exit(1)

        diff = subprocess.run(['git', 'diff', 'orders.py'], capture_output=True, text=True).stdout
        if diff.strip():
            print('RESULT_FAIL: orders.py still has unstaged changes')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      The remaining receipt formatting change in orders.py has not been committed, or uncommitted modifications still exist. Verify that 4 total commits exist and your working tree is clean.

  - id: publish-hunk-commits
    summary: Push your atomic commits to the remote tracking branch
    prompt: >-
      Your working tree in `/home/student/order-service` is clean, and your local
      `main` branch has three clean atomic commits ahead of `origin/main`.

      Publish your commits to the remote tracking branch.
    type: terminal_action
    hints:
      - "Synchronize your local branch with its remote tracking branch."
      - "Ensure the remote repository receives all new atomic commits."
    solution:
      command: "cd /home/student/order-service && git push"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        cwd = '/home/student/order-service'

        status = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True, cwd=cwd).stdout
        if status.strip():
            print('RESULT_FAIL: Working tree has uncommitted modifications.')
            sys.exit(0)

        head = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True, cwd=cwd).stdout.strip()
        remote_head = subprocess.run(['git', 'ls-remote', 'origin', 'refs/heads/main'], capture_output=True, text=True, cwd=cwd).stdout.split()
        remote_sha = remote_head[0] if remote_head else ''

        if not head or remote_sha != head:
            print('RESULT_FAIL: Remote main does not match local HEAD.')
            sys.exit(0)

        log = subprocess.run(['git', 'log', '--oneline'], capture_output=True, text=True, cwd=cwd).stdout.strip().splitlines()
        if len(log) < 4:
            print('RESULT_FAIL: Expected 4 commits in history.')
            sys.exit(0)

        print('PUSH_OK')
        "
      match_type: exact
      expected_output: PUSH_OK
    error_message: >-
      The remote tracking branch has not received your commits. Verify that your working tree is clean and that local HEAD is synchronized with origin/main.
