id: lab-1
title: Setting Up Git
difficulty: beginner
estimated_time: 10
tags:
  - git
  - fundamentals
environment: git-fundamentals
summary: >-
  Configure your global Git author identity and default branch name, then
  initialize a repository to verify the configuration.

objectives:
  - Set your global Git username
  - Set your global Git email
  - Change default branch name to 'main'
  - Create a test repo to confirm settings

setup:
  - command: >-
      git config --system init.defaultBranch master &&
      (git config --file /home/student/.gitconfig --unset-all user.name || true) &&
      (git config --file /home/student/.gitconfig --unset-all user.email || true) &&
      (git config --file /home/student/.gitconfig --unset-all init.defaultBranch || true) &&
      rm -rf /home/student/workspace/verification-project &&
      chown student:student /home/student/.gitconfig

tasks:
  - id: set-global-username
    summary: Set your global Git username
    prompt: >-
      Configure your global Git username as `Alex Chen`.
    type: terminal_action
    solution:
      command: git config --global user.name "Alex Chen"
    validation:
      command: git config --global user.name
      match_type: exact
      expected_output: "Alex Chen"
    error_message: >-
      Global `user.name` is not set to `Alex Chen`.

  - id: set-global-email
    summary: Set your global Git email
    prompt: >-
      Configure your global Git email address as `alex.chen@engineering.local`.
    type: terminal_action
    solution:
      command: git config --global user.email "alex.chen@engineering.local"
    validation:
      command: git config --global user.email
      match_type: exact
      expected_output: "alex.chen@engineering.local"
    error_message: >-
      Global `user.email` is not set to `alex.chen@engineering.local`.

  - id: change-default-branch
    summary: Change your default branch to 'main'
    prompt: >-
      Configure Git globally so newly initialized repositories use `main` as their
      default initial branch name.
    type: terminal_action
    solution:
      command: git config --global init.defaultBranch main
    validation:
      command: git config --global init.defaultBranch
      match_type: exact
      expected_output: "main"
    error_message: >-
      Global `init.defaultBranch` is not set to `main`.

  - id: create-test-repo
    summary: Create a test repo to confirm settings
    prompt: >-
      Create the directory `~/workspace/verification-project` and initialize a
      Git repository inside it.
    type: terminal_action
    solution:
      command: mkdir -p ~/workspace/verification-project && cd ~/workspace/verification-project && git init
    validation:
      command: >-
        test -d ~/workspace/verification-project/.git && grep -q 'refs/heads/main' ~/workspace/verification-project/.git/HEAD && echo READY
      match_type: exact
      expected_output: "READY"
    error_message: >-
      No Git repository initialized on branch `main` was found at `~/workspace/verification-project`.

completion:
  required_tasks: all
