id: lab-2
title: Initializing a Repository and Publishing Your First Commits
difficulty: beginner
estimated_time: 20
tags:
  - git
  - fundamentals
environment: git-fundamentals
summary: >
  Initialize a Git repo, make commits, test `git restore` command usage, and push to remote.
objectives:
  - Initialize a Git repository
  - Create files and commit them with clear messages
  - Use git restore to recover from an accidental change
  - Connect the repository to a remote and push the main branch

setup:
  - command: >-
      curl -s -X DELETE -u student:password123 http://git-server:3000/api/v1/repos/student/my-project || true

tasks:
  - id: init-repo
    summary: Initialize a new Git repository at ~/workspace/my-project.
    prompt: >-
      Create the directory `~/workspace/my-project` and initialize a Git repository inside it.
      This is where your next commits will live.
    type: terminal_action
    hints:
      - "Verify that you have created the directory at the exact path requested."
      - "Initialize Git tracking inside that directory."
    solution:
      command: >-
        mkdir -p ~/workspace/my-project &&
        cd ~/workspace/my-project &&
        git init
    validation:
      command: >-
        test -d ~/workspace/my-project/.git && echo REPO_READY
      match_type: exact
      expected_output: REPO_READY
    error_message: >-
      No Git repository was found at ~/workspace/my-project. Make sure the repository
      has been initialized correctly.

  - id: first-commit
    summary: Create a file and make your first commit.
    prompt: >-
      Inside `~/workspace/my-project`, create a file named `README.md` with any content.
      Stage it and commit it with a meaningful message (not 'update', 'fix', or 'WIP').
    type: terminal_action
    hints:
      - "Make sure README.md is staged before creating the snapshot."
      - "Use a commit message that clearly explains what was added."
    solution:
      command: >-
        cd ~/workspace/my-project &&
        git add README.md &&
        git commit -m "Initialize project with README"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        result = subprocess.run(
            ['git', 'log', '--oneline'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        if result.returncode != 0:
            print('Not a git repo or no commits.')
            sys.exit(0)

        log = result.stdout.decode().strip()
        if not log:
            print('No commits found.')
            sys.exit(0)

        # Reject empty or vague messages
        msg = log.split(' ', 1)[1].lower() if ' ' in log else ''
        vague = {'update', 'fix', 'wip', 'commit', 'changes', 'stuff', 'test'}
        if msg.strip() in vague or len(msg.strip()) < 5:
            print('Commit message is too vague. Write something meaningful.')
            sys.exit(0)

        # Check README.md exists and was committed
        check = subprocess.run(
            ['git', 'show', 'HEAD:README.md'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        if check.returncode != 0:
            print('README.md was not committed.')
            sys.exit(0)

        print('FIRST_COMMIT_OK')
        "
      match_type: exact
      expected_output: FIRST_COMMIT_OK
    error_message: >-
      The required file has not been committed correctly, or the commit message
      does not meet the requirements. Inspect your repository history and commit state.

  - id: second-commit
    summary: Create a second commit and inspect the log.
    prompt: >-
      Add a second file named `notes.md` to `~/workspace/my-project` with any content.
      Stage and commit it with a different, meaningful message.

      Then inspect your commit log to confirm both commits appear.
    type: terminal_action
    hints:
      - "Stage the new file before creating your second commit."
      - "Inspect your commit log to confirm at least two distinct snapshots exist."
    solution:
      command: >-
        cd ~/workspace/my-project &&
        git add notes.md &&
        git commit -m "Add project notes documentation"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        result = subprocess.run(
            ['git', 'log', '--oneline'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        log = result.stdout.decode().strip().splitlines()
        if len(log) < 2:
            print(f'Expected at least 2 commits, found {len(log)}.')
            sys.exit(0)

        check = subprocess.run(
            ['git', 'show', 'HEAD:notes.md'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        if check.returncode != 0:
            print('notes.md was not committed.')
            sys.exit(0)

        print('TWO_COMMITS_OK')
        "
      match_type: exact
      expected_output: TWO_COMMITS_OK
      record:
        key: corrupt_readme
        command: |-
          python3 -c "import os; open(os.path.expanduser('~/.labops_readme_corrupted'), 'w').write('1'); open(os.path.expanduser('~/workspace/my-project/README.md'), 'w').write('CRITICAL: Runaway background script accidentally overwrote this file!\n')"
    on_complete:
      - command: |-
          python3 -c "import os; open(os.path.expanduser('~/.labops_readme_corrupted'), 'w').write('1'); open(os.path.expanduser('~/workspace/my-project/README.md'), 'w').write('CRITICAL: Runaway background script accidentally overwrote this file!\n')"
        user: student
    error_message: >-
      The repository does not contain the required second commit. Check your commit
      history and verify that the second file was committed.

  - id: restore-accidental-change
    summary: Recover a corrupted file.
    prompt: >-
      An automated process accidentally modified `README.md` in your repository.

      Inspect the repository and identify the unwanted working-tree change.
      Recover the committed version of `README.md` without creating another commit.
      Verify that the unwanted modification is gone.
    type: terminal_action
    hints:
      - "First inspect the repository's current status and working tree differences."
      - "Think about which Git command discards unstaged changes in the working tree."
      - "Verify that working tree changes are gone and the committed version is restored."
    solution:
      command: >-
        cd ~/workspace/my-project &&
        git restore README.md
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        cwd = os.path.expanduser('~/workspace/my-project')
        readme = os.path.join(cwd, 'README.md')
        marker = os.path.expanduser('~/.labops_readme_corrupted')

        # Check working tree for modified README.md
        result = subprocess.run(
            ['git', 'diff', '--name-only'],
            capture_output=True, text=True, cwd=cwd
        )
        modified = result.stdout.strip()

        # If README.md still has unstaged changes, user hasn't restored it yet
        if 'README.md' in modified:
            print('README.md still contains an unexpected working-tree modification.')
            sys.exit(0)

        # Fallback check: if README was never corrupted (e.g. user jumped straight to task 4),
        # corrupt it now so the incident trigger happens and the user must restore!
        if not os.path.exists(marker):
            with open(marker, 'w') as mf:
                mf.write('1\n')
            with open(readme, 'w') as rf:
                rf.write('CRITICAL: Runaway background script accidentally overwrote this file!\n')
            print('INCIDENT_TRIGGERED: README.md was just modified by an automated process! Inspect the change and restore the committed version.')
            sys.exit(0)

        # Check README.md has content in HEAD
        check = subprocess.run(
            ['git', 'show', 'HEAD:README.md'],
            capture_output=True, text=True, cwd=cwd
        )
        if not check.stdout.strip():
            print('README.md in HEAD is empty — something went wrong.')
            sys.exit(0)

        print('RESTORE_OK')
        "
      match_type: exact
      expected_output: RESTORE_OK
    error_message: >-
      README.md still contains an unexpected working-tree modification. Inspect the
      repository state and restore the committed version of the file.

  - id: publish-to-remote
    summary: Connect the repository to LabOps Git and push main.
    prompt: >-
      Your local history is ready to share with the team. From
      `~/workspace/my-project`, configure `http://git-server:3000/student/my-project.git`
      as the remote named `origin`, then publish the local `main` branch with upstream
      tracking enabled.
    type: terminal_action
    hints:
      - "Check your configured remotes to verify origin points to the target URL."
      - "Ensure you are pushing the main branch and setting it to track upstream."
      - "Verify the remote repository state after publishing."
    solution:
      command: >-
        cd ~/workspace/my-project &&
        git remote add origin http://git-server:3000/student/my-project.git &&
        git push -u origin main
    validation:
      command: |-
        python3 -c "
        import os
        import subprocess
        import sys

        cwd = os.path.expanduser('~/workspace/my-project')
        expected_url = 'http://git-server:3000/student/my-project.git'

        remote = subprocess.run(
            ['git', 'remote', 'get-url', 'origin'],
            capture_output=True, text=True, cwd=cwd
        )
        if remote.returncode != 0 or remote.stdout.strip() != expected_url:
            print('Remote origin is not configured with the LabOps project URL.')
            sys.exit(0)

        branch = subprocess.run(
            ['git', 'branch', '--show-current'],
            capture_output=True, text=True, cwd=cwd
        )
        if branch.stdout.strip() != 'main':
            print('The repository is not on the main branch.')
            sys.exit(0)

        head = subprocess.run(
            ['git', 'rev-parse', 'HEAD'],
            capture_output=True, text=True, cwd=cwd
        )
        remote_head = subprocess.run(
            ['git', 'ls-remote', 'origin', 'refs/heads/main'],
            capture_output=True, text=True, cwd=cwd
        )
        if head.returncode != 0 or remote_head.returncode != 0:
            print('Could not read the local or remote main branch.')
            sys.exit(0)

        remote_sha = remote_head.stdout.split()[0] if remote_head.stdout.split() else ''
        if remote_sha != head.stdout.strip():
            print('The remote main branch does not match your local HEAD.')
            sys.exit(0)

        upstream = subprocess.run(
            ['git', 'rev-parse', '--abbrev-ref', '--symbolic-full-name', '@{u}'],
            capture_output=True, text=True, cwd=cwd
        )
        if upstream.returncode != 0 or upstream.stdout.strip() != 'origin/main':
            print('main is not configured to track origin/main upstream.')
            sys.exit(0)

        print('PUSHED_TO_REMOTE_OK')
        "
      match_type: exact
      expected_output: PUSHED_TO_REMOTE_OK
    error_message: >-
      The repository has not been published to the expected remote state. Check the
      repository's remote configuration, current branch, and remote history.

completion:
  required_tasks: all
