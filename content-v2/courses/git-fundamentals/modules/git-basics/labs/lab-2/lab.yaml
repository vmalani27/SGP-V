id: lab-2
title: Initializing a Repository and Publishing Your First Commits
difficulty: beginner
estimated_time: 20
xp: 70
tags:
  - git
  - fundamentals
environment: git-fundamentals
summary: >
  Initialize a Git repo, make commits, test `git restore` command usage, and push to remote.
objectives:
  - Initialize a Git repository
  - Create files and commit them with clear messages
  - Use git restore to recover from an accidental change
  - Connect the repository to a remote and push the main branch

setup:
  - command: >-
      curl -s -X DELETE -u student:password123 http://git-server:3000/api/v1/repos/student/my-project || true

tasks:
  - id: init-repo
    summary: Initialize a new Git repository at ~/workspace/my-project.
    prompt: >-
      Create the directory `~/workspace/my-project` and initialize a Git repository inside it.
      This is where your next commits will live.
    type: terminal_action
    validation:
      command: >-
        test -d ~/workspace/my-project/.git && echo REPO_READY
      match_type: exact
      expected_output: REPO_READY
    error_message: >-
      No Git repository found at ~/workspace/my-project. Run: mkdir -p ~/workspace/my-project && cd ~/workspace/my-project && git init

  - id: first-commit
    summary: Create a file and make your first commit.
    prompt: >-
      Inside `~/workspace/my-project`, create a file named `README.md` with any content.
      Stage it and commit it with a meaningful message (not 'update', 'fix', or 'WIP').
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        result = subprocess.run(
            ['git', 'log', '--oneline'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        if result.returncode != 0:
            print('Not a git repo or no commits.')
            sys.exit(0)

        log = result.stdout.decode().strip()
        if not log:
            print('No commits found.')
            sys.exit(0)

        # Reject empty or vague messages
        msg = log.split(' ', 1)[1].lower() if ' ' in log else ''
        vague = {'update', 'fix', 'wip', 'commit', 'changes', 'stuff', 'test'}
        if msg.strip() in vague or len(msg.strip()) < 5:
            print('Commit message is too vague. Write something meaningful.')
            sys.exit(0)

        # Check README.md exists and was committed
        check = subprocess.run(
            ['git', 'show', 'HEAD:README.md'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        if check.returncode != 0:
            print('README.md was not committed.')
            sys.exit(0)

        print('FIRST_COMMIT_OK')
        "
      match_type: exact
      expected_output: FIRST_COMMIT_OK
    error_message: >-
      Either README.md was not committed, or the commit message is too vague. Write a message that explains what the file is.

  - id: second-commit
    summary: Create a second commit and inspect the log.
    prompt: >-
      Add a second file named `notes.md` to `~/workspace/my-project` with any content.
      Stage and commit it with a different, meaningful message.

      Then run `git log --oneline` to confirm both commits appear.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        result = subprocess.run(
            ['git', 'log', '--oneline'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        log = result.stdout.decode().strip().splitlines()
        if len(log) < 2:
            print(f'Expected at least 2 commits, found {len(log)}.')
            sys.exit(0)

        check = subprocess.run(
            ['git', 'show', 'HEAD:notes.md'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        if check.returncode != 0:
            print('notes.md was not committed.')
            sys.exit(0)

        print('TWO_COMMITS_OK')
        "
      match_type: exact
      expected_output: TWO_COMMITS_OK
    error_message: >-
      notes.md was not committed.

  - id: restore-accidental-change
    summary: Break a file and recover it using git restore.
    prompt: >-
      This is the recovery scenario from the chapter.

      In `~/workspace/my-project`, open `README.md` and delete all its content (or overwrite it
      with garbage). Then use `git restore` to undo the change and bring back the committed version.

      Run `git diff` before restoring to see the damage. After restoring, `git diff` should show nothing.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os

        # Check working tree is clean (no unstaged changes to README.md)
        result = subprocess.run(
            ['git', 'diff', '--name-only'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        modified = result.stdout.decode().strip()
        if 'README.md' in modified:
            print('README.md still has uncommitted changes — restore did not work.')
            sys.exit(0)

        # Check README.md has content (not empty)
        check = subprocess.run(
            ['git', 'show', 'HEAD:README.md'],
            capture_output=True, cwd=os.path.expanduser('~/workspace/my-project')
        )
        if not check.stdout.strip():
            print('README.md in HEAD is empty — something went wrong.')
            sys.exit(0)

        print('RESTORE_OK')
        "
      match_type: exact
      expected_output: RESTORE_OK
    error_message: >-
      README.md still shows as modified. Run: git restore README.md — then verify with git diff.

  - id: publish-to-remote
    summary: Connect the repository to LabOps Git and push main.
    prompt: >-
      Your local history is ready to share with the team. From
      `~/workspace/my-project`, add `http://git-server:3000/student/my-project.git`
      as the remote named `origin`, then push the local `main` branch with upstream
      tracking enabled. Verify the remote and branch after pushing.
    type: terminal_action
    hints:
      - "Add the remote with: git remote add origin http://git-server:3000/student/my-project.git"
      - "Publish the branch with: git push -u origin main"
      - "Use git remote -v and git ls-remote origin refs/heads/main to verify the result"
    solution:
      command: >-
        cd ~/workspace/my-project &&
        git remote add origin http://git-server:3000/student/my-project.git &&
        git push -u origin main
    validation:
      command: |-
        python3 -c "
        import os
        import subprocess
        import sys

        cwd = os.path.expanduser('~/workspace/my-project')
        expected_url = 'http://git-server:3000/student/my-project.git'

        remote = subprocess.run(
            ['git', 'remote', 'get-url', 'origin'],
            capture_output=True, text=True, cwd=cwd
        )
        if remote.returncode != 0 or remote.stdout.strip() != expected_url:
            print('Remote origin is not configured with the LabOps project URL.')
            sys.exit(0)

        branch = subprocess.run(
            ['git', 'branch', '--show-current'],
            capture_output=True, text=True, cwd=cwd
        )
        if branch.stdout.strip() != 'main':
            print('The repository is not on the main branch.')
            sys.exit(0)

        head = subprocess.run(
            ['git', 'rev-parse', 'HEAD'],
            capture_output=True, text=True, cwd=cwd
        )
        remote_head = subprocess.run(
            ['git', 'ls-remote', 'origin', 'refs/heads/main'],
            capture_output=True, text=True, cwd=cwd
        )
        if head.returncode != 0 or remote_head.returncode != 0:
            print('Could not read the local or remote main branch.')
            sys.exit(0)

        remote_sha = remote_head.stdout.split()[0] if remote_head.stdout.split() else ''
        if remote_sha != head.stdout.strip():
            print('The remote main branch does not match your local HEAD.')
            sys.exit(0)

        upstream = subprocess.run(
            ['git', 'rev-parse', '--abbrev-ref', '--symbolic-full-name', '@{u}'],
            capture_output=True, text=True, cwd=cwd
        )
        if upstream.returncode != 0 or upstream.stdout.strip() != 'origin/main':
            print('main is not tracking origin/main. Push with: git push -u origin main')
            sys.exit(0)

        print('PUSHED_TO_REMOTE_OK')
        "
      match_type: exact
      expected_output: PUSHED_TO_REMOTE_OK
    error_message: >-
      The repository was not pushed successfully. Check that origin points to
      http://git-server:3000/student/my-project.git, then run git push -u origin main.

completion:
  required_tasks: all
