id: lab-3
title: "Staging Selectively: Clean Commits from a Messy Working Tree"
difficulty: beginner
estimated_time: 20
tags:
  - git
  - staging
  - fundamentals
environment: git-fundamentals
summary: >
  Practice reviewing uncommitted modifications across multiple files, organizing
  them into separate atomic commits, and discarding throwaway changes.

objectives:
  - Stage individual files to create atomic commits
  - Use git status and git diff to understand the working tree state
  - Discard unwanted working tree changes with git restore
  - Push clean commits to the remote tracking branch

setup:
  - command: >
      mkdir -p /home/student/webapp && cd /home/student/webapp &&
      git init -b main &&
      git config user.email "student@labops.local" &&
      git config user.name "Student" &&
      printf 'def authenticate(user, password):\n    if password == "":\n        return False\n    return check_db(user, password)\n' > auth.py &&
      printf 'body { font-family: sans-serif; }\n.button { background: red; color: white; }\n' > styles.css &&
      printf 'import logging\nlogging.basicConfig(level=logging.DEBUG)\n\ndef process_request(req):\n    logging.debug("Request received: %s", req)\n    return handle(req)\n' > api.py &&
      git add auth.py styles.css api.py &&
      git commit -m "Initial application files" &&
      git remote add origin http://git-server:3000/student/webapp.git &&
      git push -u --force origin main &&
      printf 'def authenticate(user, password):\n    if not password:\n        return False\n    return check_db(user, password)\n' > auth.py &&
      printf 'body { font-family: sans-serif; }\n.button { background: #2563eb; color: white; }\n' > styles.css &&
      printf 'import logging\nlogging.basicConfig(level=logging.DEBUG)\n\ndef process_request(req):\n    logging.debug("DEBUG: raw request dump: %s", req)\n    logging.debug("DEBUG: entering process_request")\n    return handle(req)\n' > api.py

completion:
  required_tasks: all

tasks:
  - id: survey-the-damage
    summary: Explore the workspace
    prompt: >-
      You just sat down at your workstation and found unfinished work left behind in `/home/student/webapp`. Look around the repository and examine the changes across each file before deciding how to proceed.

      Looking at the changes across this project, what would happen if someone staged and committed everything right now under a commit titled "Fix login"?
    type: multiple_choice
    options:
      - "Temporary debug logs and CSS changes would be saved together in the same commit as the login fix."
      - "Git would only commit `auth.py` and automatically ignore the changes in `api.py` and `styles.css`."
      - "Git would reject the commit because Python code and CSS styles cannot be saved in the same commit."
      - "Git would erase the changes in `api.py` and `styles.css` because they do not relate to the login fix."
    validation:
      expected_answer: "Temporary debug logs and CSS changes would be saved together in the same commit as the login fix."
    hints:
      - "Check the diff of each changed file in the repository."
      - "Think about what each change does and whether they all belong in one commit."
    error_message: >-
      Check the diffs across all modified files. api.py has temporary debug logs and styles.css has visual changes. Making one big commit mixes all these unrelated changes together.

  - id: commit-auth-fix
    summary: Commit the authentication fix
    prompt: >-
      auth.py has one real fix: the empty password check was changed from
      checking password == "" to using not password, which also catches None.

      Stage only auth.py and commit it with a clear, descriptive message. 
      Leave styles.css
      and api.py as it is
    type: terminal_action
    hints:
      - "Stage only the specific file needed for this logical commit."
      - "Write a commit message that explains what the authentication fix does."
      - "Verify that the other two modified files remain unstaged in your working tree."
    solution:
      command: "cd /home/student/webapp && git add auth.py && git commit -m 'Fix empty-string password check to also reject None'"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/webapp')

        log = subprocess.run(['git', 'log', '--oneline', '-1', '--name-only'], capture_output=True, text=True).stdout
        if 'auth.py' not in log:
            print('RESULT_FAIL: auth.py not in last commit')
            sys.exit(1)

        status = subprocess.run(['git', 'status'], capture_output=True, text=True).stdout
        if 'styles.css' not in status or 'api.py' not in status:
            print('RESULT_FAIL: expected styles.css and api.py to remain unstaged')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      Ensure only auth.py is staged and committed. styles.css and api.py should still show as unstaged modifications.

  - id: commit-css-fix
    summary: commit the css change
    prompt: >-
      styles.css changed the button colour from red to brand blue (#2563eb).
      That is a separate concern from the auth fix and deserves its own commit.

      Stage styles.css and commit it with an appropriate message. api.py should remain unstaged.
    type: terminal_action
    hints:
      - "Stage the stylesheet file independently from the remaining debug modifications."
      - "Describe the visual styling change in your commit message."
      - "Confirm that only api.py is left modified in your working tree."
    solution:
      command: "cd /home/student/webapp && git add styles.css && git commit -m 'Fix button colour from red to brand blue'"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/webapp')

        log = subprocess.run(['git', 'log', '--oneline', '-2', '--name-only'], capture_output=True, text=True).stdout
        if 'styles.css' not in log:
            print('RESULT_FAIL: styles.css not committed yet')
            sys.exit(1)

        status = subprocess.run(['git', 'status'], capture_output=True, text=True).stdout
        if 'api.py' not in status:
            print('RESULT_FAIL: api.py should still be modified')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      styles.css was not committed as a separate snapshot, or api.py was prematurely staged. Check your repository status and commit log.

  - id: discard-debug-changes
    summary: Discard the local debug changes in api.py
    prompt: >-
      api.py has debug log lines added for local testing. They should
      not be committed — debug noise in version history makes it harder to trace
      real changes later.

      Discard the changes in api.py entirely so that the file returns to its cleanly
      committed state from HEAD. After discarding, your working tree should be completely clean.
    type: terminal_action
    hints:
      - "Recall which command discards unstaged working tree changes back to the committed snapshot."
      - "Verify that no unstaged diffs remain for api.py after discarding the changes."
    solution:
      command: "cd /home/student/webapp && git restore api.py"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        os.chdir('/home/student/webapp')

        diff = subprocess.run(['git', 'diff', 'api.py'], capture_output=True, text=True).stdout
        if diff.strip():
            print('RESULT_FAIL: api.py still contains unstaged modifications')
            sys.exit(1)

        print('RESULT_OK')
        "
      match_type: exact
      expected_output: RESULT_OK
    error_message: >-
      api.py still contains unstaged working-tree modifications. Discard the changes and restore the clean committed version.

  - id: read-the-history
    summary: Confirm the commit history tells a clean story
    prompt: >-
      Inspect the commit log inside /home/student/webapp. You should see exactly
      three commits, each describing one logical change.

      Which command shows ONLY the files changed in the most recent commit,
      without showing the full line-level diff?
    type: multiple_choice
    options:
      - "git log --oneline -1 --name-only"
      - "git diff HEAD"
      - "git status --short"
      - "git show --stat"
    validation:
      expected_answer: "git log --oneline -1 --name-only"
    hints:
      - "You want the commit metadata and file list — not the line-level diff."
      - "Look for a log flag that outputs file names rather than the complete diff patch."

  - id: publish-atomic-commits
    summary: Push your clean atomic commits to the remote repository
    prompt: >-
      Your working tree in `/home/student/webapp` is now clean, and your local
      `main` branch has two clean atomic commits ahead of `origin/main`.

      Publish your commits to the remote server.
    type: terminal_action
    hints:
      - "Push your local branch updates to the configured remote repository."
      - "Because main already tracks origin/main, synchronize the remote with a standard push."
    solution:
      command: "cd /home/student/webapp && git push"
    validation:
      command: |-
        python3 -c "
        import subprocess, sys, os
        cwd = '/home/student/webapp'

        # Check clean tree
        status = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True, cwd=cwd).stdout
        if status.strip():
            print('RESULT_FAIL: Working tree has uncommitted modifications.')
            sys.exit(0)

        # Check local HEAD equals remote main
        head = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True, cwd=cwd).stdout.strip()
        remote_head = subprocess.run(['git', 'ls-remote', 'origin', 'refs/heads/main'], capture_output=True, text=True, cwd=cwd).stdout.split()
        remote_sha = remote_head[0] if remote_head else ''

        if not head or remote_sha != head:
            print('RESULT_FAIL: Remote main does not match local HEAD.')
            sys.exit(0)

        # Check commit count
        log = subprocess.run(['git', 'log', '--oneline'], capture_output=True, text=True, cwd=cwd).stdout.strip().splitlines()
        if len(log) < 3:
            print('RESULT_FAIL: Expected at least 3 commits in history.')
            sys.exit(0)

        print('PUSH_OK')
        "
      match_type: exact
      expected_output: PUSH_OK
    error_message: >-
      The remote repository has not received your atomic commits, or your working tree is not clean. Ensure all prior tasks were completed and the commits are published to origin/main.
