id: git-fundamentals
title: Git Fundamentals
description: From your first commit to advanced branching strategies and CI/CD integration.
level: beginner
prerequisites:
  - Basic command-line usage (navigate directories, edit files)
  - A text editor of your choice (or Git's built-in editor)
environment:
  - Ubuntu 22.04 (jammy)
keyTakeaways:
  - Master core Git workflows and repository lifecycle management
  - Handle branching, merging, and merge conflict resolution
  - Manage remote repositories and collaborative pull request workflows
  - Inspect history, undo changes safely, and track repository state
