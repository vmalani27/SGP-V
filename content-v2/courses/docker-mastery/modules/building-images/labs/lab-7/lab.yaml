id: lab-7
title: Build Context and .dockerignore
difficulty: beginner
environment: docker-build

setup:
  - command: "usermod -aG docker student"

objectives:
  - Understand the Docker build context boundary
  - Observe how unignored files reach the container filesystem
  - Configure a .dockerignore to exclude sensitive files
  - Verify build context exclusion at runtime

tasks:
  - id: create-project
    summary: Set up a workspace with an application file and a sensitive secret.
    prompt: >-
      Create a project directory named `~/context-demo`. Inside it, create
      `app.txt` containing `application data` and `secret.txt` containing
      `super secret`.
    type: terminal_action
    validation:
      command: >-
        test -f ~/context-demo/app.txt &&
        grep -qx 'application data' ~/context-demo/app.txt &&
        test -f ~/context-demo/secret.txt &&
        grep -qx 'super secret' ~/context-demo/secret.txt && echo PROJECT_OK
      match_type: exact
      expected_output: PROJECT_OK
    error_message: >-
      The context demo project is missing one or more required files or their
      contents do not match the project specification.

  - id: write-dockerfile
    summary: Define a Dockerfile that ingests the entire build context.
    prompt: >-
      In `~/context-demo`, create a `Dockerfile` using `alpine:latest`. Set the
      working directory to `/app`, copy the entire build context into it, and
      set the default command to list the contents of `/app`.
    type: terminal_action
    validation:
      command: >-
        test -f ~/context-demo/Dockerfile &&
        grep -qE '^FROM +alpine(:latest)?$' ~/context-demo/Dockerfile &&
        grep -q 'WORKDIR /app' ~/context-demo/Dockerfile &&
        grep -q 'COPY \. \.' ~/context-demo/Dockerfile &&
        grep -q 'CMD' ~/context-demo/Dockerfile && echo DOCKERFILE_OK
      match_type: exact
      expected_output: DOCKERFILE_OK
    error_message: >-
      The Dockerfile does not define the required base image, working directory,
      build-context copy behavior, or startup listing.

  - id: build-included
    summary: Build and run the image to observe default context ingestion.
    prompt: >-
      Build the image from `~/context-demo` with the tag `context-demo`. Run a
      container from it to confirm that BOTH `app.txt` and `secret.txt` are
      present inside the image.
    type: terminal_action
    validation:
      command: >-
        docker image inspect context-demo >/dev/null 2>&1 &&
        docker run --rm context-demo 2>/dev/null | grep -qx 'app.txt' &&
        docker run --rm context-demo 2>/dev/null | grep -qx 'secret.txt' &&
        echo BOTH_INCLUDED
      match_type: exact
      expected_output: BOTH_INCLUDED
    error_message: >-
      The built image is unavailable or does not contain both project files in its
      runtime listing.

  - id: add-dockerignore
    summary: Configure context exclusion rules.
    prompt: >-
      Create a `.dockerignore` file in `~/context-demo` that excludes
      `secret.txt` from being sent to the Docker daemon during build.
    type: terminal_action
    validation:
      command: >-
        test -f ~/context-demo/.dockerignore &&
        grep -qx 'secret.txt' ~/context-demo/.dockerignore && echo IGNORE_OK
      match_type: exact
      expected_output: IGNORE_OK
    error_message: >-
      The build-context ignore rules do not exclude the sensitive project file.

  - id: rebuild-and-verify
    summary: Rebuild the image and verify that the excluded file is absent.
    prompt: >-
      Rebuild the `context-demo` image using the same tag. Run the container to
      verify that `app.txt` is present while `secret.txt` is completely absent.
    type: terminal_action
    validation:
      command: >-
        docker run --rm context-demo 2>/dev/null | grep -qx 'app.txt' &&
        ! docker run --rm context-demo 2>/dev/null | grep -qx 'secret.txt' &&
        echo EXCLUDED_OK
      match_type: exact
      expected_output: EXCLUDED_OK
    error_message: >-
      The rebuilt image still contains the file that should have been excluded, or
      the required application file is no longer present.

  - id: outside-context
    summary: Conceptual checkpoint on build context boundaries.
    prompt: >-
      Suppose you attempted to run `COPY ../sibling-dir/config.json .` from
      inside your Dockerfile. Why would the Docker daemon reject this?
    type: multiple_choice
    options:
      - "COPY can only access files within the build context directory passed to docker build"
      - "COPY instructions cannot reference JSON configuration files"
      - "Docker disallows all relative parent directory operators (`..`) across all directives"
    validation:
      expected_answer: "COPY can only access files within the build context directory passed to docker build"
    error_message: >-
      The selected explanation does not identify the build context as the boundary
      that controls which host files Docker can access.