id: lab-6
title: Dockerfile Fundamentals
difficulty: beginner
environment: docker-build

setup:
  - command: "usermod -aG docker student"

objectives:
  - Write a Dockerfile using FROM, WORKDIR, COPY, RUN, CMD, and EXPOSE
  - Build an image and run a container from it
  - Verify that a RUN instruction took effect during the build
  - Verify the documented EXPOSE port on the image

tasks:
  - id: create-script
    prompt: >-
      Create a project directory named `greeter` in your home directory. Inside
      it, create an executable shell script `greet.sh` that prints the text
      `hello from the image` when it runs. The script must begin with the line
      `#!/bin/sh` and be marked executable.
    type: terminal_action
    validation:
      command: >-
        test -f ~/greeter/greet.sh &&
        head -1 ~/greeter/greet.sh | grep -qx '#!/bin/sh' &&
        grep -q 'hello from the image' ~/greeter/greet.sh &&
        test -x ~/greeter/greet.sh && echo SCRIPT_OK
      match_type: exact
      expected_output: SCRIPT_OK
    error_message: >-
      The greeting script is missing, has an invalid interpreter or output, or is
      not executable.

  - id: write-dockerfile
    prompt: >-
      In `~/greeter`, write a `Dockerfile` that starts from `alpine:latest`,
      sets the working directory to `/app`, copies `greet.sh` into the image,
      makes it executable, documents port `8080`, and runs the script when a
      container starts.
    type: terminal_action
    validation:
      command: >-
        test -f ~/greeter/Dockerfile &&
        grep -qE '^FROM +alpine(:latest)?$' ~/greeter/Dockerfile &&
        grep -q 'WORKDIR /app' ~/greeter/Dockerfile &&
        grep -qE 'COPY.*greet\.sh' ~/greeter/Dockerfile &&        
        grep -q 'RUN' ~/greeter/Dockerfile &&
        grep -q 'EXPOSE' ~/greeter/Dockerfile &&
        grep -q 'CMD' ~/greeter/Dockerfile && echo DOCKERFILE_OK
      match_type: exact
      expected_output: DOCKERFILE_OK
    error_message: >-
      The Dockerfile is missing or does not define the required build steps,
      working directory, port metadata, and startup behavior.

  - id: build-image
    prompt: >-
      Build an image from `~/greeter` and tag it `greeter-app`. Confirm the
      image exists.
    type: terminal_action
    validation:
      command: "docker image inspect greeter-app >/dev/null 2>&1 && echo IMAGE_BUILT"
      match_type: exact
      expected_output: IMAGE_BUILT
    error_message: >-
      The required application image tag is not present in the local Docker image store.

  - id: run-image
    prompt: >-
      Run a container from `greeter-app` named `greeter`. It should print
      `hello from the image` and exit.
    type: terminal_action
    validation:
      command: >-
        docker inspect -f '{{.Config.Image}}' greeter 2>/dev/null |
        grep -qx 'greeter-app' &&
        docker logs greeter 2>/dev/null | grep -qx 'hello from the image' &&
        echo RUN_OK
      match_type: exact
      expected_output: RUN_OK
    error_message: >-
      The expected container is missing, uses a different image, or did not produce
      the required greeting in its logs. A disposable container cannot be inspected
      after it exits.

  - id: verify-expose
    prompt: >-
      Inspect the `greeter-app` image and confirm that port `8080` is documented
      in its configuration.
    type: terminal_action
    validation:
      command: >-
        docker image inspect greeter-app --format '{{json .Config.ExposedPorts}}'
        2>/dev/null | grep -q '8080/tcp' && echo EXPOSE_OK
      match_type: exact
      expected_output: EXPOSE_OK
    error_message: >-
      The image configuration does not contain the required documented service port.

  - id: when-run
    prompt: >-
      In your Dockerfile you used both `RUN chmod +x greet.sh` and
      `CMD ["./greet.sh"]`. When does each of these actually execute?
    type: multiple_choice
    options:
      - "RUN executes while the image is being built; CMD executes when a container starts"
      - "Both execute while the image is being built"
      - "CMD executes while the image is being built; RUN executes when a container starts"
    validation:
      expected_answer: "RUN executes while the image is being built; CMD executes when a container starts"
    error_message: >-
      The selected statement reverses or conflates build-time and container-start
      behavior for the two Dockerfile instructions.