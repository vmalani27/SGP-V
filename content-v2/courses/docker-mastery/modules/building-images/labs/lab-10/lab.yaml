id: lab-10
title: Multi-Stage Builds
difficulty: intermediate
environment: docker-build
destination_url: /api/health

setup:
  - command: "apt update && apt install -y npm"
  - command: "usermod -aG docker student"
  - command: |
      rm -f /home/student/order-service/Dockerfile
      rm -f /home/student/order-service/package-lock.json
      rm -rf /home/student/order-service/node_modules
      chown -R student:student /home/student/order-service

objectives:
  - Initialize project dependencies and protect the Docker build context
  - Build and diagnose container bloat in a single-stage Dockerfile
  - Engineer a production-grade multi-stage Dockerfile adhering to nodebestpractices
  - Verify container size reduction and elimination of build tools
  - Deploy and audit runtime container security and process privileges

tasks:
  - id: workspace-preparation
    summary: Initialize workspace dependencies and verify build context exclusions.
    prompt: >-
      In ~/order-service, install the project's dependencies. Then inspect the build context exclusion rules and verify that local dependencies and compiled output are excluded.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import os, sys
        base = '/home/student/order-service'
        lock = os.path.join(base, 'package-lock.json')
        mods = os.path.join(base, 'node_modules')
        ign  = os.path.join(base, '.dockerignore')

        if not os.path.isfile(lock) or not os.path.isdir(mods):
            print('Dependency tree or lockfile missing.')
            sys.exit(0)
        if not os.path.isfile(ign):
            print('Build context ignore file missing.')
            sys.exit(0)
        content = open(ign).read()
        if 'node_modules' not in content or 'dist' not in content:
            print('Context exclusion rules incomplete.')
            sys.exit(0)
        print('WORKSPACE_OK')
        "
      match_type: exact
      expected_output: WORKSPACE_OK
    error_message: >-
      The local workspace dependencies, lockfile, or build context exclusion rules
      do not satisfy the required project configuration.

  - id: single-stage-baseline
    summary: Build the single-stage baseline image.
    prompt: >-
      Build a baseline container image from the existing specification at
      `~/order-service/Dockerfile.single` and tag the resulting image as
      `order-service:single`.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, sys
        r = subprocess.run(['docker', 'image', 'inspect', 'order-service:single'], capture_output=True)
        if r.returncode != 0:
            print('Image not found.')
            sys.exit(0)
        print('BASELINE_OK')
        "
      match_type: exact
      expected_output: BASELINE_OK
    error_message: >-
      The baseline image 'order-service:single' is not available in the local image registry.

  - id: author-multistage-dockerfile
    summary: Author a production multi-stage Dockerfile.
    prompt: >-
      Create a production-ready multi-stage `Dockerfile` in `~/order-service` for
      the TypeScript application. Build the application in an isolated stage and
      produce a minimal production image from it. Use the project configuration and
      the Docker documentation and examples from this chapter to determine how the
      final container should run.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import os, re, sys
        df = '/home/student/order-service/Dockerfile'
        if not os.path.isfile(df):
            print('Dockerfile missing.')
            sys.exit(0)
        content = open(df).read()

        if not re.search(r'FROM\s+node:20-alpine\s+AS\s+builder', content, re.I):
            print('Builder stage definition missing.')
            sys.exit(0)
        if not re.search(r'COPY\s+--from=builder\s+.*dist.*dist', content, re.I):
            print('Artifact extraction missing.')
            sys.exit(0)
        if len(re.findall(r'FROM\s+node:20-alpine', content, re.I)) < 2:
            print('Multi-stage structure missing.')
            sys.exit(0)
        if not re.search(r'npm\s+ci.*(?:--omit=dev|--only=production|--production)', content, re.I):
            print('Production dependency isolation missing.')
            sys.exit(0)
        if not re.search(r'USER\s+node', content, re.I):
            print('Unprivileged user specification missing.')
            sys.exit(0)
        if not re.search(r'EXPOSE\s+3000', content, re.I):
            print('Port exposure declaration missing.')
            sys.exit(0)
        if not re.search(r'CMD\s*\[.*node.*server\.js.*\]', content, re.I):
            print('Direct node startup command missing.')
            sys.exit(0)
        print('DOCKERFILE_OK')
        "
      match_type: exact
      expected_output: DOCKERFILE_OK
    error_message: >-
      The Dockerfile in ~/order-service does not satisfy the multi-stage architecture
      or runtime security constraints.

  - id: build-production-image
    summary: Build the optimized multi-stage production image.
    prompt: >-
      Build the multi-stage image using your authored `~/order-service/Dockerfile`
      and tag the image as `order-service:multi`. The resulting image must achieve
      significant size reduction compared to the single-stage baseline by excluding
      compilers and development dependencies.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, json, sys
        r = subprocess.run(['docker', 'image', 'inspect', 'order-service:multi'], capture_output=True)
        if r.returncode != 0:
            print('Image not found.')
            sys.exit(0)
        data = json.loads(r.stdout.decode('utf-8'))
        size = data[0].get('Size', 0)
        if size > 210000000:
            print('Image size exceeds multi-stage threshold.')
            sys.exit(0)
        print('PRODUCTION_IMAGE_OK')
        "
      match_type: exact
      expected_output: PRODUCTION_IMAGE_OK
    error_message: >-
      The production image 'order-service:multi' is either missing or does not meet
      the required size constraints.

  - id: runtime-audit
    summary: Deploy the production container and audit runtime security.
    prompt: >-
      Deploy a detached container named `order-api` from `order-service:multi` with
      port 3000 published to the host.

      Contract & Success Criteria:
      - The container is running and healthy.
      - HTTP endpoint `http://localhost:3000/api/health` responds with HTTP 200 and reports healthy service status.
      - The process inside the container runs under unprivileged user permissions (`node`).
      - Build-time development tooling, specifically the TypeScript compiler executable (`tsc`), is completely absent from the container filesystem.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, urllib.request, json, sys

        r = subprocess.run(['docker', 'inspect', '-f', '{{.State.Running}}', 'order-api'], capture_output=True, text=True)
        if r.returncode != 0 or 'true' not in r.stdout.strip().lower():
            print('Container not running.')
            sys.exit(0)

        try:
            req = urllib.request.urlopen('http://localhost:3000/api/health', timeout=5)
            if req.status != 200:
                print('Health check returned non-200.')
                sys.exit(0)
            body = json.loads(req.read().decode('utf-8'))
            if body.get('status') != 'healthy':
                print('Health check body unhealthy.')
                sys.exit(0)
        except Exception:
            print('Failed to reach health endpoint.')
            sys.exit(0)

        r_user = subprocess.run(['docker', 'exec', 'order-api', 'whoami'], capture_output=True, text=True)
        if r_user.stdout.strip() != 'node':
            print('Process not running as unprivileged user.')
            sys.exit(0)

        r_tsc = subprocess.run(['docker', 'exec', 'order-api', 'test', '-f', './node_modules/.bin/tsc'], capture_output=True)
        if r_tsc.returncode == 0:
            print('Compiler binary detected in production container.')
            sys.exit(0)

        print('AUDIT_PASSED')
        "
      match_type: exact
      expected_output: AUDIT_PASSED
    error_message: >-
      The deployed container 'order-api' failed one or more runtime health,
      privilege, or security isolation checks.

  - id: architectural-evaluation
    summary: Evaluate the operational advantages of multi-stage container builds.
    prompt: >-
      From an operational and security perspective, what is the primary distinction
      between a multi-stage container build and a single-stage build that compiles code in place?
    type: multiple_choice
    options:
      - "Compilers, linters, and development dependencies are isolated to build layers and omitted from the shipped runtime image."
      - "Docker automatically disables Linux namespace isolation for intermediate build stages to accelerate compilation."
      - "The Docker daemon flattens all container filesystem layers into a single uncompressed tar archive on the host."
      - "External network traffic is blocked by default within multi-stage containers unless explicitly published."
    validation:
      expected_answer: "Compilers, linters, and development dependencies are isolated to build layers and omitted from the shipped runtime image."
    error_message: >-
      The selected answer does not describe the core architectural benefit of
      multi-stage container builds.
