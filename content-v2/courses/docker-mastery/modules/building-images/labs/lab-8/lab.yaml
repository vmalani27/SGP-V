id: lab-8
title: Image Layers and Build Cache
difficulty: intermediate
environment: docker-build

setup:
  - command: "usermod -aG docker student"

objectives:
  - Build an image whose instructions create distinct layers
  - Observe the dependency-installation pattern in practice
  - Modify source code, rebuild, and see the dependency step served from cache
  - Modify a dependency file, rebuild, and see the dependency step run again

tasks:
  - id: create-project
    prompt: >-
      Create a project directory named `cache-demo` in your home directory. In
      it, create a dependency file `deps.txt` containing the line `dep=v1`, and
      a script `app.sh` that prints `app v1`.
    type: terminal_action
    validation:
      command: >-
        test -f ~/cache-demo/deps.txt &&
        grep -qx 'dep=v1' ~/cache-demo/deps.txt &&
        test -f ~/cache-demo/app.sh &&
        grep -q 'app v1' ~/cache-demo/app.sh && echo PROJECT_OK
      match_type: exact
      expected_output: PROJECT_OK
    error_message: >-
      The cache demo project is missing a required dependency or application file,
      or one of their contents does not match the initial project state.

  - id: write-dockerfile
    prompt: >-
      In `~/cache-demo`, write a `Dockerfile` that starts from `alpine:latest`,
      sets the working directory to `/app`, copies `deps.txt` into the image,
      records the contents of `deps.txt` into a file named `installed.txt`
      during the build (this stands in for installing dependencies), then copies
      `app.sh` and prints it when a container starts.
    type: terminal_action
    validation:
      command: >-
        test -f ~/cache-demo/Dockerfile &&
        grep -qE '^FROM +alpine(:latest)?$' ~/cache-demo/Dockerfile &&
        grep -q 'COPY deps.txt' ~/cache-demo/Dockerfile &&
        grep -q 'RUN' ~/cache-demo/Dockerfile &&
        grep -q 'COPY app.sh' ~/cache-demo/Dockerfile &&
        grep -q 'CMD' ~/cache-demo/Dockerfile && echo DOCKERFILE_OK
      match_type: exact
      expected_output: DOCKERFILE_OK
    error_message: >-
      The Dockerfile is missing the dependency layer, source layer, or startup
      behavior required to demonstrate cache reuse.

  - id: build-first
    prompt: >-
      Build an image from `~/cache-demo` and tag it `cache-demo`. This is the
      FIRST build, so every step runs. Run the image: it should print
      `app v1`. Also confirm the image contains `installed.txt` with the
      contents of `deps.txt` (`dep=v1`) — proof that the dependency step ran.
    type: terminal_action
    validation:
      command: >-
        docker image inspect cache-demo >/dev/null 2>&1 &&
        docker run --rm cache-demo 2>/dev/null | grep -qx 'app v1' &&
        docker run --rm --entrypoint cat cache-demo /app/installed.txt
        2>/dev/null | grep -qx 'dep=v1' && echo FIRST_BUILD_OK
      match_type: exact
      expected_output: FIRST_BUILD_OK
    error_message: >-
      The initial image is missing, does not print the initial application version,
      or does not contain the dependency artifact from the first build.

  - id: modify-source
    prompt: >-
      Change `app.sh` so it prints `app v2` instead of `app v1`. Rebuild the
      `cache-demo` image and WATCH the build output: the `RUN cp deps.txt
      installed.txt` step should be reported as CACHED, because `deps.txt` did
      not change. Then run the image — it should print `app v2`, and
      `installed.txt` should STILL contain `dep=v1`, proving the dependency
      step was reused rather than re-run.
    type: terminal_action
    validation:
      command: >-
        docker run --rm cache-demo 2>/dev/null | grep -qx 'app v2' &&
        docker run --rm --entrypoint cat cache-demo /app/installed.txt
        2>/dev/null | grep -qx 'dep=v1' && echo SOURCE_EDIT_OK
      match_type: exact
      expected_output: SOURCE_EDIT_OK
    error_message: >-
      The source-change rebuild did not produce the updated application output while
      preserving the dependency artifact from the earlier layer.

  - id: modify-deps
    prompt: >-
      Now change the dependency file: set `deps.txt` to `dep=v2`. Rebuild the
      `cache-demo` image and WATCH the build output: this time the `RUN`
      step should NOT be cached — it should RUN again, because its input
      changed. Then confirm the image now contains `installed.txt` with `dep=v2`.
    type: terminal_action
    validation:
      command: >-
        docker run --rm --entrypoint cat cache-demo /app/installed.txt
        2>/dev/null | grep -qx 'dep=v2' && echo DEPS_EDIT_OK
      match_type: exact
      expected_output: DEPS_EDIT_OK
    error_message: >-
      The dependency-change rebuild did not update the generated dependency artifact,
      so the dependency layer was not refreshed as required.

  - id: why-order
    prompt: >-
      You saw that changing `deps.txt` forces the dependency step to re-run,
      while changing `app.sh` does not. In a real project (say a Node app with
      `npm install`), which instruction order makes everyday rebuilds fastest?
    type: multiple_choice
    options:
      - "Copy the dependency manifest, install dependencies, then copy the application source"
      - "Copy the application source first, then install dependencies"
      - "Install dependencies after copying everything, in a single RUN"
    validation:
      expected_answer: "Copy the dependency manifest, install dependencies, then copy the application source"
    error_message: >-
      The selected order would cause frequent source changes to invalidate the
      dependency installation layer unnecessarily.