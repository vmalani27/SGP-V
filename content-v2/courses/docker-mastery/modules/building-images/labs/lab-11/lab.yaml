id: lab-11
title: Capstone - Production Image Engineering
difficulty: intermediate
environment: docker-build
destination_url: /health

setup:
  - command: "usermod -aG docker student"
  - command: |
      rm -rf /home/student/inventory-service
      mkdir -p /home/student/inventory-service/src
      mkdir -p /home/student/inventory-service/tests
      mkdir -p /home/student/inventory-service/logs

      cat > /home/student/inventory-service/package.json <<'EOF'
      {
        "name": "inventory-service",
        "version": "1.0.0",
        "main": "dist/server.js",
        "scripts": {
          "build": "tsc",
          "start": "node dist/server.js",
          "test": "echo 'running tests...'"
        },
        "dependencies": {
          "express": "^4.19.2"
        },
        "devDependencies": {
          "typescript": "^5.4.5",
          "@types/express": "^4.17.21",
          "@types/node": "^20.12.7"
        }
      }
      EOF

      cat > /home/student/inventory-service/tsconfig.json <<'EOF'
      {
        "compilerOptions": {
          "target": "ES2022",
          "module": "commonjs",
          "outDir": "./dist",
          "rootDir": "./src",
          "strict": true,
          "esModuleInterop": true,
          "skipLibCheck": true
        },
        "include": ["src/**/*"]
      }
      EOF

      cat > /home/student/inventory-service/src/server.ts <<'EOF'
      import express, { Request, Response } from 'express';

      const app = express();
      const PORT = process.env.PORT || 8080;

      app.use(express.json());

      app.get('/health', (req: Request, res: Response) => {
        res.status(200).json({ status: 'healthy', service: 'inventory' });
      });

      app.get('/api/items', (req: Request, res: Response) => {
        res.status(200).json([
          { id: 'SKU-001', name: 'Widget A', stock: 120 },
          { id: 'SKU-002', name: 'Widget B', stock: 45 }
        ]);
      });

      app.listen(PORT, () => {
        console.log(`Inventory service listening on port ${PORT}`);
      });
      EOF

      cat > /home/student/inventory-service/.env <<'EOF'
      DB_PASSWORD=production_super_secret_password_do_not_leak
      API_TOKEN=prod_token_9921_secret
      EOF

      cat > /home/student/inventory-service/tests/server.test.ts <<'EOF'
      console.log("unit test suite");
      EOF

      echo "2026-09-05 DEBUG server initialized" > /home/student/inventory-service/logs/debug.log

      chown -R student:student /home/student/inventory-service

objectives:
  - Isolate build context to protect secrets and eliminate local development artifacts
  - Author a production-grade multi-stage Dockerfile adhering to nodebestpractices
  - Enforce least-privilege security by executing containers as an unprivileged user
  - Minimize attack surface by stripping compilers, test suites, and package caches
  - Deploy and verify runtime service health and isolation independently

tasks:
  - id: package-and-harden-service
    summary: Containerize, harden, and deploy the inventory service to production standards.
    prompt: >-
      The uncontainerized `inventory-service` at `~/inventory-service` must be
      packaged and deployed according to strict operational and security requirements.

      Operational Requirements:
      1. Context Protection: Establish build context exclusions preventing sensitive files (`.env`), test suites (`tests`), debug logs (`logs`), local dependencies (`node_modules`), and build output (`dist`) from transferring to the Docker daemon.
      2. Architecture: Author a production multi-stage `Dockerfile` in `~/inventory-service` using `node:20-alpine`:
         - Stage 1 (`builder`): Compiles the TypeScript application into `./dist` using declared dependencies.
         - Stage 2 (Production): Operates from `/usr/src/app`. Packages strictly production dependencies, clears package manager caches, and contains only the compiled `dist/` directory from the builder stage.
      3. Security & Privilege:
         - The production container must execute under unprivileged user identity (`node`).
         - The container must document exposure of port 8080.
         - The startup command must execute `dist/server.js` directly with Node without an intermediary shell.
      4. Image Contract:
         - Tag the image as `inventory-service:prod`.
         - The final image size must remain under 210 MB.
      5. Deployment Contract:
         - Run a detached container named `inventory-api` with host port 8080 mapped to container port 8080.
         - The `/health` endpoint must return HTTP 200 with `{"status":"healthy"}`.
         - Build-time tooling (`tsc`) and local secrets (`.env`) must not be accessible in the running container.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import os, re, subprocess, urllib.request, json, sys

        base = '/home/student/inventory-service'
        ign  = os.path.join(base, '.dockerignore')
        df   = os.path.join(base, 'Dockerfile')

        # 1. Verify build context exclusions
        if not os.path.isfile(ign):
            print('Build context ignore file is missing.')
            sys.exit(0)
        ign_content = open(ign).read()
        for required_pattern in ['.env', 'tests', 'node_modules', 'dist']:
            if required_pattern not in ign_content:
                print('Build context does not exclude required patterns.')
                sys.exit(0)

        # 2. Verify Dockerfile multi-stage specification
        if not os.path.isfile(df):
            print('Dockerfile is missing.')
            sys.exit(0)
        df_content = open(df).read()
        if not re.search(r'FROM\s+node:20-alpine\s+AS\s+builder', df_content, re.I):
            print('Builder stage is not properly defined.')
            sys.exit(0)
        if len(re.findall(r'FROM\s+node:20-alpine', df_content, re.I)) < 2:
            print('Multi-stage structure is incomplete.')
            sys.exit(0)
        if not re.search(r'COPY\s+--from=builder\s+.*dist.*dist', df_content, re.I):
            print('Compiled artifacts are not extracted from builder stage.')
            sys.exit(0)
        if not re.search(r'USER\s+node', df_content, re.I):
            print('Unprivileged user specification is missing.')
            sys.exit(0)
        if not re.search(r'EXPOSE\s+8080', df_content, re.I):
            print('Port exposure declaration is missing.')
            sys.exit(0)
        if not re.search(r'CMD\s*\[.*node.*server\.js.*\]', df_content, re.I):
            print('Direct node startup command is missing.')
            sys.exit(0)

        # 3. Verify production image exists and satisfies size budget
        r_img = subprocess.run(['docker', 'image', 'inspect', 'inventory-service:prod'], capture_output=True)
        if r_img.returncode != 0:
            print('Production image inventory-service:prod was not found.')
            sys.exit(0)
        img_data = json.loads(r_img.stdout.decode('utf-8'))
        if img_data[0].get('Size', 0) > 210000000:
            print('Production image exceeds the allocated size budget.')
            sys.exit(0)

        # 4. Verify container deployment & runtime health
        r_ps = subprocess.run(['docker', 'inspect', '-f', '{{.State.Running}}', 'inventory-api'], capture_output=True, text=True)
        if r_ps.returncode != 0 or 'true' not in r_ps.stdout.strip().lower():
            print('Container inventory-api is not running.')
            sys.exit(0)

        try:
            req = urllib.request.urlopen('http://localhost:8080/health', timeout=5)
            if req.status != 200:
                print('Health check returned non-200 status.')
                sys.exit(0)
            data = json.loads(req.read().decode('utf-8'))
            if data.get('status') != 'healthy':
                print('Service health payload reported unhealthy status.')
                sys.exit(0)
        except Exception:
            print('Health endpoint failed to respond.')
            sys.exit(0)

        # 5. Verify unprivileged process execution
        r_user = subprocess.run(['docker', 'exec', 'inventory-api', 'whoami'], capture_output=True, text=True)
        if r_user.stdout.strip() != 'node':
            print('Container process is executing with elevated privileges.')
            sys.exit(0)

        # 6. Verify compiler is stripped
        r_tsc = subprocess.run(['docker', 'exec', 'inventory-api', 'test', '-f', './node_modules/.bin/tsc'], capture_output=True)
        if r_tsc.returncode == 0:
            print('Build-time compiler was detected in the production container.')
            sys.exit(0)

        # 7. Verify secrets were not leaked into container
        r_sec = subprocess.run(['docker', 'exec', 'inventory-api', 'test', '-f', '/usr/src/app/.env'], capture_output=True)
        if r_sec.returncode == 0:
            print('Sensitive environment files were leaked into the container.')
            sys.exit(0)

        print('STANDALONE_ASSESSMENT_PASSED')
        "
      match_type: exact
      expected_output: STANDALONE_ASSESSMENT_PASSED
    error_message: >-
      The inventory-service deployment does not meet the required operational,
      security, or health specifications.
