id: lab-9
title: Building an Application Image
difficulty: intermediate
environment: docker-build

setup:
  - command: "usermod -aG docker student"
  - command: |
      # Provision the provided application fixture. The student's work is the
      # Dockerfile only — the application is a deterministic, given input.
      mkdir -p /home/student/hello-app
      cat > /home/student/hello-app/app.py <<'SGP_FIXTURE'
      from http.server import HTTPServer, BaseHTTPRequestHandler

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'hello from the app')

          def log_message(self, *args):
              pass

      print('ready')
      HTTPServer(('0.0.0.0', 8000), Handler).serve_forever()
      SGP_FIXTURE
      cat > /home/student/hello-app/requirements.txt <<'SGP_FIXTURE'
      # No third-party dependencies - the app uses only the Python standard library.
      SGP_FIXTURE
      chown -R student:student /home/student/hello-app

objectives:
  - Explain how a provided application maps to image layers
  - Write a Dockerfile using the dependency-installation pattern
  - Build the image and run a container from it
  - Verify the application serves requests from inside the container

tasks:
  - id: containerize-app
    prompt: >-
      A starter application has been provided in `~/hello-app`. Your challenge is to completely containerize it.
      
      Inspect the `app.py` and `requirements.txt` to understand what the app does.
      Write a `Dockerfile` using the `python:3.12-alpine` base image. Use the dependency-installation pattern (copy requirements, install, then copy source).
      Build the image, then run it in the background, publishing its port `8000` to the host.
      
      When you are done, the application should be running inside Docker and accessible at `http://localhost:8000`.
    type: terminal_action
    validation:
      command: >-
        test -n "$(docker ps -q --filter publish=8000)" &&
        curl -s -o /tmp/hello.out -w '%{http_code}' http://localhost:8000/ 2>/dev/null | grep -qx '200' &&
        grep -qx 'hello from the app' /tmp/hello.out && echo SUCCESS
      match_type: exact
      expected_output: SUCCESS
    error_message: >-
      Could not find a Docker container running and serving the app on port 8000.
      Make sure you built the image and ran it with `-d -p 8000:8000`.
    hints:
      - "Your Dockerfile needs: FROM python:3.12-alpine, WORKDIR /app, COPY requirements.txt ., RUN pip install -r requirements.txt, COPY app.py ., EXPOSE 8000, CMD [\"python\", \"app.py\"]"
      - "Build it: `docker build -t hello-app ~/hello-app`"
      - "Run it: `docker run -d -p 8000:8000 hello-app`"
    solution:
      command: >-
        printf 'FROM python:3.12-alpine\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install -r requirements.txt\nCOPY app.py .\nEXPOSE 8000\nCMD ["python", "app.py"]\n' > ~/hello-app/Dockerfile &&
        docker build -t hello-app ~/hello-app &&
        docker run -d -p 8000:8000 hello-app
