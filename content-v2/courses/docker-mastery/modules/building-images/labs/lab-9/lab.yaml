id: lab-9
title: Building an Application Image
difficulty: intermediate
environment: docker-build

setup:
  - command: "usermod -aG docker student"
  - command: |
      # Provision the provided application fixture. The student's work is the
      # Dockerfile only — the application is a deterministic, given input.
      mkdir -p /home/student/hello-app
      cat > /home/student/hello-app/app.py <<'SGP_FIXTURE'
      from http.server import HTTPServer, BaseHTTPRequestHandler

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'hello from the app')

          def log_message(self, *args):
              pass

      print('ready')
      HTTPServer(('0.0.0.0', 8000), Handler).serve_forever()
      SGP_FIXTURE
      cat > /home/student/hello-app/requirements.txt <<'SGP_FIXTURE'
      # No third-party dependencies - the app uses only the Python standard library.
      SGP_FIXTURE
      chown -R student:student /home/student/hello-app

objectives:
  - Explain how a provided application maps to image layers
  - Write a Dockerfile using the dependency-installation pattern
  - Build the image and run a container from it
  - Verify the application serves requests from inside the container

tasks:
  - id: create-dockerfile
    prompt: >-
      A starter application has been provided in `~/hello-app`. Let's containerize it step by step.
      
      First, inspect `app.py` and `requirements.txt`. Then, write a `Dockerfile` inside `~/hello-app/` using the `python:3.12-alpine` base image.
      Use the dependency-installation pattern: copy the requirements, install them, then copy the source code, expose port 8000, and set the default command to run `python app.py`.
    type: terminal_action
    validation:
      command: >-
        test -f ~/hello-app/Dockerfile &&
        grep -qi "FROM python:3.12-alpine" ~/hello-app/Dockerfile &&
        grep -qi "COPY" ~/hello-app/Dockerfile &&
        echo SUCCESS
      match_type: exact
      expected_output: SUCCESS
    error_message: >-
      Could not validate your Dockerfile. Ensure it exists at `~/hello-app/Dockerfile` and uses `FROM python:3.12-alpine`.
    hints:
      - "Create the file with a text editor: `nano ~/hello-app/Dockerfile`"
      - "The file needs: `FROM python:3.12-alpine`, `WORKDIR /app`, `COPY requirements.txt .`, `RUN pip install -r requirements.txt`, `COPY app.py .`, `EXPOSE 8000`, `CMD [\"python\", \"app.py\"]`"
    solution:
      command: >-
        printf 'FROM python:3.12-alpine\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install -r requirements.txt\nCOPY app.py .\nEXPOSE 8000\nCMD ["python", "app.py"]\n' > ~/hello-app/Dockerfile

  - id: build-image
    prompt: >-
      Now that your `Dockerfile` is ready, build the image and tag it as `hello-app`.
    type: terminal_action
    validation:
      command: "docker images --format '{{.Repository}}' | grep -qx hello-app && echo SUCCESS"
      match_type: exact
      expected_output: SUCCESS
    error_message: >-
      Could not find an image named `hello-app`. Make sure to run the build command in the correct directory.
    hints:
      - "Use `docker build` with the `-t` flag to tag the image."
      - "Run `docker build -t hello-app ~/hello-app`"
    solution:
      command: "docker build -t hello-app ~/hello-app"

  - id: run-container
    prompt: >-
      Finally, run a container from your `hello-app` image in the background (`-d`), and publish its port `8000` to the host's port `8000` (`-p 8000:8000`).
    type: terminal_action
    validation:
      command: >-
        test -n "$(docker ps -q --filter publish=8000)" &&
        curl -s -o /tmp/hello.out -w '%{http_code}' http://127.0.0.1:8000/ 2>/dev/null | grep -q '200' &&
        echo SUCCESS
      match_type: exact
      expected_output: SUCCESS
    error_message: >-
      Could not access the app on port 8000. Ensure you ran the container with `-d` and `-p 8000:8000`.
    hints:
      - "Use `docker run` to start the container."
      - "Run `docker run -d -p 8000:8000 hello-app`"
    solution:
      command: "docker run -d -p 8000:8000 hello-app"
