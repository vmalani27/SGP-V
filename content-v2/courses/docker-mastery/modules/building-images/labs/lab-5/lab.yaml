id: lab-5
title: Build a Minimal Image
difficulty: beginner
environment: docker-build

setup:
  - command: "usermod -aG docker student"

objectives:
  - Create a project directory with a file to ship inside an image
  - Write a minimal Dockerfile with FROM, WORKDIR, COPY, and CMD
  - Build an image from the Dockerfile with docker build
  - Run the image and verify it produces the expected output

tasks:
  - id: create-project
    prompt: >-
      Create a project directory named `status-banner` in your home directory,
      and inside it create a file `banner.txt` containing the text
      `System Status: All Services Operational`.
    type: terminal_action
    validation:
      command: >-
        test -f ~/status-banner/banner.txt &&
        grep -qx 'System Status: All Services Operational' ~/status-banner/banner.txt &&
        echo PROJECT_OK
      match_type: exact
      expected_output: PROJECT_OK
    error_message: >-
      The project directory or banner.txt is missing, or the file contents do not
      match the required message.

  - id: write-dockerfile
    prompt: >-
      In `~/status-banner`, author a `Dockerfile` that uses `alpine:latest` as
      the base image, sets `/app` as the container working directory, copies
      `banner.txt` into it, and prints the file's contents when a container starts.
    type: terminal_action
    validation:
      command: >-
        cd ~/status-banner &&
        docker build -q -t lab5-check . >/dev/null &&
        docker run --rm lab5-check 2>/dev/null | grep -qx 'System Status: All Services Operational' &&
        docker rmi -f lab5-check >/dev/null 2>&1 &&
        echo DOCKERFILE_OK
      match_type: exact
      expected_output: DOCKERFILE_OK
    error_message: >-
      The image could not be built or failed to print the banner text upon container
      startup. Verify the Dockerfile instructions and syntax.

  - id: build-image
    prompt: >-
      Build an image from the Dockerfile in `~/status-banner` and tag it
      `status-banner:1.0`.
    type: terminal_action
    validation:
      command: "docker image inspect status-banner:1.0 >/dev/null 2>&1 && echo IMAGE_BUILT"
      match_type: exact
      expected_output: IMAGE_BUILT
    error_message: >-
      The image tag status-banner:1.0 was not found in the local Docker image store.

  - id: run-image
    prompt: >-
      Run the `status-banner:1.0` image as a container named `status-runner`.
      The container should print the banner message and exit.
    type: terminal_action
    validation:
      command: >-
        docker inspect -f '{{.Config.Image}}' status-runner 2>/dev/null |
        grep -qE 'status-banner(:1.0)?' &&
        docker logs status-runner 2>/dev/null | grep -qx 'System Status: All Services Operational' &&
        echo RUN_OK
      match_type: exact
      expected_output: RUN_OK
    error_message: >-
      The status-runner container was not found, did not use the status-banner:1.0
      image, or did not produce the expected banner in its logs.

  - id: what-built
    prompt: >-
      Which statement correctly describes the relationship between a Dockerfile,
      an image, and a container?
    type: multiple_choice
    options:
      - "docker build produces an image from a Dockerfile; docker run produces a container from an image"
      - "docker build produces a container; docker run produces an image"
      - "The Dockerfile, the image, and the container are all the same thing"
    validation:
      expected_answer: "docker build produces an image from a Dockerfile; docker run produces a container from an image"
    error_message: >-
      The selected statement does not distinguish the Dockerfile, image, and
      container or assigns the build and run operations to the wrong objects.