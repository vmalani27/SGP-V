id: lab-5
title: Build a Minimal Image
difficulty: beginner
environment: docker-build

setup:
  - command: "usermod -aG docker student"

objectives:
  - Create a project directory with a file to ship inside an image
  - Write a minimal Dockerfile with FROM, WORKDIR, COPY, and CMD
  - Build an image from the Dockerfile with docker build
  - Run the image and verify it produces the expected output

tasks:
  - id: create-project
    prompt: >-
      You are going to build your first image. Create a project directory named
      `my-image` in your home directory, and inside it create a file
      `hello.txt` containing the text `hello from my image`.
    type: terminal_action
    validation:
      command: >-
        test -f ~/my-image/hello.txt &&
        grep -qx 'hello from my image' ~/my-image/hello.txt && echo PROJECT_OK
      match_type: exact
      expected_output: PROJECT_OK
    error_message: >-
      ~/my-image/hello.txt should exist and contain exactly `hello from my
      image`. Check with `ls ~/my-image` and `cat ~/my-image/hello.txt`.
    hints:
      - "Which command creates a directory? And which command creates a file with text in it?"
      - "`mkdir -p ~/my-image` creates the directory; `echo 'hello from my image' > ~/my-image/hello.txt` writes the file."
      - "Verify both with `ls -l ~/my-image` and `cat ~/my-image/hello.txt`."
    solution:
      command: "mkdir -p ~/my-image && echo 'hello from my image' > ~/my-image/hello.txt"

  - id: write-dockerfile
    prompt: >-
      In the `my-image` directory, write a `Dockerfile` that starts from the
      `alpine:latest` base image, sets the working directory to `/app`, copies
      `hello.txt` into that directory, and prints the file's contents when the
      container starts.
    type: terminal_action
    validation:
      command: >-
        cd ~/my-image &&
        docker build -q -t lab5-check . >/dev/null &&
        docker run --rm lab5-check 2>/dev/null | grep -qx 'hello from my image' &&
        docker rmi -f lab5-check >/dev/null 2>&1 &&
        echo DOCKERFILE_OK
      match_type: exact
      expected_output: DOCKERFILE_OK
    error_message: >-
      Building `~/my-image/Dockerfile` and running the resulting image did not
      print `hello from my image`. The image must build successfully, and a
      container created from it must print the file's contents when it starts.
      Read your Dockerfile with `cat ~/my-image/Dockerfile` and check the build
      output above.
    hints:
      - "A Dockerfile is a plain text file named exactly `Dockerfile` — no extension."
      - "Use `FROM alpine:latest` for the base, `WORKDIR /app` for the working directory, and `COPY hello.txt .` to copy your file in."
      - "Finish with a `CMD` (e.g. `CMD [\"cat\", \"hello.txt\"]`) or an `ENTRYPOINT` that prints the file, so a container created from the image prints `hello from my image` when it starts."
    solution:
      command: >-
        printf 'FROM alpine:latest\n\nWORKDIR /app\n\nCOPY hello.txt .\n\nCMD ["cat", "hello.txt"]\n'
        > ~/my-image/Dockerfile

  - id: build-image
    prompt: >-
      Build an image from the Dockerfile in `~/my-image` and tag it
      `my-first-image`. Confirm the image now exists on this system.
    type: terminal_action
    validation:
      command: "docker image inspect my-first-image >/dev/null 2>&1 && echo IMAGE_BUILT"
      match_type: exact
      expected_output: IMAGE_BUILT
    error_message: >-
      No image tagged `my-first-image` exists. Build it from the project
      directory and check with `docker images`.
    hints:
      - "Which command builds an image from a Dockerfile? It takes the build context as an argument."
      - "`docker build -t my-first-image ~/my-image` builds and tags the image in one step."
      - "Verify with `docker images` — `my-first-image` should be listed."
    solution:
      command: "docker build -t my-first-image ~/my-image"

  - id: run-image
    prompt: >-
      Run the `my-first-image` image as a container named `hello`. The
      container should print the contents of `hello.txt` and exit.
    type: terminal_action
    validation:
      command: >-
        docker inspect -f '{{.Config.Image}}' hello 2>/dev/null |
        grep -qx 'my-first-image' &&
        docker logs hello 2>/dev/null | grep -qx 'hello from my image' &&
        echo RUN_OK
      match_type: exact
      expected_output: RUN_OK
    error_message: >-
      There is no container named `hello` created from your `my-first-image`
      image. This step only counts once you run `docker run --name hello
      my-first-image` in your terminal and that container prints `hello from
      my image` in its logs. Remove a stale `hello` first with `docker rm -f
      hello`, and don't use `--rm` — it deletes the container before it can be
      checked.
    hints:
      - "Which flag gives a container a name? `docker run --name <name> <image>`."
      - "`docker run --name hello my-first-image` runs the image, prints the file, and exits — but the container stays around to inspect."
      - "Confirm with `docker ps -a` (state: `Exited`) and `docker logs hello`. If nothing prints, verify `hello.txt` was copied into the image."
    solution:
      command: "docker run --name hello my-first-image"

  - id: what-built
    prompt: >-
      After this lab you have a Dockerfile, an image, and running containers.
      Which statement correctly describes the relationship between them?
    type: multiple_choice
    options:
      - "docker build produces an image; docker run produces a container"
      - "docker build produces a container; docker run produces an image"
      - "The Dockerfile, the image, and the container are all the same thing"
    validation:
      expected_answer: "docker build produces an image from a Dockerfile; docker run produces a container from an image"
    error_message: >-
      docker build turns a Dockerfile into an image, and docker run turns an
      image into a running container. The three are distinct objects.
    hints:
      - "What command turns the Dockerfile into something you can run?"
      - "What command turns that something into a running process?"
      - "One produces an image; the other produces a container."