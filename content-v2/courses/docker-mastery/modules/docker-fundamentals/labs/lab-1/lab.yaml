id: lab-1
title: Hello World Container
difficulty: beginner
environment: docker-fundamentals

objectives:
  - Diagnose Docker daemon communication and socket permission requirements
  - Grant non-root user authorization to the Docker daemon
  - Inspect the local container image cache
  - Execute a container with designated runtime output and verify execution logs

tasks:
  - id: diagnose-daemon-access
    summary: Diagnose the root cause of Docker daemon connection failure.
    prompt: >-
      Attempting to run `docker ps` in this initial environment produces an error.
      What is the root cause of this connection failure?
    type: multiple_choice
    options:
      - "The user account lacks read/write permissions to the Docker Unix domain socket (`/var/run/docker.sock`)."
      - "The Docker daemon process is not installed on the host system."
      - "The container runtime requires an active network license token to initialize."
      - "The Linux kernel has disabled user process namespaces globally."
    validation:
      expected_answer: "The user account lacks read/write permissions to the Docker Unix domain socket (`/var/run/docker.sock`)."
    error_message: >-
      The selected answer does not identify the socket permission model governing Docker daemon communication.

  - id: grant-docker-permissions
    summary: Grant non-root daemon authorization to the student user.
    prompt: >-
      Configure the user `student` with the group permissions necessary to communicate
      with the Docker daemon socket without requiring `sudo` for subsequent operations.
    type: terminal_action
    validation:
      command: getent group docker | grep -qw student && echo ACCESS_GRANTED
      match_type: exact
      expected_output: ACCESS_GRANTED
    error_message: >-
      The student user account has not been added to the docker system group.

  - id: inspect-image-cache
    summary: Identify the CLI command used to inspect locally stored container images.
    prompt: >-
      Which command lists all container images currently stored in the local Docker engine cache?
    type: multiple_choice
    options:
      - "docker images"
      - "docker search local"
      - "docker cache list"
      - "docker ps --images"
    validation:
      expected_answer: "docker images"
    error_message: >-
      The selected command does not display locally cached container images.

  - id: run-simple-container
    summary: Execute an Alpine container that emits a verification greeting.
    prompt: >-
      Deploy a container meeting these operational requirements:
      - Name: `alpine-container`
      - Base Image: `alpine:latest`
      - Output: The container must output the exact string `GREETING_FROM_ALPINE` to stdout.
      - Persistence: The container may terminate upon completing its command, but the container object must remain on the host for inspection.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, json, sys

        r = subprocess.run(['docker', 'inspect', 'alpine-container'], capture_output=True)
        if r.returncode != 0:
            print('Container not found.')
            sys.exit(0)

        data = json.loads(r.stdout.decode('utf-8'))[0]
        if not data['Config']['Image'].startswith('alpine'):
            print('Invalid image.')
            sys.exit(0)

        logs = subprocess.run(['docker', 'logs', 'alpine-container'], capture_output=True)
        if b'GREETING_FROM_ALPINE' not in logs.stdout:
            print('Missing expected greeting.')
            sys.exit(0)

        print('CONTAINER_OK')
        "
      match_type: exact
      expected_output: CONTAINER_OK
    error_message: >-
      The container 'alpine-container' was not found, did not use 'alpine:latest', or did not emit 'GREETING_FROM_ALPINE'.
