id: lab-1
title: Hello World Container
difficulty: beginner
environment: docker-basic

objectives:
  - Diagnose why Docker commands fail
  - Grant your user access to the Docker daemon
  - Inspect the local image cache
  - Run a simple container

tasks:
  - id: access-daemon
    prompt: Can you access the Docker daemon right now? Run `docker ps` to find out.
    type: multiple_choice
    options: ["Yes", "No"]
    validation:
      expected_answer: "No"
    error_message: Docker should refuse the connection for now. You'll fix that in the next task.
    hint: Run `docker ps` and read the error message.

  - id: fix-group
    prompt: Add your user to the docker group so `docker` commands work without `sudo`.
    type: terminal_action
    validation:
      command: getent group docker | grep -qw student && echo ACCESS_GRANTED
      match_type: exact
      expected_output: ACCESS_GRANTED
    error_message: Your user is not in the docker group yet. Check with `getent group docker`.
    hint: Run `sudo usermod -aG docker student`, then refresh your session with `newgrp docker`.

  - id: count-images
    prompt: How many images are present in the system?
    type: multiple_choice
    options: ["1", "2", "3", "4"]
    validation:
      match_type: exact
      expected_output: "2"
    error_message: Unexpected image count.
    hint: Run `docker images` to count them.

  - id: run-simple-container
    prompt: Run a container named `alpine-container` that prints the greeting `GREETING_FROM_ALPINE`.
    type: terminal_action
    validation:
      # Run validation as root to inspect container state and logs
      execution_user: root
      expected_exit_code: 0
      command: >-
        docker inspect alpine-container >/dev/null 2>&1 &&
        docker inspect -f '{{.Config.Image}}' alpine-container | grep -qx 'alpine:latest' &&
        docker logs alpine-container 2>&1 | grep -q GREETING_FROM_ALPINE
    error_message: >-
      No container named `alpine-container` printed the greeting. Run
      `docker ps -a` to find your container, then `docker logs alpine-container`
      to inspect its output.
    hint: docker run --name alpine-container alpine:latest echo GREETING_FROM_ALPINE
