id: lab-1
title: Hello World Container
difficulty: beginner
environment: docker-basic

objectives:
  - Diagnose why Docker commands fail
  - Grant your user access to the Docker daemon
  - Inspect the local image cache
  - Run a simple container

tasks:
  - id: access-daemon
    prompt: Can you access the Docker daemon right now? Run `docker ps` to find out.
    type: multiple_choice
    options: ["Yes", "No"]
    validation:
      expected_answer: "No"
    error_message: Docker should refuse the connection for now. You'll fix that in the next task.
    hints:
      - "Which command lists the containers currently running on this system?"
      - "Run `docker ps` and read the error message carefully — it tells you what is wrong."
      - "Docker is refusing the connection because your user lacks permission to talk to the daemon socket. That is expected — the next task fixes it."

  - id: fix-group
    prompt: Add your user to the docker group so `docker` commands work without `sudo`.
    type: terminal_action
    validation:
      command: getent group docker | grep -qw student && echo ACCESS_GRANTED
      match_type: exact
      expected_output: ACCESS_GRANTED
    error_message: Your user is not in the docker group yet. Check with `getent group docker`.
    hints:
      - "Docker commands fail because your user is not in the docker group yet. How do you add a user to a group?"
      - "Which command adds a member to a group? It needs root privileges, so prefix it with `sudo`."
      - "Verify the change with `getent group docker` — your user should now be listed."
    solution:
      command: "sudo usermod -aG docker student"

  - id: count-images
    prompt: How many images are present in the system?
    type: multiple_choice
    options: ["1", "2", "3", "4"]
    validation:
      match_type: exact
      expected_output: "2"
    error_message: Unexpected image count. Run `docker images` and count them again.
    hints:
      - "Which command lists the images stored locally on this system?"
      - "Run `docker images` and count the rows in the output."
      - "Two images are pre-pulled into this environment for you."

  - id: run-simple-container
    prompt: Run a container named `alpine-container` that prints the greeting `GREETING_FROM_ALPINE`.
    type: terminal_action
    validation:
      execution_user: root
      expected_exit_code: 0
      command: >-
        docker inspect alpine-container >/dev/null 2>&1 &&
        docker inspect -f '{{.Config.Image}}' alpine-container | grep -qx 'alpine:latest' &&
        docker logs alpine-container 2>&1 | grep -q GREETING_FROM_ALPINE
    error_message: >-
      No container named `alpine-container` printed the greeting. Run
      `docker ps -a` to find your container, then `docker logs alpine-container`
      to inspect its output.
    hints:
      - "Which command creates a container from an image and starts it? It needs a name and a command to run."
      - "Use `--name alpine-container` and pass the greeting as the command: `echo GREETING_FROM_ALPINE` after the image name."
      - "Verify with `docker logs alpine-container` — the greeting should appear in its output."
    solution:
      command: "docker run --name alpine-container alpine:latest echo GREETING_FROM_ALPINE"
