environment:
  base_image: "sgp-lab-docker:latest"
  pre_pull:
    - nginx:alpine
    - alpine:latest

phases:
  - id: "phase-0"
    title: "Environment Setup"
    type: "setup"
    steps:
      - id: "install-docker"
        command: "true"
        description: "Docker Engine is preinstalled in the base image (sgp-lab-docker:latest)"
      - id: "start-docker"
        command: "true"
        description: "Docker daemon is started by systemd when the container boots"
      - id: "pull-images"
        command: "true"
        description: "Required images (nginx:alpine, alpine:latest) are pre-pulled by the orchestrator during provisioning"

  - id: "phase-1"
    title: "Docker Fundamentals"
    labs:
      - id: "lab-1"
        title: "Hello World Container"
        order: 1
        tasks:
          - id: "task-1"
            title: "Can you access the Docker daemon?"
            prompt: "Can you access the Docker daemon right now? Run `docker ps` to find out."
            type: "multiple_choice"
            options: ["Yes", "No"]
            validation:
              command: "docker ps >/dev/null 2>&1 && echo Yes || echo No"
              match_type: "exact"
            error_message: "Docker should refuse the connection for now. You'll fix that in the next task."
            hint: "Run `docker ps` and read the error message."

          - id: "task-2"
            title: "Fix Docker access"
            prompt: "Add your user to the docker group so Docker commands work."
            type: "terminal_action"
            validation:
              command: "getent group docker | grep -qw student && echo ACCESS_GRANTED"
              match_type: "exact"
              expected_output: "ACCESS_GRANTED"
            error_message: "Your user is not in the docker group yet. Check with `getent group docker`."
            hint: "Run `sudo usermod -aG docker student`, then refresh your session with `newgrp docker`."

          - id: "task-3"
            title: "Count images"
            prompt: "How many images are present in the system?"
            type: "multiple_choice"
            options: ["1", "2", "3", "4"]
            validation:
              match_type: "exact"
              expected_output: "2"
            error_message: "Unexpected image count."
            hint: "Run `docker images` to count them."

      - id: "lab-2"
        title: "Working with Images"
        order: 2
        setup:
          - command: "docker rm -f web || true"
        tasks:
          - id: "task-1"
            prompt: "List all local images. How many are there now?"
            type: "multiple_choice"
            options_source: "dynamic"
            validation:
              command: "docker images -q | wc -l | tr -d ' '"
              match_type: "exact"
            error_message: "Unexpected image count."
            hint: "Run docker images to list them."

          - id: "task-2"
            prompt: "Inspect the nginx image. What is its size?"
            type: "terminal_action"
            validation:
              command: "docker images nginx:alpine --format '{{.Size}}'"
              match_type: "contains"
              expected_output: "MB"
            error_message: "Could not determine nginx image size."
            hint: "docker images shows size info."

          - id: "task-3"
            prompt: "Remove the alpine:latest image."
            type: "terminal_action"
            validation:
              command: "docker images alpine:latest -q | wc -l | tr -d ' '"
              match_type: "exact"
              expected_output: "0"
            error_message: "alpine:latest still exists."
            hint: "docker rmi removes an image."

      - id: "lab-3"
        title: "Environment Variables"
        order: 3
        tasks:
          - id: "task-1"
            prompt: "Run an alpine container that prints the value of MY_VAR='hello' when it starts."
            type: "terminal_action"
            validation:
              command: "docker run --rm -e MY_VAR=hello alpine printenv MY_VAR"
              match_type: "exact"
              expected_output: "hello"
            error_message: "Container did not print the expected environment variable."
            hint: "Use -e to pass environment variables to a container."

          - id: "task-2"
            prompt: "Map host port 9090 to an nginx container's port 80."
            type: "terminal_action"
            validation:
              command: "docker port $(docker ps -q | head -1) 2>/dev/null | head -1"
              match_type: "contains"
              expected_output: "9090"
            error_message: "Port 9090 not mapped."
            hint: "docker run -p 9090:80 nginx:alpine"
