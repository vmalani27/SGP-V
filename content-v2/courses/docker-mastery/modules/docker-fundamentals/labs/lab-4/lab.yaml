id: lab-4
title: Ephemeral Storage, Process Signals & Restart Policies
difficulty: intermediate
environment: docker-basic

setup:
  - command: "usermod -aG docker student"
  - command: "docker rm -f ephemeral-worker resilient-worker 2>/dev/null || true"

objectives:
  - Audit filesystem alterations in the container writable layer via docker diff
  - Prove rootfs ephemerality across container recreation
  - Analyze process termination signals and identify SIGKILL exit code semantics
  - Configure automated container restart policies for production resilience
  - Execute garbage collection to prune stopped container resources

tasks:
  - id: audit-writable-layer
    summary: Modify a container's writable layer and create state files.
    prompt: >-
      Deploy a container named `ephemeral-worker` using `alpine:latest` configured to run
      in the background (`sleep 300`). Inside the container, create a directory `/data`
      and a file `/data/state.json` containing `{"active": true}`.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, json, sys

        r = subprocess.run(['docker', 'inspect', 'ephemeral-worker'], capture_output=True)
        if r.returncode != 0:
            print('Container not found.')
            sys.exit(0)

        data = json.loads(r.stdout.decode('utf-8'))[0]
        if not data['State']['Running']:
            print('Container not running.')
            sys.exit(0)

        r_file = subprocess.run(['docker', 'exec', 'ephemeral-worker', 'cat', '/data/state.json'], capture_output=True)
        if b'{\"active\": true}' not in r_file.stdout:
            print('File missing or invalid content.')
            sys.exit(0)

        r_diff = subprocess.run(['docker', 'diff', 'ephemeral-worker'], capture_output=True)
        diff_out = r_diff.stdout.decode('utf-8')
        if '/data' not in diff_out or '/data/state.json' not in diff_out:
            print('Diff does not record added files.')
            sys.exit(0)

        print('WRITABLE_LAYER_OK')
        "
      match_type: exact
      expected_output: WRITABLE_LAYER_OK
    error_message: >-
      The container 'ephemeral-worker' does not exist or does not contain /data/state.json.

  - id: evaluate-ephemeral-destruction
    summary: Recreate the container and verify that data does not survive.
    prompt: >-
      Demonstrate the ephemeral nature of container writable layers:
      1. Remove the existing `ephemeral-worker` container.
      2. Launch a fresh container with the identical name `ephemeral-worker` from `alpine:latest` running in the background.
      3. Verify that `/data/state.json` does not exist in the new container instance.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, json, sys

        r = subprocess.run(['docker', 'inspect', 'ephemeral-worker'], capture_output=True)
        if r.returncode != 0:
            print('Container not found.')
            sys.exit(0)

        data = json.loads(r.stdout.decode('utf-8'))[0]
        if not data['State']['Running']:
            print('Container not running.')
            sys.exit(0)

        r_check = subprocess.run(['docker', 'exec', 'ephemeral-worker', 'test', '-f', '/data/state.json'], capture_output=True)
        if r_check.returncode == 0:
            print('State file still exists; container was not recreated from scratch.')
            sys.exit(0)

        print('EPHEMERAL_VERIFIED')
        "
      match_type: exact
      expected_output: EPHEMERAL_VERIFIED
    error_message: >-
      The fresh container 'ephemeral-worker' still contains the old state file or is not running.

  - id: triage-exit-signals
    summary: Identify process termination exit code semantics for SIGKILL.
    prompt: >-
      When a container process is forcefully halted using `docker kill` or terminated by the Linux OOM Killer
      via `SIGKILL` (signal 9), what exit code does Docker record in `docker inspect`?
    type: multiple_choice
    options:
      - "137 (128 + 9)"
      - "0 (Clean termination)"
      - "1 (General error)"
      - "143 (128 + 15)"
    validation:
      expected_answer: "137 (128 + 9)"
    error_message: >-
      The selected exit code does not reflect the standard Linux signal offset (128 + signal) for SIGKILL.

  - id: configure-restart-policy
    summary: Configure an automated restart policy on failure with retry limits.
    prompt: >-
      Deploy a background container named `resilient-worker` using `alpine:latest` running `sleep 300`.
      Configure it with an automated restart policy of `on-failure` with a maximum of `3` retries.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, json, sys

        r = subprocess.run(['docker', 'inspect', 'resilient-worker'], capture_output=True)
        if r.returncode != 0:
            print('Container not found.')
            sys.exit(0)

        data = json.loads(r.stdout.decode('utf-8'))[0]
        policy = data['HostConfig']['RestartPolicy']

        if policy.get('Name') != 'on-failure' or policy.get('MaximumRetryCount') != 3:
            print('Invalid restart policy.')
            sys.exit(0)

        print('RESTART_POLICY_OK')
        "
      match_type: exact
      expected_output: RESTART_POLICY_OK
    error_message: >-
      The container 'resilient-worker' does not have restart policy 'on-failure' with 3 max retries.

  - id: execute-garbage-collection
    summary: Prune stopped containers to reclaim host disk space.
    prompt: >-
      Remove all stopped and terminated containers from the system so that zero exited
      containers remain on disk.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, sys

        r = subprocess.run(['docker', 'ps', '-a', '--filter', 'status=exited', '-q'], capture_output=True)
        out = r.stdout.decode('utf-8').strip()
        if out != '':
            print('Exited containers still exist.')
            sys.exit(0)

        print('PRUNE_OK')
        "
      match_type: exact
      expected_output: PRUNE_OK
    error_message: >-
      One or more stopped containers still occupy disk space on the host.
