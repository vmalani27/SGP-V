id: images
title: Working with Images
difficulty: beginner
estimated_time: 12
xp: 60
tags:
  - docker
  - images
environment: docker-basic

objectives:
  - List local Docker images
  - Inspect image metadata
  - Remove unused images

setup:
  - command: docker rm -f web || true

tasks:
  - id: list-images
    prompt: List all local images. How many are there now?
    type: multiple_choice
    options_source: dynamic
    validation:
      command: docker images -q | wc -l | tr -d ' '
      match_type: exact
    error_message: That does not match. Compare with `docker images` output.
    hint: Run docker images to see the full list.

  - id: inspect-image
    title: Inspect image size
    description: Check how much space the nginx image uses.
    prompt: Inspect the nginx image. What is its approximate size?
    type: terminal_action
    validation:
      command: docker images nginx:alpine --format '{{.Size}}'
      match_type: contains
      expected_output: MB
    error_message: Could not determine nginx image size.
    hint: docker images shows size in the last column.

  - id: remove-image
    title: Remove an image
    description: Clean up the alpine:latest image.
    prompt: Remove the alpine:latest image.
    type: terminal_action
    validation:
      command: docker images alpine:latest -q | wc -l | tr -d ' '
      match_type: exact
      expected_output: '0'
    error_message: alpine:latest is still present.
    hint: docker rmi removes one or more images.

completion:
  required_tasks: all
