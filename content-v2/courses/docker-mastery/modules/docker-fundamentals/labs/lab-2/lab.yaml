id: lab-2
title: Inspecting & Managing Containers
difficulty: beginner
environment: docker-basic

setup:
  - command: "usermod -aG docker student"
  - command: >-
      docker run -d --name mystery
      -e MYSTERY_FLAVOR=vanilla
      -e MYSTERY_LEVEL=$((RANDOM % 50 + 1))
      alpine:latest sleep 3600
  - command: "docker run --name expired alpine:latest echo setup complete"

objectives:
  - Differentiate active from terminated container instances
  - Query container configuration and runtime state via docker inspect
  - Capture container log output for diagnostic triage
  - Execute container lifecycle transitions (stop and resume)
  - Perform clean container removal and process namespace teardown

tasks:
  - id: differentiate-container-states
    summary: Identify the command to list all containers regardless of status.
    prompt: >-
      Two containers (`mystery` and `expired`) currently exist in the environment.
      Which command lists all containers on the host, including those that have terminated?
    type: multiple_choice
    options:
      - "docker ps -a"
      - "docker ps --running"
      - "docker inspect --all"
      - "docker container status"
    validation:
      expected_answer: "docker ps -a"
    error_message: >-
      The selected command does not list both running and exited containers.

  - id: inspect-runtime-metadata
    summary: Extract the base image name of the mystery container into a file.
    prompt: >-
      Inspect the running `mystery` container to determine the base image from which
      it was created. Save the exact image name (e.g. `alpine:latest`) into a file
      named `~/mystery-image.txt`.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import os, sys

        path = os.path.expanduser('~/mystery-image.txt')
        if not os.path.isfile(path):
            print('File missing.')
            sys.exit(0)

        with open(path) as f:
            content = f.read().strip()

        if content in ('alpine', 'alpine:latest'):
            print('IMAGE_EXTRACTED')
        else:
            print('Incorrect image name.')
        "
      match_type: exact
      expected_output: IMAGE_EXTRACTED
    error_message: >-
      The file ~/mystery-image.txt is missing or does not contain the base image of container 'mystery'.

  - id: triage-container-logs
    summary: Extract the standard output logs of the expired container.
    prompt: >-
      The container `expired` ran a short task and terminated. Capture its complete
      standard output logs and write them to a file named `~/expired.log`.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import os, sys

        path = os.path.expanduser('~/expired.log')
        if not os.path.isfile(path):
            print('File missing.')
            sys.exit(0)

        with open(path) as f:
            content = f.read().strip()

        if 'setup complete' in content:
            print('LOGS_EXTRACTED')
        else:
            print('Incorrect logs.')
        "
      match_type: exact
      expected_output: LOGS_EXTRACTED
    error_message: >-
      The file ~/expired.log is missing or does not contain the output logs from container 'expired'.

  - id: execute-lifecycle-transitions
    summary: Stop and resume the existing mystery container entity.
    prompt: >-
      Perform the following lifecycle transition on `mystery`:
      1. Stop the running `mystery` container gracefully.
      2. Verify it is stopped, then start the container again.
      3. The container must end in an active running state without having been recreated.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, json, sys

        r = subprocess.run(['docker', 'inspect', 'mystery'], capture_output=True)
        if r.returncode != 0:
            print('Container not found.')
            sys.exit(0)

        data = json.loads(r.stdout.decode('utf-8'))[0]
        if not data['State']['Running']:
            print('Container is not running.')
            sys.exit(0)

        if data['RestartCount'] == 0 and data['State']['FinishedAt'] == '0001-01-01T00:00:00Z':
            print('Container was never stopped.')
            sys.exit(0)

        print('LIFECYCLE_OK')
        "
      match_type: exact
      expected_output: LIFECYCLE_OK
    error_message: >-
      The container 'mystery' is not running or was not stopped and restarted.

  - id: teardown-container
    summary: Completely remove all container instances from the host.
    prompt: >-
      Clean up the environment by stopping and removing both `mystery` and `expired`
      so that zero container instances remain on the system (even in exited status).
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, sys

        r = subprocess.run(['docker', 'ps', '-aq'], capture_output=True)
        out = r.stdout.decode('utf-8').strip()
        if out != '':
            print('Containers still exist.')
            sys.exit(0)

        print('TEARDOWN_OK')
        "
      match_type: exact
      expected_output: TEARDOWN_OK
    error_message: >-
      One or more container instances still exist on the host system.
