id: lab-2
title: Diagnosing a Container Failure
difficulty: beginner
environment: docker-fundamentals

setup:
  - command: "usermod -aG docker student"
  - command: >-
      docker run -d --name api-service
      -e DB_HOST=postgres-db
      -e DB_PORT=5432
      alpine:latest sleep 3600
  - command: >-
      docker run --name payment-api alpine:latest sh -c
      'echo "INFO: payment-api starting up" &&
       echo "INFO: loading config from /app/config.yaml" &&
       echo "ERROR: config file not found at /app/config.yaml" &&
       echo "FATAL: cannot start without configuration" &&
       exit 127' || true

objectives:
  - Use docker ps -a to find containers in any state
  - Use docker logs to read what a container printed before it crashed
  - Use docker inspect to extract exit codes and configuration
  - Identify the root cause of a container failure from evidence alone

tasks:
  - id: find-all-containers
    summary: Locate both the running and exited containers.
    prompt: >-
      Which command shows ALL containers, including ones that have exited?
    type: multiple_choice
    options:
      - "docker ps -a"
      - "docker ps --all-states"
      - "docker container list --exited"
      - "docker inspect --running=false"
    validation:
      expected_answer: "docker ps -a"
    error_message: >-
      The correct command is docker ps -a. The -a flag shows all containers regardless of status.

  - id: read-crash-logs
    summary: Read the logs from the crashed payment-api container.
    prompt: >-
      The `payment-api` container has exited. Run the command to read what it
      printed before it stopped, then save its last log line to `~/crash-reason.txt`.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import os, sys
        path = os.path.expanduser('~/crash-reason.txt')
        if not os.path.isfile(path):
            print('File missing.')
            sys.exit(0)
        with open(path) as f:
            content = f.read().strip()
        if 'cannot start' in content.lower() or 'config' in content.lower() or 'fatal' in content.lower():
            print('LOGS_READ')
        else:
            print('File does not contain the crash reason from docker logs.')
        "
      match_type: exact
      expected_output: LOGS_READ
    error_message: >-
      ~/crash-reason.txt is missing or does not contain the crash reason. Run docker logs payment-api and save the relevant line.

  - id: check-exit-code
    summary: Identify what exit code payment-api exited with.
    prompt: >-
      Use `docker inspect` to find out the exact exit code `payment-api` recorded when it crashed.
      Save the exit code as a plain number to `~/exit-code.txt`.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import os, sys
        path = os.path.expanduser('~/exit-code.txt')
        if not os.path.isfile(path):
            print('File missing.')
            sys.exit(0)
        with open(path) as f:
            content = f.read().strip()
        if content == '127':
            print('EXIT_CODE_OK')
        else:
            print(f'Expected 127, got: {content}')
        "
      match_type: exact
      expected_output: EXIT_CODE_OK
    error_message: >-
      ~/exit-code.txt should contain 127. Use: docker inspect payment-api --format '{{.State.ExitCode}}'

  - id: remove-failed-container
    summary: Remove the failed container and verify its lifecycle state.
    prompt: >-
      `payment-api` has already exited and you have finished inspecting it.

      Remove the stopped container, then use Docker to verify that it no longer
      exists.

      Do not remove `api-service`, which is still running.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, sys

        result = subprocess.run(
            ['docker', 'ps', '-a', '--filter', 'name=^payment-api$'],
            capture_output=True,
            text=True
        )

        lines = result.stdout.strip().splitlines()

        if len(lines) == 1:
            print('LIFECYCLE_OK')
        elif len(lines) > 1:
            print('RESULT_FAIL: payment-api still exists')
        else:
            print('RESULT_FAIL: could not verify container state')
        "
      match_type: exact
      expected_output: LIFECYCLE_OK
    error_message: >-
      `payment-api` still exists. Remove the stopped container with `docker rm`
      and verify with `docker ps -a`. Do not remove `api-service`.

  - id: inspect-running-container
    summary: Extract the DB_HOST environment variable from api-service.
    prompt: >-
      `api-service` is still running. Use `docker inspect` with a `--format` flag to extract
      only its environment variables as JSON, then save the value of `DB_HOST` to `~/db-host.txt`.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import os, sys
        path = os.path.expanduser('~/db-host.txt')
        if not os.path.isfile(path):
            print('File missing.')
            sys.exit(0)
        with open(path) as f:
            content = f.read().strip()
        if content == 'postgres-db':
            print('INSPECT_OK')
        else:
            print(f'Expected postgres-db, got: {content}')
        "
      match_type: exact
      expected_output: INSPECT_OK
    error_message: >-
      ~/db-host.txt should contain 'postgres-db'. Use docker inspect api-service --format '{{.Config.Env}}' and extract DB_HOST.

completion:
  required_tasks: all
