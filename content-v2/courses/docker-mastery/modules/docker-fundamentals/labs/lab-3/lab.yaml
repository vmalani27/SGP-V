id: lab-3
title: Runtime Configuration & Port Mapping
difficulty: beginner
environment: docker-fundamentals

setup:
  - command: "usermod -aG docker student"
  - command: "docker rm -f broken-web fixed-web config-test 2>/dev/null || true"
  - command: >-
      docker run -d --name broken-web -p 127.0.0.1:9090:80 nginx:alpine

objectives:
  - Diagnose a misconfigured port binding using docker port
  - Fix a port binding so the service is reachable from outside the host
  - Inject environment variables at runtime with -e and --env-file
  - Verify injected variables with docker inspect

tasks:
  - id: diagnose-port-binding
    summary: Find out why broken-web is unreachable from outside the host.
    prompt: >-
      A container named `broken-web` is already running. Your teammate says they can't
      reach it from their machine at port 9090, but it works fine from localhost.

      Run the command that shows exactly which address the port is bound to.
      What is the problem?
    type: multiple_choice
    options:
      - "The port is bound to 127.0.0.1 (loopback only) — traffic from other machines never reaches the container."
      - "The container is not running — docker ps shows nothing."
      - "Port 9090 is blocked by the container's internal firewall rules."
      - "nginx:alpine does not expose port 80 by default."
    validation:
      expected_answer: "The port is bound to 127.0.0.1 (loopback only) — traffic from other machines never reaches the container."
    error_message: >-
      Run 'docker port broken-web'. You will see 80/tcp -> 127.0.0.1:9090. That loopback binding is why remote access fails.

  - id: fix-port-binding
    summary: Re-deploy the container with a correct port binding.
    prompt: >-
      Remove `broken-web` and re-run it as `fixed-web` with the port bound to `0.0.0.0:9090`
      so it is reachable from any interface.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, json, sys

        r = subprocess.run(['docker', 'inspect', 'fixed-web'], capture_output=True)
        if r.returncode != 0:
            print('Container fixed-web not found.')
            sys.exit(0)

        data = json.loads(r.stdout.decode('utf-8'))[0]
        if not data['State']['Running']:
            print('Container not running.')
            sys.exit(0)

        ports = data['NetworkSettings']['Ports'].get('80/tcp', [])
        ok = any(p.get('HostIp') in ('0.0.0.0', '') and p.get('HostPort') == '9090' for p in ports)
        if not ok:
            print('Port 9090 not bound to 0.0.0.0.')
            sys.exit(0)

        print('PORT_FIXED')
        "
      match_type: exact
      expected_output: PORT_FIXED
    error_message: >-
      fixed-web is not running with port 9090 bound to 0.0.0.0. Use: docker run -d --name fixed-web -p 0.0.0.0:9090:80 nginx:alpine

  - id: inject-env-vars
    summary: Launch a container with runtime environment variables and verify them.
    prompt: >-
      Run a container named `config-test` from `alpine:latest` that:
      - Sets `APP_ENV=staging`
      - Sets `LOG_LEVEL=debug`
      - Prints the value of `APP_ENV` to stdout and exits

      Then verify both variables are present using `docker inspect`.
    type: terminal_action
    validation:
      command: |-
        python3 -c "
        import subprocess, json, sys

        r = subprocess.run(['docker', 'inspect', 'config-test'], capture_output=True)
        if r.returncode != 0:
            print('Container config-test not found.')
            sys.exit(0)

        data = json.loads(r.stdout.decode('utf-8'))[0]
        env = data['Config']['Env']

        if 'APP_ENV=staging' not in env:
            print('APP_ENV=staging not found in container env.')
            sys.exit(0)
        if 'LOG_LEVEL=debug' not in env:
            print('LOG_LEVEL=debug not found in container env.')
            sys.exit(0)

        logs = subprocess.run(['docker', 'logs', 'config-test'], capture_output=True)
        if b'staging' not in logs.stdout:
            print('Container did not print APP_ENV value.')
            sys.exit(0)

        print('ENV_OK')
        "
      match_type: exact
      expected_output: ENV_OK
    error_message: >-
      config-test is missing APP_ENV=staging, LOG_LEVEL=debug, or did not print 'staging' to stdout.

  - id: expose-vs-publish
    summary: Understand the difference between EXPOSE and -p.
    prompt: >-
      A colleague added `EXPOSE 8080` to their Dockerfile and says their container's
      port is now published. Is that correct?
    type: multiple_choice
    options:
      - "No — EXPOSE is documentation only. The -p flag at docker run time is what actually publishes the port to the host."
      - "Yes — EXPOSE automatically publishes the port to the host network."
      - "Yes — EXPOSE publishes the port but only to other containers on the same network."
      - "No — you must use PUBLISH instead of EXPOSE in the Dockerfile."
    validation:
      expected_answer: "No — EXPOSE is documentation only. The -p flag at docker run time is what actually publishes the port to the host."
    error_message: >-
      EXPOSE is documentation. Without -p at docker run time, the port is not reachable from outside the container.

completion:
  required_tasks: all
