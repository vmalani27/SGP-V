x-frontend-target: ${FRONTEND_TARGET:-dev}
services:
  frontend:
    image: ${ECR_REGISTRY:-public.ecr.aws/i9t1l0m7/vmalani27}/labops-frontend:beta
    container_name: labops-frontend-beta
    user: "0:0"
    ports:
    - 3000:3000
    volumes:
    - frontend_content:/app/.content
    environment:
    - NODE_ENV=production
    - HOSTNAME=0.0.0.0
    - PORT=3000
    - NEXT_TELEMETRY_DISABLED=1
    - NEXT_PUBLIC_ORCHESTRATOR_URL=http://localhost:8001
    - NEXT_PUBLIC_ORCHESTRATOR_SECRET=local-dev-super-secret
    - CONTENT_LOCAL_DIR=/app/.content
    - CONTENT_PUBLIC_BASE_URL=${CONTENT_PUBLIC_BASE_URL:-}
    depends_on:
    - orchestrator
    restart: unless-stopped
  orchestrator:
    image: ${ECR_REGISTRY:-public.ecr.aws/i9t1l0m7/vmalani27}/labops-orchestrator:beta
    container_name: labops-orchestrator-beta
    privileged: true
    user: "0:0"
    ports:
    - 8001:8000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      LAB_PREFIX: labops-lab
      DEMO_PREFIX: labops-demo
      LAB_TIMEOUT_MINUTES: '40'
      DEMO_TIMEOUT_MINUTES: '30'
      CONTAINER_RUNTIME_MODE: privileged
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-local-dev-super-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
    restart: unless-stopped
volumes:
  frontend_content: null
