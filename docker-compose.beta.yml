x-frontend-target: ${FRONTEND_TARGET:-dev}
x-firebase-creds:
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
services:
  backend:
    build:
      context: ./backend
    container_name: labops-backend-beta
    ports:
    - 8000:8000
    volumes:
    - ./backend:/app
    - ./environments/beta/firebase/FIREBASE_CREDS_JSON_BETA.json:/app/credentials.json:ro
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      CONTENT_PUBLIC_BASE_URL: ${CONTENT_PUBLIC_BASE_URL:-}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://host.docker.internal:8001}
      WS_ORCHESTRATOR_URL: ${WS_ORCHESTRATOR_URL:-ws://host.docker.internal:8001}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    command:
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --reload
  frontend:
    build:
      context: ./next-app
      target: ${FRONTEND_TARGET:-dev}
    container_name: labops-frontend-beta
    ports:
    - 3000:3000
    volumes:
    - ./next-app:/app
    - frontend_node_modules:/app/node_modules
    - frontend_next:/app/.next
    - frontend_content:/app/.content
    environment:
    - NODE_ENV=development
    - CHOKIDAR_USEPOLLING=true
    - NEXT_TELEMETRY_DISABLED=1
    - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    - BACKEND_API_URL=http://backend:8000
    - CONTENT_LOCAL_DIR=/app/.content
    depends_on:
    - backend
    restart: unless-stopped
volumes:
  frontend_node_modules: null
  frontend_next: null
  frontend_content: null
