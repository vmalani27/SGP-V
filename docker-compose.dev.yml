x-frontend-target: ${FRONTEND_TARGET:-dev}
x-orchestrator-target: ${ORCHESTRATOR_TARGET:-runtime}
x-firebase-creds:
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
services:
  backend:
    image: ghcr.io/vmalani27/sgp-v/backend:dev
    build:
      context: ./backend
    container_name: labops-backend-dev
    ports:
    - 8000:8000
    volumes:
    - ./backend:/app
    - ./environments/dev/firebase/FIREBASE_CREDS_JSON_DEV.json:/app/app/core/credentials.json:ro
    env_file:
    - ./environments/dev/.env.dev
    environment:
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://host.docker.internal:8001}
      WS_ORCHESTRATOR_URL: ${WS_ORCHESTRATOR_URL:-ws://host.docker.internal:8001}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    command:
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --reload
  frontend:
    image: ghcr.io/vmalani27/sgp-v/frontend:dev
    container_name: labops-frontend-dev
    ports:
    - 3000:3000
    volumes:
    - frontend_content:/app/.content
    env_file:
    - ./environments/dev/frontend/.env.dev
    environment:
    - NODE_ENV=production
    - HOSTNAME=0.0.0.0
    - PORT=3000
    - NEXT_TELEMETRY_DISABLED=1
    - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    - BACKEND_API_URL=http://backend:8000
    - CONTENT_LOCAL_DIR=/app/.content
    depends_on:
    - backend
    restart: unless-stopped
  orchestrator:
    image: ghcr.io/vmalani27/sgp-v/orchestrator:dev
    build:
      context: ./orchestrator
      target: ${ORCHESTRATOR_TARGET:-runtime}
    container_name: labops-orchestrator-dev
    privileged: true
    user: "0:0"
    ports:
    - 8001:8000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      LAB_PREFIX: labops-lab
      LAB_TIMEOUT_MINUTES: '40'
      CONTAINER_RUNTIME_MODE: privileged
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-local-dev-super-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
    restart: unless-stopped
volumes:
  frontend_node_modules: null
  frontend_next: null
  frontend_content: null
