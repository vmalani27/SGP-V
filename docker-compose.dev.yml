x-frontend-target: ${FRONTEND_TARGET:-dev}
x-orchestrator-target: ${ORCHESTRATOR_TARGET:-dev}
services:
  frontend:
    image: ${ECR_REGISTRY:-public.ecr.aws/i9t1l0m7/vmalani27}/labops-frontend:dev
    build:
      context: ./next-app
      target: ${FRONTEND_TARGET:-dev}
    container_name: labops-frontend-dev
    ports:
    - 3000:3000
    volumes:
    - ./next-app:/app
    - frontend_node_modules_v2:/app/node_modules
    - frontend_next:/app/.next
    - frontend_content:/app/.content
    env_file:
    - ./environments/dev/frontend/.env.dev
    environment:
    - NEXT_PUBLIC_ORCHESTRATOR_URL=${NEXT_PUBLIC_ORCHESTRATOR_URL:-http://localhost:8001}
    - NEXT_PUBLIC_ORCHESTRATOR_SECRET=${NEXT_PUBLIC_ORCHESTRATOR_SECRET:-local-dev-super-secret}
    - CONTENT_LOCAL_DIR=/app/.content
    - CONTENT_PUBLIC_BASE_URL=${CONTENT_PUBLIC_BASE_URL:-}
    depends_on:
    - orchestrator
    restart: unless-stopped
  orchestrator:
    image: ${ECR_REGISTRY:-public.ecr.aws/i9t1l0m7/vmalani27}/labops-orchestrator:dev
    build:
      context: ./orchestrator
      target: ${ORCHESTRATOR_TARGET:-dev}
    container_name: labops-orchestrator-dev
    privileged: true
    user: "0:0"
    ports:
    - 8001:8000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./orchestrator/app:/app/app
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      LAB_PREFIX: labops-lab
      LAB_TIMEOUT_MINUTES: '40'
      CONTAINER_RUNTIME_MODE: privileged
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-local-dev-super-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
    restart: unless-stopped
volumes:
  frontend_node_modules_v2: null
  frontend_next: null
  frontend_content: null
